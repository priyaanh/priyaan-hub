<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Security: scripts only from this site and the pinned libraries on jsDelivr, never inline; no plug-ins, no frames.
     The AI services, the picture service and the model downloads are reached with fetch (connect-src). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://www.gstatic.com 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self' https:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; media-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-src 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Procademy</title>
<meta name="description" content="Math for every grade, one skill at a time: Kindergarten to Precalculus, with hints and mastery levels. Works offline, saves on this device, with a free AI tutor.">
<meta name="theme-color" content="#1865f2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="lib/boot.js"></script>
<link rel="stylesheet" href="app.css">
</head>
<body>

    </nav>
    <div class="search">

        <span class="icon" aria-hidden="true">🔍</span>

</header>

<footer><span data-brand>Procademy</span> keeps your progress on this device, and online too if you <a href="#/profile">make an account</a>. Only what you ask the tutor is sent, to a free AI service.</footer>
