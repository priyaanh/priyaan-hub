<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">

<script>/* set the saved theme before anything paints */try{var t=localStorage.getItem('ph.theme');if(t==='system'||!t)t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t)}catch(e){}</script><style>
/* ---- layout ---- */
main > * + * { margin-top: 1rem; }
[lang="hi"] { line-height: 1.6; }
.card-head .row { gap: .5rem; }

/* ---- chapter picker ---- */
.chips { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .85rem; }
.chip {
  display: flex; flex-direction: column; gap: .3rem; flex: 1 1 12rem; max-width: 18rem; min-width: 0; text-align: left;
  padding: .55rem .75rem; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface);
  color: var(--text); font: inherit; cursor: pointer; transition: background .12s, border-color .12s;
}
.chip:hover { border-color: var(--accent-text); background: var(--surface-2); }
.chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.chip[aria-pressed="true"] { border-color: var(--accent-text); background: var(--accent-soft); }
.chip .t { font-weight: 700; display: flex; gap: .45rem; align-items: baseline; }
.chip .t .n { color: var(--muted); font-size: .8rem; font-weight: 700; min-width: 1.2rem; }
.chip .m { font-size: .78rem; color: var(--muted); }
.chip .progress { height: 4px; }
.chip.due { flex: 1 1 100%; max-width: none; flex-direction: row; align-items: center; justify-content: space-between; }
.chip.due .t { color: var(--accent-text); }
@media (max-width: 560px) { .chip { flex-basis: 100%; max-width: none; } }

/* ---- flashcards ---- */
.flash-tools { margin-bottom: .25rem; }
.flashcard { position: relative; height: clamp(215px, 42vw, 300px); perspective: 1200px; cursor: pointer; margin: .75rem 0 0; outline: none; -webkit-tap-highlight-color: transparent; }
.flashcard:focus-visible .inner { outline: 2px solid var(--accent); outline-offset: 3px; }
.flashcard .inner { position: absolute; inset: 0; transition: transform .4s; transform-style: preserve-3d; border-radius: var(--radius); }
.flashcard.flipped .inner { transform: rotateY(180deg); }
.face {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .3rem;
  padding: 1.4rem 1.5rem 1.8rem; text-align: center; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface-2);
  backface-visibility: hidden; -webkit-backface-visibility: hidden; overflow: hidden;
}
.face.back { transform: rotateY(180deg); background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
.face .word { font-size: clamp(2rem, 7vw, 3.2rem); font-weight: 800; line-height: 1.4; overflow-wrap: anywhere; }
.face.back .word { font-size: clamp(1.5rem, 5vw, 2.1rem); }
.face .prompt-en { font-size: clamp(1.5rem, 5vw, 2.4rem); font-weight: 800; line-height: 1.25; }
.face .tr { font-style: italic; color: var(--muted); }
.face .en { font-size: 1.25rem; font-weight: 700; }
.face .hint { color: var(--muted); }
.face .tap { position: absolute; bottom: .55rem; left: 0; right: 0; font-size: .75rem; color: var(--muted); }
.face .box { position: absolute; top: .6rem; right: .6rem; }
@media (prefers-reduced-motion: reduce) { .flashcard .inner { transition: none; } }
.rate { justify-content: center; margin-top: .85rem; }
.rate .btn { min-width: 8.5rem; }
.rate .btn-icon { min-width: 0; }
.rate .kbd { margin-left: .15rem; }
.deck-progress { display: flex; align-items: center; gap: .75rem; margin-top: .75rem; }
.deck-progress .progress { flex: 1; }
.deck-progress .pos { font-variant-numeric: tabular-nums; white-space: nowrap; }
.done-panel { text-align: center; padding: 2.2rem 1rem; border: 1px dashed var(--border); border-radius: var(--radius); margin-top: .75rem; }
.done-panel .big { font-size: 2rem; }
.speak-opt { margin-top: .5rem; padding: .35rem .5rem; }
.speak-opt .txt { font-size: .875rem; color: var(--muted); }

/* ---- quiz ---- */
.q-head { display: flex; justify-content: space-between; gap: 1rem; align-items: center; flex-wrap: wrap; }
.q-word { font-size: clamp(1.6rem, 6vw, 2.6rem); font-weight: 800; text-align: center; margin: .9rem 0 1.1rem; line-height: 1.4; overflow-wrap: anywhere; }
.q-opts { display: grid; gap: .55rem; grid-template-columns: 1fr; }
@media (min-width: 620px) { .q-opts { grid-template-columns: 1fr 1fr; } }
.q-opt {
  display: flex; align-items: center; gap: .7rem; text-align: left; padding: .7rem .9rem; border-radius: var(--radius-sm);
  border: 1px solid var(--border); background: var(--surface); color: var(--text); font: inherit; font-size: 1.05rem; cursor: pointer; min-width: 0;
}
.q-opt:hover { border-color: var(--accent-text); background: var(--surface-2); }
.q-opt:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.q-opt .n { display: inline-grid; place-items: center; width: 1.6rem; height: 1.6rem; border-radius: 50%; background: var(--surface-2); font-size: .8rem; font-weight: 700; color: var(--muted); flex: none; }
.q-opt .o { overflow-wrap: anywhere; }
.q-opt.right { border-color: var(--ok); background: var(--ok-soft); }
.q-opt.wrong { border-color: var(--danger); background: var(--danger-soft); }
.q-opt:disabled { cursor: default; }
.q-opt:disabled:not(.right):not(.wrong) { opacity: .55; }
.q-feedback { margin-top: .85rem; display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; font-weight: 700; }
.q-feedback.ok { color: var(--ok); } .q-feedback.bad { color: var(--danger); }
.q-feedback .ans { font-weight: 600; color: var(--text); }
.q-score { text-align: center; padding: 1.25rem 1rem .5rem; }
.q-score .big { font-size: 2.6rem; font-weight: 800; color: var(--accent-text); line-height: 1.1; }
.q-hist { font-size: .875rem; color: var(--muted); margin-top: .75rem; }
.q-hist li { padding: .35rem 0; }

/* ---- word list ---- */
.wl-tools { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
.wl-tools .input { width: auto; flex: 1 1 10rem; max-width: 16rem; }
.table td.hi { font-size: 1.1rem; font-weight: 700; white-space: nowrap; }
.table td.tr { font-style: italic; color: var(--muted); }
.table td.actions { text-align: right; white-space: nowrap; }
.table .btn-sm { padding: .25rem .55rem; }
@media (max-width: 640px) { .table .hide-sm { display: none; } }
.print-list { display: none; }

/* ---- my words ---- */
.mine-form { display: grid; gap: .6rem; grid-template-columns: 1fr; align-items: end; }
@media (min-width: 720px) { .mine-form { grid-template-columns: 1fr 1fr 1fr 1fr auto; } }
.mine-list .hi { font-weight: 700; font-size: 1.05rem; }
.mine-list .txt { flex: 1; min-width: 0; }

/* ---- print: only the word list ---- */
@media print {
  .stats, #picker, #flash, #quiz, #mine, .wl-tools, #wordlist .table-wrap, #wordlist .card-head .small { display: none !important; }
  #wordlist { border: 0; padding: 0; box-shadow: none; }
  .print-list { display: block; column-count: 2; column-gap: 2rem; font-size: 11pt; }
  .print-list h2 { column-span: all; margin-bottom: .5rem; }
  .print-list .sub { column-span: all; color: #555; margin-bottom: .75rem; }
  .print-list .pi { break-inside: avoid; padding: .3rem 0; border-bottom: 1px solid #ddd; }
  .print-list .pi b { font-size: 1.2em; }
  .print-list .pi i { color: #555; }
  .print-list .pi .h { color: #555; }
}
</style></head>
<body data-app="hindi">

      <div class="field"><label for="m-hi">Hindi</label><input class="input" id="m-hi" lang="hi" maxlength="60" placeholder="शब्द" autocomplete="off"></div>

      <div class="field"><label for="m-hint">Hint (optional)</label><input class="input" id="m-hint" lang="hi" maxlength="80" placeholder="वाक्य में प्रयोग / synonym" autocomplete="off"></div>

<script src="shared.js"></script>
<script src="hindi_data.js"></script>
<script>
(function () {
  'use strict';
  const KEY = 'ph.hindi.v1';
  const INTERVALS = [0, 1, 3, 7, 21]; // Leitner boxes 0–4 → days until the card is due again
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  const esc = PH.esc;
  const today = () => PH.todayISO();

  /* ===================== Content: NCERT Malhar (मल्हार) Class 6 and 7 =====================
     One entry per line so a parent can edit. A card's id is ch + ':' + hi, so keep `hi` stable. */
  const CHAPTERS = (window.HINDI && window.HINDI.CHAPTERS) || [];

  const CARDS = (window.HINDI && window.HINDI.CARDS) || [];

  const MINE = { id: 'mine', cls: 'mine', n: 0, title: 'My words', genre: '', author: '' };
  const cardId = c => c.ch + ':' + c.hi;

  /* ===================== State ===================== */
  function isObj(v) { return !!v && typeof v === 'object' && !Array.isArray(v); }
  function validISO(s) {
    if (typeof s !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
    const d = new Date(s + 'T00:00:00'); return !isNaN(d.getTime()) && PH.todayISO(d) === s;
  }
  function nonneg(v) { const n = Math.round(Number(v)); return Number.isFinite(n) && n > 0 ? n : 0; }
  function str(v, max) { return typeof v === 'string' ? v.trim().slice(0, max || 80) : ''; }
  function blank() {
    return { version: 1, progress: {}, quizzes: [], custom: [], days: {},
      settings: { cls: 6, ch: 'c6-01', dir: 'hi-en', speak: false }, summary: { headline: '', sub: '' } };
  }
  /** Turn anything (old data, a hand-edited file, garbage) into a valid state object. */
  function normalise(raw) {
    const s = blank();
    if (!isObj(raw)) return s;
    if (isObj(raw.progress)) Object.keys(raw.progress).forEach(k => {
      const p = raw.progress[k];
      if (!isObj(p) || k.indexOf(':') < 1) return;
      const box = Math.min(4, nonneg(p.box));
      s.progress[k] = { box, due: validISO(p.due) ? p.due : today(), seen: nonneg(p.seen), right: nonneg(p.right), wrong: nonneg(p.wrong), last: validISO(p.last) ? p.last : '' };
    });
    if (Array.isArray(raw.quizzes)) s.quizzes = raw.quizzes
      .filter(q => isObj(q) && validISO(q.date) && typeof q.ch === 'string')
      .map(q => ({ date: q.date, ch: q.ch, right: nonneg(q.right), total: Math.max(1, nonneg(q.total)) })).slice(-200);
    if (Array.isArray(raw.custom)) raw.custom.forEach(c => {
      if (!isObj(c)) return;
      const hi = str(c.hi, 60), en = str(c.en, 80);
      if (hi && en && !s.custom.some(x => x.hi === hi)) s.custom.push({ hi, tr: str(c.tr, 60), en, hint: str(c.hint, 80) });
    });
    if (isObj(raw.days)) Object.keys(raw.days).forEach(d => { if (validISO(d) && nonneg(raw.days[d])) s.days[d] = nonneg(raw.days[d]); });
    if (isObj(raw.settings)) {
      const st = raw.settings;
      if (String(st.cls) === '7') s.settings.cls = 7; else if (st.cls === 'mine') s.settings.cls = 'mine';
      if (typeof st.ch === 'string' && (st.ch === 'mine' || st.ch === 'due' || CHAPTERS.some(c => c.id === st.ch))) s.settings.ch = st.ch;
      if (st.dir === 'en-hi') s.settings.dir = 'en-hi';
      s.settings.speak = st.speak === true;
    }
    // Keep the class tab in step with the selected chapter.
    const chap = CHAPTERS.filter(c => c.id === s.settings.ch)[0];
    if (chap) s.settings.cls = chap.cls; else if (s.settings.ch === 'mine') s.settings.cls = 'mine';
    return s;
  }
  const stored = PH.load(KEY, null);
  let state = normalise(stored);
  function save() { state.summary = buildSummary(); PH.save(KEY, state); }

  /* ===================== Card helpers ===================== */
  function allCards() { return CARDS.concat(state.custom.map(c => ({ ch: 'mine', hi: c.hi, tr: c.tr, en: c.en, hint: c.hint }))); }
  function chapterById(id) { if (id === 'mine') return MINE; return CHAPTERS.filter(c => c.id === id)[0] || null; }
  function prog(c) { return state.progress[cardId(c)] || null; }
  function isDue(c, t) { const p = prog(c); return !!p && p.due <= t; }
  function dueCards() { const t = today(); return allCards().filter(c => isDue(c, t)); }
  function cardsOf(chId) { return chId === 'due' ? dueCards() : allCards().filter(c => c.ch === chId); }
  function classCards(cls) {
    if (cls === 'mine') return allCards().filter(c => c.ch === 'mine');
    return allCards().filter(c => { const ch = chapterById(c.ch); return ch && ch.cls === cls; });
  }
  function learnedCount(cards) { return cards.filter(c => { const p = prog(c); return p && p.box >= 3; }).length; }
  function streak() {
    let d = today(), n = 0;
    if (!state.days[d]) d = PH.addDays(d, -1);
    while (state.days[d]) { n++; d = PH.addDays(d, -1); }
    return n;
  }
  function chapterTitle(id) { if (id === 'due') return 'Due today'; const ch = chapterById(id); return ch ? ch.title : ''; }
  function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function plural(n, w) { return n + ' ' + w + (n === 1 ? '' : 's'); }

  /** Leitner update. ok=true → box+1 (max 4); ok=false → box 0. Records one review for today's streak. */
  function rate(c, ok) {
    const id = cardId(c), t = today();
    const p = state.progress[id] || { box: 0, due: t, seen: 0, right: 0, wrong: 0, last: '' };
    if (ok) { p.box = Math.min(4, p.box + 1); p.right++; } else { p.box = 0; p.wrong++; }
    p.due = PH.addDays(t, INTERVALS[p.box]); p.seen++; p.last = t;
    state.progress[id] = p;
    state.days[t] = (state.days[t] || 0) + 1;
  }

  function buildSummary() {
    const reviewed = Object.keys(state.progress).length;
    if (!reviewed && !state.quizzes.length) return { headline: '', sub: '' };
    const s = streak(), learned = learnedCount(allCards()), due = dueCards().length;
    const headline = s >= 2 ? '🔥 ' + s + '-day streak' : learned ? plural(learned, 'word') + ' learned' : plural(reviewed, 'word') + ' reviewed';
    const title = state.settings.ch === 'due' ? '' : chapterTitle(state.settings.ch);
    return { headline, sub: due + ' due today' + (title ? ' · last: ' + title : '') };
  }

  /* ===================== Speech ===================== */
  const canSpeak = typeof window.speechSynthesis !== 'undefined' && typeof window.SpeechSynthesisUtterance !== 'undefined';
  function speak(text) {
    if (!canSpeak || !text) return;
    try {
      const u = new SpeechSynthesisUtterance(text); u.lang = 'hi-IN'; u.rate = 0.85;
      const voices = speechSynthesis.getVoices ? speechSynthesis.getVoices() : [];
      const v = voices.filter(x => /^hi([-_]|$)/i.test(x.lang || ''))[0];
      if (v) u.voice = v;
      speechSynthesis.cancel(); speechSynthesis.speak(u);
    } catch (e) { /* no voice available: stay silent */ }
  }

  /* ===================== Flashcards ===================== */
  const deck = { cards: [], i: 0, flipped: false };
  function buildDeck() {
    const t = today();
    const cards = cardsOf(state.settings.ch).slice();
    const rank = c => { const p = prog(c); return !p ? 1 : p.due <= t ? 0 : 2; }; // due first, then new, then the rest
    const dueOf = c => { const p = prog(c); return p ? p.due : ''; };
    cards.sort((a, b) => rank(a) - rank(b) || dueOf(a).localeCompare(dueOf(b)));
    deck.cards = cards; deck.i = 0; deck.flipped = false;
  }
  function currentCard() { return deck.i < deck.cards.length ? deck.cards[deck.i] : null; }
  function boxPill(c) {
    const p = prog(c);
    if (!p) return '<span class="pill neutral">new</span>';
    const cls = p.box >= 3 ? 'ok' : p.box >= 1 ? '' : 'warn';
    return '<span class="pill ' + cls + '">box ' + p.box + '</span>';
  }
  function renderFlash() {
    const ch = state.settings.ch;
    $('#deck-name').textContent = chapterTitle(ch);
    $$('#dir-tabs .tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.dir === state.settings.dir)));
    const body = $('#flash-body'), n = deck.cards.length, c = currentCard();
    $('#speak-opt').hidden = !canSpeak;
    $('#speak-auto').checked = !!state.settings.speak;
    if (!n) {
      body.innerHTML = '<div class="done-panel"><div class="big">' + (ch === 'due' ? '🎉' : '📭') + '</div><p>' +
        (ch === 'due' ? 'Nothing is due right now. Pick a chapter to learn new words.' : ch === 'mine' ? 'No words of your own yet. Add some below.' : 'This chapter has no cards yet.') + '</p></div>';
      return;
    }
    const pos = '<div class="deck-progress"><span class="small muted pos" id="deck-pos">' + Math.min(deck.i + 1, n) + ' / ' + n + '</span>' +
      '<div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="' + n + '" aria-valuenow="' + deck.i + '"><i style="width:' + Math.round(deck.i / n * 100) + '%"></i></div></div>';
    if (!c) {
      const learned = learnedCount(deck.cards);
      body.innerHTML = pos + '<div class="done-panel"><div class="big">🎉</div><h3>Deck finished</h3><p class="muted">' +
        learned + ' of ' + n + ' words are in box 3 or higher. Come back tomorrow for the ones that are due.</p>' +
        '<button type="button" class="btn btn-primary" id="btn-again-deck">↻ Go again</button></div>';
      return;
    }
    const hiEn = state.settings.dir === 'hi-en';
    const front = hiEn
      ? '<div class="word" lang="hi">' + esc(c.hi) + '</div>'
      : '<div class="prompt-en">' + esc(c.en) + '</div>';
    const back = '<div class="word" lang="hi">' + esc(c.hi) + '</div>' +
      (c.tr ? '<div class="tr">' + esc(c.tr) + '</div>' : '') +
      '<div class="en">' + esc(c.en) + '</div>' +
      (c.hint ? '<div class="hint" lang="hi">' + esc(c.hint) + '</div>' : '');
    body.innerHTML = pos +
      '<div class="flashcard' + (deck.flipped ? ' flipped' : '') + '" id="fcard" tabindex="0" role="button" aria-pressed="' + deck.flipped + '" aria-label="Flashcard: press Space or Enter to flip">' +
        '<div class="inner">' +
          '<div class="face front">' + boxPill(c) + front + '<div class="tap">tap or press Space to flip</div></div>' +
          '<div class="face back">' + back + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="row rate">' +
        '<button type="button" class="btn btn-danger" id="btn-again">✗ Again <span class="kbd">1</span></button>' +
        '<button type="button" class="btn btn-primary" id="btn-got">✓ Got it <span class="kbd">2</span></button>' +
        (canSpeak ? '<button type="button" class="btn btn-icon" id="btn-speak" aria-label="Hear the word" title="Hear the word">🔊</button>' : '') +
      '</div>';
  }
  function flip() {
    const c = currentCard(); if (!c) return;
    deck.flipped = !deck.flipped;
    const el = $('#fcard'); if (el) { el.classList.toggle('flipped', deck.flipped); el.setAttribute('aria-pressed', String(deck.flipped)); }
    // Say the word when the Hindi side comes into view (auto-speak is opt-in).
    if (state.settings.speak && ((state.settings.dir === 'hi-en' && !deck.flipped) || (state.settings.dir === 'en-hi' && deck.flipped))) speak(c.hi);
  }
  function rateCurrent(ok) {
    const c = currentCard(); if (!c) return;
    rate(c, ok); deck.i++; deck.flipped = false;
    save(); renderFlash(); renderStats(); renderChips(); renderList();
    const nx = currentCard();
    if (nx && state.settings.speak && state.settings.dir === 'hi-en') speak(nx.hi);
  }

  /* ===================== Quiz ===================== */
  const quiz = { active: false, qs: [], i: 0, right: 0, answered: null, ch: '', result: null };
  function quizPool() {
    const ch = state.settings.ch;
    let pool = cardsOf(ch);
    const chap = ch === 'due' ? null : chapterById(ch);
    let wide = chap ? classCards(chap.cls) : allCards();
    if (wide.length < 8) wide = allCards();
    if (pool.length < 8) pool = wide;
    return { pool, wide };
  }
  function startQuiz() {
    const { pool, wide } = quizPool();
    if (pool.length < 4) { PH.toast('Not enough words for a quiz yet'); return; }
    const picks = shuffle(pool.slice()).slice(0, 10);
    quiz.qs = picks.map(c => {
      const dir = Math.random() < 0.5 ? 'hi-en' : 'en-hi';
      const key = dir === 'hi-en' ? 'en' : 'hi';
      const used = {}; used[c[key]] = true;
      const distractors = [];
      shuffle(wide.slice()).forEach(x => { if (distractors.length < 3 && x !== c && x[key] && !used[x[key]]) { used[x[key]] = true; distractors.push(x); } });
      return { card: c, dir, key, opts: shuffle([c].concat(distractors)) };
    });
    quiz.active = true; quiz.i = 0; quiz.right = 0; quiz.answered = null; quiz.ch = state.settings.ch; quiz.result = null;
    renderQuiz();
    const first = $('#quiz .q-opt'); if (first) first.focus();
  }
  function answer(k) {
    if (!quiz.active || quiz.answered !== null) return;
    const q = quiz.qs[quiz.i]; if (k < 0 || k >= q.opts.length) return;
    quiz.answered = k;
    const ok = q.opts[k] === q.card;
    if (ok) quiz.right++;
    rate(q.card, ok); save();
    renderQuiz(); renderStats(); renderChips(); renderList();
    const nb = $('#btn-next-q'); if (nb) nb.focus();
  }
  function nextQ() {
    if (!quiz.active || quiz.answered === null) return;
    quiz.i++; quiz.answered = null;
    if (quiz.i >= quiz.qs.length) finishQuiz(); else { renderQuiz(); const f = $('#quiz .q-opt'); if (f) f.focus(); }
  }
  function finishQuiz() {
    quiz.active = false;
    quiz.result = { date: today(), ch: quiz.ch, right: quiz.right, total: quiz.qs.length };
    state.quizzes.push(quiz.result); state.quizzes = state.quizzes.slice(-200);
    save(); renderQuiz(); renderStats();
  }
  function encouragement(r, t) { // [Hindi cheer, English follow-up]
    const f = r / t;
    if (f === 1) return ['शाबाश!', 'Perfect score!'];
    if (f >= 0.8) return ['बहुत अच्छा!', 'Great work.'];
    if (f >= 0.5) return ['अच्छा!', 'Keep going, you are getting there.'];
    return ['कोई बात नहीं।', 'Review the cards and try again.'];
  }
  function renderQuiz() {
    const body = $('#quiz-body');
    const { pool } = quizPool();
    const chTitle = chapterTitle(state.settings.ch);
    const chap = state.settings.ch === 'due' ? null : chapterById(state.settings.ch);
    const fromWholeClass = pool.length !== cardsOf(state.settings.ch).length || cardsOf(state.settings.ch).length < 8;
    $('#quiz-sub').innerHTML = '10 questions · ' + (fromWholeClass ? (chap && chap.cls !== 'mine' ? 'all of Class ' + chap.cls : 'all words') : '<span lang="hi">' + esc(chTitle) + '</span>');
    if (quiz.active) {
      const q = quiz.qs[quiz.i];
      const prompt = q.dir === 'hi-en' ? '<div class="q-word" lang="hi">' + esc(q.card.hi) + '</div>' : '<div class="q-word">' + esc(q.card.en) + '</div>';
      const opts = q.opts.map((o, i) => {
        let cls = 'q-opt';
        if (quiz.answered !== null) { if (o === q.card) cls += ' right'; else if (i === quiz.answered) cls += ' wrong'; }
        const txt = q.dir === 'hi-en' ? esc(o.en) : '<span lang="hi">' + esc(o.hi) + '</span>';
        return '<button type="button" class="' + cls + '" data-opt="' + i + '"' + (quiz.answered !== null ? ' disabled' : '') + '><span class="n">' + (i + 1) + '</span><span class="o">' + txt + '</span></button>';
      }).join('');
      let fb = '';
      if (quiz.answered !== null) {
        const ok = q.opts[quiz.answered] === q.card;
        fb = '<div class="q-feedback ' + (ok ? 'ok' : 'bad') + '"><span>' + (ok ? '✓ Correct!' : '✗ Not quite. ') +
          (ok ? '' : '<span class="ans"><span lang="hi">' + esc(q.card.hi) + '</span> = ' + esc(q.card.en) + '</span>') +
          (q.card.tr ? ' <span class="muted small">(' + esc(q.card.tr) + ')</span>' : '') + '</span>' +
          '<button type="button" class="btn btn-primary btn-sm" id="btn-next-q">' + (quiz.i + 1 < quiz.qs.length ? 'Next →' : 'See score') + ' <span class="kbd">↵</span></button></div>';
      }
      body.innerHTML = '<div class="q-head"><span class="muted small">Question ' + (quiz.i + 1) + ' of ' + quiz.qs.length + ' · ' + quiz.right + ' right</span>' +
        '<button type="button" class="btn btn-ghost btn-sm" id="btn-quit-q">Stop quiz</button></div>' +
        '<div class="progress"><i style="width:' + Math.round(quiz.i / quiz.qs.length * 100) + '%"></i></div>' +
        prompt + '<div class="q-opts" role="group" aria-label="Answers">' + opts + '</div>' + fb;
      return;
    }
    let html = '';
    if (quiz.result) {
      const r = quiz.result, cheer = encouragement(r.right, r.total);
      html += '<div class="q-score"><div class="big">' + r.right + ' / ' + r.total + '</div><p><span lang="hi">' + esc(cheer[0]) + '</span> ' + esc(cheer[1]) + '</p></div>';
    }
    html += '<div class="row"><button type="button" class="btn btn-primary" id="btn-start-q">' + (quiz.result ? '↻ Quiz again' : '▶ Start quiz') + '</button>' +
      '<span class="muted small">Multiple choice, both directions. Keys <span class="kbd">1</span>–<span class="kbd">4</span> answer.</span></div>';
    const recent = state.quizzes.slice(-5).reverse();
    if (recent.length) {
      html += '<ul class="list q-hist">' + recent.map(q => '<li><span>' + esc(PH.fmtDate(q.date)) + '</span><span lang="hi">' + esc(chapterTitle(q.ch) || q.ch) + '</span><span class="spacer" style="flex:1"></span><span class="pill ' + (q.right / q.total >= 0.8 ? 'ok' : q.right / q.total >= 0.5 ? '' : 'warn') + '">' + q.right + '/' + q.total + '</span></li>').join('') + '</ul>';
    }
    body.innerHTML = html;
  }

  /* ===================== Word list ===================== */
  function renderList() {
    const q = ($('#search').value || '').trim().toLowerCase();
    let cards, searching = !!q;
    if (searching) cards = allCards().filter(c => [c.hi, c.tr, c.en, c.hint].some(v => String(v || '').toLowerCase().indexOf(q) > -1));
    else cards = cardsOf(state.settings.ch);
    const title = chapterTitle(state.settings.ch);
    const chap = state.settings.ch === 'due' ? null : chapterById(state.settings.ch);
    $('#list-sub').innerHTML = searching ? plural(cards.length, 'match') + ' in all chapters' : '<span lang="hi">' + esc(title) + '</span> · ' + plural(cards.length, 'word');
    const wrap = $('#list-wrap');
    if (!cards.length) { wrap.innerHTML = '<div class="empty">' + (searching ? 'No words match “' + esc(q) + '”.' : 'No words here yet.') + '</div>'; }
    else {
      const rows = cards.map(c => {
        const p = prog(c);
        const chCol = searching ? '<td class="hide-sm small muted" lang="hi">' + esc(c.ch === 'mine' ? 'My words' : (chapterById(c.ch) || {}).title || '') + '</td>' : '';
        const acts = (p ? '<button type="button" class="btn btn-sm" data-reset="' + esc(cardId(c)) + '" title="Forget progress for this word">reset</button>' : '') +
          (c.ch === 'mine' ? ' <button type="button" class="btn btn-sm btn-danger" data-del="' + esc(c.hi) + '">delete</button>' : '');
        return '<tr><td class="hi" lang="hi">' + esc(c.hi) + '</td><td class="tr hide-sm">' + esc(c.tr) + '</td><td>' + esc(c.en) + '</td>' +
          '<td class="hide-sm muted" lang="hi">' + esc(c.hint) + '</td>' + chCol + '<td>' + boxPill(c) + (p ? '<div class="small muted">due ' + esc(PH.fmtDate(p.due, { month: 'short', day: 'numeric' })) + '</div>' : '') + '</td>' +
          '<td class="actions">' + acts + '</td></tr>';
      }).join('');
      wrap.innerHTML = '<table class="table"><thead><tr><th lang="hi">शब्द</th><th class="hide-sm">Say it</th><th>Meaning</th><th class="hide-sm">Hint</th>' + (searching ? '<th class="hide-sm">Chapter</th>' : '') + '<th>Box</th><th></th></tr></thead><tbody>' + rows + '</tbody></table>';
    }
    // Print version: same words as a two-column list.
    $('#print-list').innerHTML = '<h2>' + (searching ? 'Hindi words matching “' + esc(q) + '”' : '<span lang="hi">' + esc(title) + '</span>' + (chap && chap.cls !== 'mine' ? ' · ' + esc(chap.genre) + (chap.author ? ' · ' + esc(chap.author) : '') + ' · Class ' + chap.cls : '')) + '</h2>' +
      '<div class="sub">Malhar (मल्हार) vocabulary · ' + plural(cards.length, 'word') + '</div>' +
      cards.map(c => '<div class="pi"><b lang="hi">' + esc(c.hi) + '</b> <i>' + esc(c.tr) + '</i> — ' + esc(c.en) + (c.hint ? ' <span class="h" lang="hi">(' + esc(c.hint) + ')</span>' : '') + '</div>').join('');
  }
  function resetWord(id) {
    if (!state.progress[id]) return;
    delete state.progress[id];
    save(); renderAll(); PH.toast('Progress reset');
  }

  /* ===================== My words ===================== */
  function renderMine() {
    const ul = $('#mine-list');
    if (!state.custom.length) { ul.innerHTML = '<li class="muted small">Your own words show up here and under the “My words” tab above.</li>'; return; }
    ul.innerHTML = state.custom.map(c => '<li><span class="txt"><span class="hi" lang="hi">' + esc(c.hi) + '</span>' + (c.tr ? ' <span class="muted small">' + esc(c.tr) + '</span>' : '') +
      ' — ' + esc(c.en) + (c.hint ? ' <span class="muted small" lang="hi">(' + esc(c.hint) + ')</span>' : '') + '</span>' +
      '<button type="button" class="btn btn-sm btn-danger" data-del="' + esc(c.hi) + '">Delete</button></li>').join('');
  }
  function addMine(e) {
    e.preventDefault();
    const hi = str($('#m-hi').value, 60), tr = str($('#m-tr').value, 60), en = str($('#m-en').value, 80), hint = str($('#m-hint').value, 80);
    if (!hi || !en) { PH.toast('Hindi word and meaning are both needed'); (hi ? $('#m-en') : $('#m-hi')).focus(); return; }
    if (state.custom.some(c => c.hi === hi)) { PH.toast('That word is already in My words'); return; }
    state.custom.push({ hi, tr, en, hint });
    $('#mine-form').reset();
    state.settings.cls = 'mine'; state.settings.ch = 'mine'; quiz.active = false;
    save(); buildDeck(); renderAll(); PH.toast('Added ' + hi);
    $('#m-hi').focus();
  }
  function deleteMine(hi) {
    const i = state.custom.findIndex(c => c.hi === hi); if (i < 0) return;
    state.custom.splice(i, 1); delete state.progress['mine:' + hi];
    save(); buildDeck(); renderAll(); PH.toast('Deleted ' + hi);
  }

  /* ===================== Picker, stats ===================== */
  function renderStats() {
    const cards = allCards();
    $('#st-learned').textContent = learnedCount(cards);
    $('#st-due').textContent = dueCards().length;
    $('#st-today').textContent = state.days[today()] || 0;
    $('#st-streak').textContent = streak();
  }
  function renderTabs() { $$('#cls-tabs .tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.cls === String(state.settings.cls)))); }
  function renderChips() {
    const cls = state.settings.cls, cur = state.settings.ch;
    const due = dueCards().length;
    const chapters = cls === 'mine' ? [MINE] : CHAPTERS.filter(c => c.cls === cls);
    const dueChip = '<button type="button" class="chip due" data-ch="due" aria-pressed="' + (cur === 'due') + '"><span class="t">📅 Due today</span><span class="m">' + plural(due, 'word') + ' across all chapters</span></button>';
    const chips = chapters.map(ch => {
      const cards = cardsOf(ch.id), n = cards.length, learned = learnedCount(cards), pct = n ? Math.round(learned / n * 100) : 0;
      return '<button type="button" class="chip" data-ch="' + ch.id + '" aria-pressed="' + (cur === ch.id) + '">' +
        '<span class="t">' + (ch.n ? '<span class="n">' + ch.n + '</span>' : '') + '<span lang="hi">' + esc(ch.title) + '</span></span>' +
        '<span class="m">' + (ch.genre ? '<span lang="hi">' + esc(ch.genre) + '</span> · ' : '') + plural(n, 'word') + ' · ' + pct + '% learned</span>' +
        '<span class="progress" aria-hidden="true"><i style="width:' + pct + '%"></i></span></button>';
    }).join('');
    $('#chips').innerHTML = dueChip + chips;
  }
  function renderAll() { renderStats(); renderTabs(); renderChips(); renderFlash(); renderQuiz(); renderList(); renderMine(); }

  function selectChapter(id) {
    state.settings.ch = id;
    if (id !== 'due') { const ch = chapterById(id); if (ch) state.settings.cls = ch.cls; }
    quiz.active = false; quiz.result = null;
    $('#search').value = '';
    save(); buildDeck(); renderAll();
  }

  /* ===================== Backup file: export and restore ===================== */
  function exportJSON() {
    const out = Object.assign({ app: 'ph.hindi', exported: new Date().toISOString() }, state);
    PH.download('priyaan-hindi-' + today() + '.json', JSON.stringify(out, null, 2));
    PH.toast('Progress exported');
  }
  function importJSON() {
    PH.pickFile('application/json,.json').then(text => {
      if (!text) return;
      let obj;
      try { obj = JSON.parse(text); } catch (e) { PH.toast('That file is not valid JSON'); return; }
      if (isObj(obj) && isObj(obj.data) && obj.data[KEY] != null) { // whole-hub backup file
        const v = obj.data[KEY];
        try { obj = typeof v === 'string' ? JSON.parse(v) : v; } catch (e) { obj = null; }
      }
      if (!isObj(obj) || !(isObj(obj.progress) || Array.isArray(obj.custom) || Array.isArray(obj.quizzes))) { PH.toast('No Hindi flashcard data found in that file'); return; }
      const inc = normalise(obj);
      let n = 0, c = 0;
      Object.keys(inc.progress).forEach(k => {
        const cur = state.progress[k], p = inc.progress[k];
        if (!cur || (p.last || '') >= (cur.last || '')) { state.progress[k] = p; n++; }
      });
      inc.custom.forEach(w => { if (!state.custom.some(x => x.hi === w.hi)) { state.custom.push(w); c++; } });
      inc.quizzes.forEach(q => { if (!state.quizzes.some(x => x.date === q.date && x.ch === q.ch && x.right === q.right && x.total === q.total)) state.quizzes.push(q); });
      state.quizzes.sort((a, b) => a.date.localeCompare(b.date)); state.quizzes = state.quizzes.slice(-200);
      Object.keys(inc.days).forEach(d => { state.days[d] = Math.max(state.days[d] || 0, inc.days[d]); });
      save(); buildDeck(); renderAll();
      PH.toast('Imported ' + plural(n, 'word') + (c ? ' and ' + plural(c, 'custom word') : ''), 2600);
    });
  }

  /* ===================== Events ===================== */
  $('#cls-tabs').addEventListener('click', e => {
    const t = e.target.closest('.tab'); if (!t) return;
    const cls = t.dataset.cls === 'mine' ? 'mine' : Number(t.dataset.cls);
    if (cls === state.settings.cls) return;
    const cur = state.settings.ch === 'due' ? null : chapterById(state.settings.ch);
    const first = cls === 'mine' ? MINE : CHAPTERS.filter(c => c.cls === cls)[0];
    if (!cur || cur.cls !== cls) selectChapter(first.id); else { state.settings.cls = cls; save(); renderTabs(); renderChips(); }
  });
  $('#chips').addEventListener('click', e => { const b = e.target.closest('.chip'); if (b) selectChapter(b.dataset.ch); });
  $('#dir-tabs').addEventListener('click', e => {
    const t = e.target.closest('.tab'); if (!t || t.dataset.dir === state.settings.dir) return;
    state.settings.dir = t.dataset.dir; deck.flipped = false; save(); renderFlash();
  });
  $('#btn-shuffle').addEventListener('click', () => { shuffle(deck.cards); deck.i = 0; deck.flipped = false; renderFlash(); PH.toast('Shuffled'); });
  $('#btn-restart').addEventListener('click', () => { buildDeck(); renderFlash(); });
  $('#speak-auto').addEventListener('change', e => { state.settings.speak = e.target.checked; save(); if (e.target.checked) { const c = currentCard(); if (c) speak(c.hi); } });
  $('#flash-body').addEventListener('click', e => {
    if (e.target.closest('#fcard')) { flip(); return; }
    if (e.target.closest('#btn-again')) { rateCurrent(false); return; }
    if (e.target.closest('#btn-got')) { rateCurrent(true); return; }
    if (e.target.closest('#btn-speak')) { const c = currentCard(); if (c) speak(c.hi); return; }
    if (e.target.closest('#btn-again-deck')) { buildDeck(); renderFlash(); }
  });
  $('#quiz-body').addEventListener('click', e => {
    const o = e.target.closest('.q-opt'); if (o) { answer(Number(o.dataset.opt)); return; }
    if (e.target.closest('#btn-start-q')) { startQuiz(); return; }
    if (e.target.closest('#btn-next-q')) { nextQ(); return; }
    if (e.target.closest('#btn-quit-q')) { quiz.active = false; quiz.result = null; renderQuiz(); }
  });
  $('#search').addEventListener('input', renderList);
  $('#btn-print').addEventListener('click', () => window.print());
  $('#btn-cards').addEventListener('click', printFlashcards);

  /* Cut-out flashcards: 9 to a page, Devanagari on the front, meaning on the back. Back pages mirror the
     columns so the sheets line up when printed double-sided (flip on the long edge). */
  function flashcardHTML(cards, deckName) {
    const PER_ROW = 3, PER_PAGE = 9;
    const pages = [];
    for (let i = 0; i < cards.length; i += PER_PAGE) pages.push(cards.slice(i, i + PER_PAGE));
    const front = c => '<div class="card front"><div class="hi" lang="hi">' + esc(c.hi) + '</div></div>';
    const back = c => '<div class="card back"><div class="en">' + esc(c.en) + '</div>' +
      (c.tr ? '<div class="tr">' + esc(c.tr) + '</div>' : '') +
      (c.hint ? '<div class="hint" lang="hi">' + esc(c.hint) + '</div>' : '') + '</div>';
    const mirror = page => {                                   // reverse each row so backs align with fronts
      const out = [];
      for (let r = 0; r < page.length; r += PER_ROW) out.push.apply(out, page.slice(r, r + PER_ROW).reverse());
      return out;
    };
    const sheets = pages.map(page => {
      const pad = n => { const a = page.slice(); while (a.length < n) a.push(null); return a; };
      const cell = (c, f) => c ? f(c) : '<div class="card empty"></div>';
      return '<section class="sheet">' + pad(PER_PAGE).map(c => cell(c, front)).join('') + '</section>' +
             '<section class="sheet">' + mirror(pad(PER_PAGE)).map(c => cell(c, back)).join('') + '</section>';
    }).join('');
    const css = [
      '@page{size:letter;margin:.4in}*{box-sizing:border-box}',
      'body{margin:0;color:#14161c;font:12pt/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,"Noto Sans Devanagari",sans-serif}',
      '.wrap{max-width:8.5in;margin:0 auto;padding:.35in}',
      '@media screen{body{background:#e9ebf0}.wrap{background:#fff;box-shadow:0 2px 18px rgba(16,24,40,.18);margin:20px auto}}',
      'h1{font-size:13pt;margin:0 0 2px}.sub{font-size:9pt;color:#6b7280;margin:0 0 12px}',
      '.sheet{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,2.9in);gap:0;page-break-after:always;break-after:page}',
      '.card{border:1px dashed #b9bec8;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px;gap:5px}',
      '.card.empty{border-color:#e3e6ea}',
      '.hi{font-size:26pt;font-weight:600;line-height:1.25;word-break:break-word}',
      '.en{font-size:14pt;font-weight:600}.tr{font-size:10.5pt;color:#4b5563;font-style:italic}',
      '.hint{font-size:11pt;color:#6b7280}',
      '@media print{.wrap{box-shadow:none;margin:0;padding:0}.no-print{display:none}}'
    ].join('');
    return '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>' + esc(deckName) + ' flashcards</title><style>' + css +
      '</style></head><body><div class="wrap"><h1>' + esc(deckName) + ' · ' + cards.length + ' flashcards</h1>' +
      '<p class="sub no-print">Print double-sided, flipping on the long edge, then cut along the dashed lines. ' +
      'Fronts and backs are already mirrored so they line up.</p>' + sheets + '</div></body></html>';
  }
  function printFlashcards() {
    const cards = cardsOf(state.settings.ch).slice();
    if (!cards.length) { PH.toast('No words in this deck'); return; }
    const deckName = state.settings.ch === 'due' ? 'Due today' : (state.settings.ch === 'mine' ? 'My words' : chapterTitle(state.settings.ch));
    let frame = document.getElementById('cardFrame');
    if (!frame) { frame = document.createElement('iframe'); frame.id = 'cardFrame'; frame.title = 'Printable flashcards';
      frame.style.cssText = 'position:fixed;width:0;height:0;border:0;visibility:hidden'; document.body.appendChild(frame); }
    frame.srcdoc = flashcardHTML(cards, deckName || 'Hindi');
    frame.onload = () => { try { frame.contentWindow.focus(); frame.contentWindow.print(); } catch (e) { PH.toast('Could not open the print dialog'); } };
    PH.toast(cards.length + ' cards · print double-sided, then cut');
  }
  window.PHHindiDebug = Object.assign(window.PHHindiDebug || {}, { flashcardHTML, cardsOf, printFlashcards });
  $('#list-wrap').addEventListener('click', e => {
    const r = e.target.closest('[data-reset]'); if (r) { resetWord(r.dataset.reset); return; }
    const d = e.target.closest('[data-del]'); if (d) deleteMine(d.dataset.del);
  });
  $('#mine-form').addEventListener('submit', addMine);
  $('#mine-list').addEventListener('click', e => { const d = e.target.closest('[data-del]'); if (d) deleteMine(d.dataset.del); });
  $('#btn-export').addEventListener('click', exportJSON);
  $('#btn-import').addEventListener('click', importJSON);

  document.addEventListener('keydown', e => {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    const tag = (e.target && e.target.tagName) || '';
    if (/^(input|textarea|select)$/i.test(tag)) return;
    const inNav = e.target && e.target.closest && e.target.closest('.tabs, .chips');
    if (quiz.active) {
      if (/^[1-4]$/.test(e.key)) { e.preventDefault(); answer(Number(e.key) - 1); return; }
      if ((e.key === 'Enter' || e.key === ' ') && quiz.answered !== null && !(e.target && e.target.closest && e.target.closest('button'))) { e.preventDefault(); nextQ(); return; }
      if (e.key === 'Enter' && quiz.answered !== null && e.target && e.target.id === 'btn-next-q') return; // native click handles it
      return;
    }
    const onButton = /^(button|a)$/i.test(tag);
    if ((e.key === ' ' || e.key === 'Enter') && (!onButton || (e.target && e.target.id === 'fcard'))) {
      if (e.key === 'Enter' && !(e.target && e.target.id === 'fcard')) return;
      e.preventDefault(); flip(); return;
    }
    if (inNav) return;
    if (e.key === '1' || e.key === 'ArrowLeft') { e.preventDefault(); rateCurrent(false); }
    else if (e.key === '2' || e.key === 'ArrowRight') { e.preventDefault(); rateCurrent(true); }
  });
  // Keep "due today" fresh if the tab stays open past midnight.
  window.addEventListener('focus', () => { renderStats(); renderChips(); });

  /* ===================== Go ===================== */
  buildDeck();
  /* A link like hindi.html#c6-01 (used by the hub's search) opens that chapter. */
  function applyHash() {
    const want = decodeURIComponent(location.hash.replace(/^#/, ''));
    if (!want) return false;
    const ok = want === 'due' || want === 'mine' || CHAPTERS.some(c => c.id === want);
    if (!ok) return false;
    state.settings.ch = want;
    const ch = CHAPTERS.filter(c => c.id === want)[0];
    if (ch) state.settings.cls = ch.cls;
    return true;
  }
  if (applyHash()) save();
  window.addEventListener('hashchange', () => { if (applyHash()) { save(); renderAll(); } });

  renderAll();
  if (stored) save(); // refresh the hub summary against today's dates
})();
</script>
</body></html>
