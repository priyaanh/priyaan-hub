<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weekly Plan · Practice Hub</title>
<link rel="stylesheet" href="shared.css">
<script>/* set the saved theme before anything paints */try{var t=localStorage.getItem('ph.theme');if(t==='system'||!t)t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t)}catch(e){}</script><style>
/* ---- Weekly Plan: page styles (built on shared.css variables) ---- */
:root { --cat-piano:#7c5cff; --cat-dance:#e05a8a; --cat-scouts:#2f8f4e; --cat-math:#2f6fed; --cat-hindi:#e0701f; --cat-other:#667085; }
.cat-piano { --cat: var(--cat-piano); } .cat-dance { --cat: var(--cat-dance); } .cat-scouts { --cat: var(--cat-scouts); }
.cat-math { --cat: var(--cat-math); }   .cat-hindi { --cat: var(--cat-hindi); } .cat-other { --cat: var(--cat-other); }

/* A 7-column week needs a little more room than the other pages. */
body[data-app="schedule"] .topbar .inner, body[data-app="schedule"] .container { max-width: 1180px; }
.topbar .actions { display: flex; gap: .4rem; align-items: center; flex-wrap: nowrap; }
@media (max-width: 560px) { .topbar .actions .lbl { display: none; } .topbar .actions .btn { padding: .35rem .5rem; } }
.print-only { display: none; }

/* Week header */
.week-card { padding: .9rem 1.1rem; }
/* Google Tasks that are due, read from the Calendar page's saved copy */
.gtasks { display: flex; gap: .4rem; flex-wrap: wrap; align-items: center; margin-top: .7rem; padding-top: .7rem; border-top: 1px dashed var(--border); }
.gtasks .lbl { font-size: .78rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 700; }
.gtasks .gt { background: var(--surface-2); border-radius: 999px; padding: .2rem .65rem; font-size: .84rem; display: inline-flex; gap: .35rem; align-items: center; }
.gtasks .gt.late { background: var(--danger-soft); color: var(--danger); font-weight: 600; }
.gtasks a.more { font-size: .82rem; }
.week-nav { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
.week-nav h2 { margin: 0; font-size: 1.15rem; flex: 1 1 14rem; display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; }
.week-nav .nav { display: inline-flex; gap: .35rem; }
.week-prog { display: flex; align-items: center; gap: .75rem; margin-top: .7rem; }
.week-prog .progress { flex: 1; }
.week-prog .count { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; font-size: .95rem; }
.cat-chips { display: flex; gap: .4rem; flex-wrap: wrap; margin-top: .6rem; min-height: 1.4rem; }
.cat-chip { background: color-mix(in srgb, var(--cat) 14%, transparent); color: var(--cat); }
.cat-chip.full { box-shadow: inset 0 0 0 1.5px var(--cat); }

.stats { margin-top: 1rem; }
.stat .num small { font-size: .95rem; font-weight: 600; color: var(--muted); }

/* Day tabs (phone only) */
.day-tabs { display: none; margin-top: 1rem; width: 100%; }
.day-tabs .tab { flex: 1; padding: .35rem .2rem; display: flex; flex-direction: column; align-items: center; line-height: 1.15; }
.day-tabs .tab .d { font-size: .68rem; text-transform: uppercase; letter-spacing: .04em; }
.day-tabs .tab .n { font-size: 1rem; font-weight: 700; }
.day-tabs .tab.today .n { color: var(--accent-text); }
.day-tabs .tab .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--ok); margin-top: 2px; visibility: hidden; }
.day-tabs .tab.complete .dot { visibility: visible; }

/* Week grid */
.week-grid { display: grid; gap: .6rem; margin-top: 1rem; grid-template-columns: repeat(7, minmax(0, 1fr)); }
@media (min-width: 720px) and (max-width: 999px) { .week-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.day-col { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: .6rem .5rem .5rem; display: flex; flex-direction: column; min-width: 0; }
.day-col.today { border-color: var(--accent-text); box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow); }
.day-col.past { background: color-mix(in srgb, var(--surface) 70%, var(--bg)); }
.day-head { display: flex; align-items: baseline; gap: .3rem; padding: 0 .25rem .45rem; border-bottom: 1px solid var(--border); margin-bottom: .4rem; }
.day-head .dn { font-weight: 700; font-size: .95rem; white-space: nowrap; }
.day-head .dn .num { color: var(--muted); font-weight: 600; margin-left: .25rem; }
.day-col.today .dn, .day-col.today .dn .num { color: var(--accent-text); }
.day-head .today-tag { font-size: .62rem; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: var(--accent-text); background: var(--accent-soft); padding: .05rem .4rem; border-radius: 999px; }
.day-head .cnt { margin-left: auto; font-size: .72rem; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.day-col.complete .cnt { color: var(--ok); }
.day-tasks { display: flex; flex-direction: column; gap: .2rem; flex: 1; }
.day-tasks .empty { padding: .8rem .4rem; font-size: .78rem; }
.trow { display: flex; align-items: flex-start; gap: .1rem; }
.trow .check { flex: 1; min-width: 0; }
.day-tasks .check { padding: .4rem .45rem .4rem .5rem; gap: .45rem; font-size: .84rem; color: var(--text); font-weight: 500; margin: 0; border-left: 3px solid var(--cat, var(--border)); border-radius: 6px; background: color-mix(in srgb, var(--cat, var(--muted)) 6%, transparent); }
.day-tasks .check:hover { background: color-mix(in srgb, var(--cat, var(--muted)) 13%, transparent); }
.day-tasks .check input[type="checkbox"] { width: 1.05rem; height: 1.05rem; margin-top: .1rem; accent-color: var(--cat, var(--accent)); }
.day-tasks .check.auto input[type="checkbox"] { cursor: default; }
.day-tasks .check .txt { display: flex; flex-direction: column; gap: .15rem; line-height: 1.3; }
.t-name { overflow-wrap: anywhere; }
/* Strike only the name when done; keep time pills and the "min logged" line readable. */
.day-tasks .check.done .txt { text-decoration: none; }
.day-tasks .check.done .t-name { text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--muted) 60%, transparent); }
.t-meta { display: flex; flex-wrap: wrap; gap: .25rem; align-items: center; }
.t-meta .pill { padding: .05rem .45rem; font-size: .68rem; background: var(--surface-2); color: var(--muted); }
.t-link { font-size: .7rem; font-weight: 700; color: color-mix(in srgb, var(--cat, var(--accent)) 72%, var(--text)); text-decoration: underline; text-underline-offset: 2px; }
.t-link:hover { color: var(--text); }
.t-sub { font-size: .72rem; color: var(--muted); }
.check.auto .t-sub { color: var(--ok); font-weight: 600; }
.day-col.past .check:not(.done) { opacity: .55; }
.day-col.past .check:not(.done):hover, .day-col.past .check:not(.done):focus-within { opacity: 1; }
.trow .x { flex: none; width: 1.7rem; height: 1.7rem; padding: 0; margin-top: .25rem; font-size: 1rem; line-height: 1; color: var(--muted); }
.trow .x.armed { width: auto; padding: 0 .45rem; font-size: .72rem; }
.day-info { font-size: .72rem; color: var(--ok); font-weight: 600; padding: .3rem .5rem; }
.day-foot { display: flex; gap: .15rem; margin-top: .45rem; padding-top: .35rem; border-top: 1px dashed var(--border); flex-wrap: wrap; }
.day-foot .btn { padding: .25rem .45rem; font-size: .76rem; }
.day-foot .note-tgl.has-note { color: var(--accent-text); }
.add-form { display: flex; flex-direction: column; gap: .3rem; margin-top: .4rem; }
.add-form .input, .add-form select { padding: .35rem .5rem; font-size: .84rem; }
.add-form .row { gap: .3rem; flex-wrap: nowrap; }
.add-form select { flex: 1; min-width: 0; }
.day-note { margin-top: .4rem; font-size: .84rem; padding: .4rem .5rem; min-height: 3.2rem; }
.pbox { display: none; }

@media (max-width: 719px) {
  .day-tabs { display: flex; }
  .week-grid { display: block; margin-top: .75rem; }
  .day-col { display: none; padding: .8rem .75rem .7rem; }
  .day-col.selected { display: flex; }
  .day-tasks .check { font-size: .95rem; padding: .55rem .6rem; }
  .day-tasks .check input[type="checkbox"] { width: 1.15rem; height: 1.15rem; }
  .t-meta .pill, .t-link, .t-sub { font-size: .78rem; }
  .day-foot .btn { font-size: .85rem; padding: .35rem .6rem; }
  .day-head .dn { font-size: 1.05rem; }
}

/* Edit plan panel */
.edit-panel { margin-top: 1rem; }
.edit-panel .card-head { align-items: flex-start; }
.edit-panel h2:focus { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 4px; }
.te-list { display: flex; flex-direction: column; gap: .5rem; }
.te { border: 1px solid var(--border); border-left: 4px solid var(--cat, var(--border)); border-radius: var(--radius-sm); padding: .6rem .7rem; display: flex; flex-direction: column; gap: .5rem; background: var(--surface); }
.te.inactive { opacity: .6; }
.te-row { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
.te-name { flex: 1 1 12rem; }
.te-cat { width: auto; flex: 0 0 auto; }
.te-time { width: 8rem; flex: none; }
input[type="number"].te-min { width: 5.5rem; flex: none; }
.days { display: inline-flex; gap: .2rem; }
.day-tgl { width: 2rem; height: 2rem; border-radius: 50%; border: 1px solid var(--border); background: var(--surface); color: var(--muted); font: inherit; font-weight: 700; font-size: .8rem; cursor: pointer; padding: 0; }
.day-tgl:hover { border-color: var(--cat, var(--accent)); }
.day-tgl[aria-pressed="true"] { background: var(--cat, var(--accent)); border-color: var(--cat, var(--accent)); color: #fff; }
.day-tgl:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.te-active { display: inline-flex; align-items: center; gap: .35rem; margin: 0; font-size: .85rem; cursor: pointer; white-space: nowrap; }
.te-active input { accent-color: var(--accent-text); width: 1rem; height: 1rem; margin: 0; }
.te-actions { display: inline-flex; gap: .15rem; margin-left: auto; }
.te-foot { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: .75rem; justify-content: space-between; }
.btn.armed { color: var(--danger); border-color: var(--danger); background: var(--danger-soft); }

/* Print: the whole week as a fridge checklist, black on white */
@media print {
  @page { size: landscape; margin: 10mm; }
  body[data-app="schedule"] .container { max-width: none; }
  .stats, .day-tabs, .edit-panel, .week-nav .nav, .day-foot, .add-form, .t-link, .trow .x, .no-print { display: none !important; }
  .print-only { display: block; font-weight: 800; font-size: 1.4rem; color: #000; margin-bottom: .2rem; }
  .week-card { border: 0; padding: 0 0 .4rem; box-shadow: none; background: #fff; }
  .week-nav h2 { font-size: 1.1rem; color: #000; }
  .week-nav .pill { display: none; }
  .week-prog .progress { border: 1px solid #000; background: #fff; height: 7px; }
  .week-prog .progress > i { background: #000; }
  .week-prog .count { color: #000; }
  .cat-chip { color: #000; background: none; border: 1px solid #000; box-shadow: none; }
  .week-grid { display: grid !important; grid-template-columns: repeat(7, minmax(0, 1fr)) !important; gap: 4px; margin-top: .4rem; }
  .day-col { display: flex !important; border: 1px solid #000; box-shadow: none; border-radius: 4px; background: #fff !important; color: #000; padding: .35rem .3rem; break-inside: avoid; }
  .day-head { border-bottom: 1px solid #000; padding-bottom: .25rem; margin-bottom: .25rem; }
  .day-col.today { box-shadow: none; border-color: #000; border-width: 2px; }
  .day-head .dn, .day-head .dn .num, .day-head .cnt, .day-col.today .dn, .day-col.today .dn .num, .day-col.complete .cnt, .check.auto .t-sub { color: #000; }
  .day-head .today-tag { background: none; color: #000; border: 1px solid #000; }
  .day-tasks .check { background: none; border-left: 0; padding: .18rem 0; font-size: .74rem; color: #000; opacity: 1 !important; border-radius: 0; gap: .3rem; }
  .day-tasks .check input[type="checkbox"] { display: none; }
  .pbox { display: inline-flex !important; flex: none; width: .8rem; height: .8rem; border: 1.5px solid #000; border-radius: 2px; align-items: center; justify-content: center; font-size: .65rem; line-height: 1; margin-top: .1rem; }
  .check.done .pbox::after { content: "\2713"; }
  .check.done .txt { color: #000; text-decoration: none; }
  .t-meta .pill { background: none; color: #000; padding: 0; font-weight: 600; }
  .t-sub, .day-info { color: #000; }
  .day-note { display: block !important; border: 0; border-top: 1px dashed #000; border-radius: 0; padding: .2rem 0 0; font-size: .72rem; min-height: 0; resize: none; background: none; color: #000; }
  .day-note:placeholder-shown { display: none !important; }
}

<body data-app="schedule">
<header class="topbar"><div class="inner">
  <a class="back" href="index.html">← Hub</a>
  <h1 class="title"><span class="emoji">📅</span><span class="name">Weekly Plan</span></h1>
  <div class="spacer"></div>
  <div class="actions">
    <button type="button" class="btn btn-sm" id="btnEdit" aria-expanded="false" aria-controls="editPanel" aria-label="Edit recurring plan" title="Edit recurring plan">⚙ <span class="lbl">Edit plan</span></button>
    <button type="button" class="btn btn-sm" id="btnPrint" aria-label="Print this week" title="Print this week">🖨 <span class="lbl">Print week</span></button>
    <button type="button" class="btn btn-ghost btn-sm" id="btnExport" aria-label="Export plan as JSON" title="Export JSON">⬇ <span class="lbl">Export</span></button>
    <button type="button" class="btn btn-ghost btn-sm" id="btnImport" aria-label="Import plan from JSON" title="Import JSON">⬆ <span class="lbl">Import</span></button>
  </div>
</div></header>
<main class="container">
  <section class="card week-card" aria-label="Week overview">
    <div class="print-only"><span data-ph="possessive"></span>Weekly Plan</div>
    <div class="week-nav">
      <h2><span id="weekRange" aria-live="polite">…</span><span class="pill neutral" id="weekTag">This week</span></h2>
      <div class="nav">
        <button type="button" class="btn btn-sm" id="btnPrev" aria-label="Previous week">‹ Prev</button>
        <button type="button" class="btn btn-sm" id="btnToday">Today</button>
        <button type="button" class="btn btn-sm" id="btnNext" aria-label="Next week">Next ›</button>
      </div>
    </div>
    <div class="week-prog">
      <div class="progress" id="weekProg" role="progressbar" aria-label="Week progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="weekBar" style="width:0%"></i></div>
      <span class="count" id="weekCount" aria-live="polite">0 / 0</span>
    </div>
    <div class="cat-chips" id="catChips" aria-label="Progress by activity"></div>
    <div class="gtasks no-print" id="gtasks" hidden></div>
  </section>

  <section class="stats" aria-label="Stats">
    <div class="stat"><div class="num" id="stWeek">0%</div><div class="lbl">this week</div></div>
    <div class="stat"><div class="num" id="stToday">0</div><div class="lbl">done today</div></div>
    <div class="stat"><div class="num" id="stStreak">0</div><div class="lbl" id="stStreakLbl">day streak</div></div>
  </section>

  <section class="card edit-panel" id="editPanel" hidden aria-labelledby="editTitle">
    <div class="card-head">
      <div>
        <h2 id="editTitle" tabindex="-1">Recurring plan</h2>
        <p class="muted small" style="margin:0">Pick the days each activity repeats. Changes apply to every week; your checkmarks are kept. Times are optional — type whatever you like, e.g. <span class="kbd">4:30 pm</span>.</p>
      </div>
      <button type="button" class="btn btn-sm" id="btnCloseEdit">Done</button>
    </div>
    <div class="te-list" id="teList"></div>
    <div class="te-foot">
      <button type="button" class="btn btn-primary btn-sm" id="btnAddTask">+ Add task</button>
      <button type="button" class="btn btn-ghost btn-sm btn-danger" id="btnReset">Reset to default plan</button>
    </div>
  </section>

  <div class="tabs day-tabs" id="dayTabs" role="tablist" aria-label="Day of week"></div>
  <section class="week-grid" id="weekGrid" aria-label="Week plan"></section>
</main>
<script src="shared.js"></script><script>
(function () {

el.teList.addEventListener('change', function (e) {
  var inp = e.target.closest('[data-f]'); if (!inp) return; var t = taskOf(inp); if (!t) return;
  var f = inp.dataset.f, te = inp.closest('.te');
  if (f === 'cat') { t.cat = CATS[inp.value] ? inp.value : 'other'; te.className = 'te cat-' + t.cat + (t.active ? '' : ' inactive'); }
  else if (f === 'active') { t.active = inp.checked; te.classList.toggle('inactive', !t.active); }
  else if (f === 'name') { if (!inp.value.trim()) inp.value = t.name; }
  save(); refreshWeek();
});
el.teList.addEventListener('click', function (e) {
  var btn = e.target.closest('button'); if (!btn) return; var t = taskOf(btn); if (!t) return;
  if (btn.classList.contains('day-tgl')) {
    var d = Number(btn.dataset.day), on = t.days.indexOf(d) < 0;
    t.days = on ? normDays(t.days.concat([d])) : t.days.filter(function (x) { return x !== d; });
    btn.setAttribute('aria-pressed', String(on));
    save(); refreshWeek(); return;
  }
  var act = btn.dataset.act, i = state.tasks.indexOf(t);
  if (act === 'up' && i > 0) { swapTasks(i, i - 1); focusTe(t.id, 'up'); }
  else if (act === 'down' && i < state.tasks.length - 1) { swapTasks(i, i + 1); focusTe(t.id, 'down'); }
  else if (act === 'del') {
    twoStep(btn, function () {
      state.tasks.splice(state.tasks.indexOf(t), 1); reindex(); save(); renderPanel(); refreshWeek();
      el.btnAddTask.focus(); PH.toast('Removed “' + t.name + '”');
    }, 'Delete?');
  }
});
function swapTasks(i, j) { var a = state.tasks[i]; state.tasks[i] = state.tasks[j]; state.tasks[j] = a; reindex(); save(); renderPanel(); refreshWeek(); }
function focusTe(id, act) {
  var te = el.teList.querySelector('.te[data-id="' + id + '"]'); if (!te) return;
  var b = te.querySelector('[data-act="' + act + '"]');
  if (b && !b.disabled) b.focus(); else te.querySelector('.te-name').focus();
}
el.btnAddTask.addEventListener('click', function () {
  var t = normTask({ name: 'New task', cat: 'other', days: [], active: true }, state.tasks.length);
  state.tasks.push(t); reindex(); save(); renderPanel(); refreshWeek();
  var inp = el.teList.querySelector('.te[data-id="' + t.id + '"] .te-name'); if (inp) { inp.focus(); inp.select(); }
});
el.btnReset.addEventListener('click', function (e) {
  twoStep(e.currentTarget, function () {
    state.tasks = defaultTasks(); save(); renderPanel(); refreshWeek(); PH.toast('Default plan restored (checkmarks kept)');
  }, 'Reset plan?');
});

/** Two-step inline confirm: first click arms the button for 3 s, second click runs fn. No dialogs. */
var armedButtons = new WeakMap();
function twoStep(btn, fn, armedText) {
  var a = armedButtons.get(btn);
  if (a) { clearTimeout(a.timer); armedButtons.delete(btn); disarm(btn, a.orig); fn(); return; }
  var orig = { html: btn.innerHTML, cls: btn.className, label: btn.getAttribute('aria-label') };
  btn.textContent = armedText || 'Sure?'; btn.classList.add('armed'); btn.setAttribute('aria-label', (armedText || 'Sure?') + ' Press again to confirm');
  var timer = setTimeout(function () { armedButtons.delete(btn); disarm(btn, orig); }, 3000);
  armedButtons.set(btn, { timer: timer, orig: orig });
}
function disarm(btn, orig) {
  if (!btn.isConnected) return;
  btn.innerHTML = orig.html; btn.className = orig.cls;
  if (orig.label) btn.setAttribute('aria-label', orig.label); else btn.removeAttribute('aria-label');
}

/* ---------------- topbar: print / export / import ---------------- */
el.btnPrint.addEventListener('click', function () { window.print(); });
el.btnExport.addEventListener('click', function () {
  PH.download('priyaan-weekly-plan-' + today() + '.json', JSON.stringify(state, null, 2));
  PH.toast('Exported weekly plan');
});
el.btnImport.addEventListener('click', function () {
  PH.pickFile('application/json,.json').then(function (txt) {
    if (!txt) return;
    var data;
    try { data = JSON.parse(txt); } catch (err) { PH.toast('That file is not valid JSON'); return; }
    if (!isObj(data) || !Array.isArray(data.tasks)) { PH.toast('Import needs a "tasks" array'); return; }
    var inc = normalize(data);
    if (data.tasks.length && !inc.tasks.length) { PH.toast('No valid tasks found in that file'); return; }
    state = { version: 1, tasks: inc.tasks,
      checks: Object.assign({}, state.checks, inc.checks), extras: Object.assign({}, state.extras, inc.extras),
      dayNotes: Object.assign({}, state.dayNotes, inc.dayNotes), summary: state.summary };
    save(); renderAll();
    PH.toast('Imported ' + inc.tasks.length + ' task' + (inc.tasks.length === 1 ? '' : 's'));
  });
});

/* ---------------- keep in sync with other tabs / the piano app ---------------- */
window.addEventListener('storage', function (e) {
  if (e.key === KEY) state = normalize(PH.load(KEY, null));
  if (e.key === KEY || e.key === PIANO_KEY || e.key === null) { pianoMap = pianoMinutes(PH.load(PIANO_KEY, null)); renderAll(); }
});
document.addEventListener('visibilitychange', function () {
  if (document.hidden) return;
  var m = pianoMinutes(PH.load(PIANO_KEY, null));
  if (JSON.stringify(m) !== JSON.stringify(pianoMap)) { pianoMap = m; renderAll(); }
});

/* ---------------- go ---------------- */
save();       // refresh summary for the hub (today may have changed since last visit)
renderAll();
})();
</script></body></html>
