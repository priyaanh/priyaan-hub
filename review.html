<script src="shared.js"></script>
<script>
/* Review reads what the other apps recorded as wrong and asks those questions again. It regenerates
   them rather than storing them: every generator here is deterministic from its seed, so a saved
   {seed, topics, difficulty, count} plus an index is the whole question. The only thing this page
   writes is which questions have since been answered correctly. */
(function () {
  'use strict';
  var KEY = 'ph.review.v1';
  var TODAY = PH.todayISO();
  var esc = PH.esc;
  /* Question text is written as a little HTML (<sup> for exponents, <br> between the lines of a system,
     &lt; for a symbol). PH.safeHTML keeps exactly those and neutralises everything else. */
  var safeHTML = PH.safeHTML, plainText = PH.plainText;
  var $ = function (s) { return document.querySelector(s); };
  var isObj = function (v) { return !!v && typeof v === 'object' && !Array.isArray(v); };
  var okISO = function (s) {
    if (typeof s !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
    var d = new Date(s + 'T00:00:00'); return !isNaN(d.getTime()) && PH.todayISO(d) === s;
  };
  var arr = function (v) { return Array.isArray(v) ? v : []; };
  var plural = function (n, one, many) { return n + ' ' + (n === 1 ? one : (many || one + 's')); };

  var SOURCES = {
    quiz:   { name: 'Lesson quizzes',  emoji: '📝', href: 'quizzes.html', script: ['cpm_int2_ch1.js', 'cpm_int2_ch2.js'], global: 'CPM_QUIZZES' },
    math:   { name: 'Math worksheets', emoji: '🧮', href: 'math.html',    script: 'im1.js',          global: 'IM1' },
    python: { name: 'Python',          emoji: '🐍', href: 'python.html',  script: 'pyquiz.js',       global: 'PY' },
    science:{ name: 'Science',         emoji: '🔬', href: 'ask.html#science', script: 'science.js',      global: 'SCI' },
    spanish:{ name: 'Spanish',         emoji: '💬', href: 'spanish.html', script: 'spanish.js',      global: 'ES' },
    ai:     { name: 'Make Practice',   emoji: '✏️', href: 'ai.html',      script: 'grades.js',       global: 'GRADES' }
  };
  var ORDER = ['quiz', 'math', 'spanish', 'science', 'python', 'ai'];

  /* ===================== State (ours is tiny: what has since been got right) ===================== */
  function blank() { return { version: 1, cleared: {}, settings: { sources: {}, howMany: 10 }, summary: { headline: '', sub: '' } }; }
  function normalize(raw) {
    var s = blank();
    if (!isObj(raw)) return s;
    if (isObj(raw.cleared)) {
      /* Keep the most recent, not the first seen: slicing insertion order threw away every new clear
         once the cap was reached, quietly re-opening questions that had been put right. */
      var keys = Object.keys(raw.cleared).filter(function (k) {
        return typeof k === 'string' && k.length < 200 && okISO(raw.cleared[k]);
      });
      keys.sort(function (a, b) { return raw.cleared[a] < raw.cleared[b] ? 1 : raw.cleared[a] > raw.cleared[b] ? -1 : 0; });
      keys.slice(0, 2000).forEach(function (k) { s.cleared[k] = raw.cleared[k]; });
    }
    var st = isObj(raw.settings) ? raw.settings : {};
    if (isObj(st.sources)) ORDER.forEach(function (k) { if (typeof st.sources[k] === 'boolean') s.settings.sources[k] = st.sources[k]; });
    if ([0, 5, 10, 20].indexOf(Number(st.howMany)) >= 0) s.settings.howMany = Number(st.howMany);
    return s;
  }
  var state = normalize(PH.load(KEY, null));
  function save() { state.summary = buildSummary(); PH.save(KEY, state); }

  /* ===================== What is still open ===================== */
  /* One descriptor per question that was missed and has not been answered right since. `key` is the
     question's identity, not the attempt's, so getting it right once clears it wherever it came from,
     and missing it again later re-opens it. */
  function collect() {
    var out = [];
    var push = function (key, src, date, label, group, gen) {
      if (!okISO(date)) return;
      /* A clock that was ahead, or a restored backup, can leave a record dated in the future. Left alone
         it could never be cleared, because clearing stamps today and today is never past tomorrow. */
      if (date > TODAY) date = TODAY;
      var clearedOn = state.cleared[key];
      if (clearedOn && clearedOn >= date) return;          // answered right since it was missed
      out.push({ key: key, src: src, date: date, label: label, group: group, gen: gen });
    };

    var q = PH.load('ph.quiz.v1', null);
    if (isObj(q)) arr(q.attempts).forEach(function (a) {
      if (!isObj(a)) return;
      arr(a.missed).forEach(function (m) {
        /* a single-lesson attempt stores bare indices; a mixed one stores "lesson:index" */
        var lesson, idx;
        if (typeof m === 'string' && m.indexOf(':') > 0) { lesson = m.split(':')[0]; idx = Number(m.split(':')[1]); }
        else { lesson = String(a.lesson || ''); idx = Number(m); }
        if (!lesson || lesson === 'mix' || !Number.isInteger(idx) || idx < 0) return;
        push('q|' + lesson + '|' + idx, 'quiz', a.date, 'Lesson ' + lesson, lesson,
          { kind: 'quiz', lesson: lesson, idx: idx });
      });
    });

    var mh = PH.load('ph.math.v1', null);
    if (isObj(mh)) arr(mh.history).forEach(function (h) {
      if (!isObj(h) || !arr(h.missed).length) return;
      var topics = arr(h.topics).slice().sort(), sig = topics.join(',');
      arr(h.missed).forEach(function (i) {
        push('m|' + h.seed + '|' + sig + '|' + h.difficulty + '|' + h.count + '|' + i, 'math', h.date,
          'Integrated Math 1', sig || 'maths',
          { kind: 'math', topics: h.topics, count: h.count, difficulty: h.difficulty, seed: h.seed, idx: i });
      });
    });

    var sp = PH.load('ph.spanish.v1', null);
    if (isObj(sp)) arr(sp.history).forEach(function (h) {
      if (!isObj(h) || !arr(h.missed).length) return;
      var topics = arr(h.topics).slice().sort(), sig = topics.join(',');
      arr(h.missed).forEach(function (i) {
        push('s|' + h.seed + '|' + sig + '|' + h.difficulty + '|' + h.count + '|' + i, 'spanish', h.date,
          'Spanish', sig || 'spanish',
          { kind: 'spanish', topics: h.topics, count: h.count, difficulty: h.difficulty, seed: h.seed, idx: i });
      });
    });

    /* Questions asked in the thread on ask.html belong to the subject they came from, not to a source
       of their own: a maths question missed there is a maths question missed. Each generator is asked
       with the same {topics, count, difficulty, seed}, so the same index is the same question. */
    var GEN_SRC = { math: 'math', spanish: 'spanish', science: 'science', python: 'python', grade: 'ai', lesson: 'quiz' };
    var ak = PH.load('ph.ask.v1', null);
    if (isObj(ak)) arr(ak.history).forEach(function (h) {
      if (!isObj(h) || !arr(h.missed).length || !GEN_SRC[h.gen]) return;
      var topics = arr(h.topics).slice().sort(), sig = topics.join(',');
      arr(h.missed).forEach(function (i) {
        if (h.gen === 'lesson') {
          var ref = String(arr(h.refs)[i] || '').split(':');
          if (ref.length !== 2) return;
          push('q|' + ref[0] + '|' + ref[1], 'quiz', h.date, 'Lesson ' + ref[0], ref[0],
            { kind: 'quiz', lesson: ref[0], idx: Number(ref[1]) });
          return;
        }
        var kind = h.gen === 'grade' ? 'grade' : h.gen;
        push('a|' + h.gen + '|' + h.seed + '|' + sig + '|' + h.difficulty + '|' + h.count + '|' + i,
          GEN_SRC[h.gen], h.date, SOURCES[GEN_SRC[h.gen]].name, sig || h.gen,
          { kind: kind, topics: h.topics, grade: h.grade, count: h.count, difficulty: h.difficulty, seed: h.seed, idx: i });
      });
    });

    var py = PH.load('ph.python.v1', null);
    if (isObj(py)) arr(py.rounds).forEach(function (r) {
      /* a retry round was built from a list of questions, not a seed, so it cannot be regenerated */
      if (!isObj(r) || r.kind === 'retry' || !r.seed || !arr(r.missed).length) return;
      var topics = arr(r.topics).slice().sort(), sig = topics.join(',');
      arr(r.missed).forEach(function (i) {
        push('p|' + r.seed + '|' + sig + '|' + r.difficulty + '|' + r.total + '|' + i, 'python', r.date,
          'Python', sig || 'python',
          { kind: 'python', topics: r.topics, count: r.total, difficulty: r.difficulty, seed: r.seed, idx: i });
      });
    });

    var ai = PH.load('ph.ai.v1', null);
    if (isObj(ai)) arr(ai.sets).forEach(function (x) {
      if (!isObj(x) || !arr(x.missed).length) return;
      arr(x.missed).forEach(function (i) {
        if (!isObj(arr(x.problems)[i])) return;
        /* keyed by the question, not the set: ai.html can copy a missed problem into a fresh set,
           and the same question must not sit on the list twice under two names */
        push('a|' + hash(String(arr(x.problems)[i].question)), 'ai', x.date,
          String(x.title || 'Practice set'), String(x.title || 'Practice set'),
          { kind: 'ai', setId: x.id, idx: i });
      });
    });

    /* one entry per question, keeping the most recent time it was missed */
    var byKey = {};
    out.forEach(function (d) { if (!byKey[d.key] || d.date > byKey[d.key].date) byKey[d.key] = d; });
    var list = Object.keys(byKey).map(function (k) { return byKey[k]; });
    /* Drop anything that can no longer be turned back into a question — a lesson renamed, a bank entry
       removed, a set deleted. Counting one of those would promise a question the review cannot ask, and
       nothing could ever clear it. Only checked once the generator for that source has arrived. */
    list = list.filter(function (d) { return !canBuild(d.src) || !!buildCached(d); });
    list.sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : (a.key < b.key ? -1 : 1); });
    return list;
  }

  /* ===================== Loading a generator only when it is needed ===================== */
  /* grade practice is rebuilt from grades.js, so that one does have to load before it can be asked */
  function canBuild(srcKey) {
    var src = SOURCES[srcKey];
    return !src || !src.script || !!src.optional || !!window[src.global];
  }
  var loading = {};
  /** One file, in order. A source may name several: a question bank split across chapters needs the
      first file to set the global up and the later ones to add to it, so they cannot race. */
  function loadFile(file) {
    if (loading[file]) return loading[file];
    loading[file] = new Promise(function (done) {
      var sc = document.createElement('script');
      sc.src = file;
      sc.onload = function () { done(true); };
      sc.onerror = function () { done(false); };
      document.head.appendChild(sc);
    });
    return loading[file];
  }
  function need(srcKey) {
    var src = SOURCES[srcKey];
    if (!src || !src.script) return Promise.resolve(true);
    if (window[src.global]) return Promise.resolve(true);
    var files = Array.isArray(src.script) ? src.script : [src.script];
    return files.reduce(function (chain, f) {
      return chain.then(function () { return loadFile(f); });
    }, Promise.resolve()).then(function () { return !!window[src.global]; });
  }
  function needAll(keys) {
    return Promise.all(keys.filter(function (k, i) { return keys.indexOf(k) === i; }).map(need));
  }

  /* ===================== Turning a descriptor back into a question ===================== */
  /* Every generator here is deterministic, so this rebuilds the exact question that was missed.
     Returns null if the generator is missing or the saved parameters no longer make sense. */
  function build(desc) {
    var g = desc.gen;
    try {
      if (g.kind === 'quiz') {
        var BANK = window.CPM_QUIZZES;
        if (!BANK || !BANK.materialise) return null;
        /* a fixed seed per question, so the same question comes back the same way every time */
        var item = BANK.materialise(g.lesson, g.idx, PH.rng(hash(desc.key)));
        if (!item) return null;
        return {
          from: 'Lesson ' + g.lesson, topic: g.lesson, qtext: item.q, svg: item.svg, code: '',
          choices: item.type === 'mc' ? item.choices : null,
          answerText: item.type === 'mc' ? item.choices[item.answer] : String(item.answer) + (item.unit ? ' ' + item.unit : ''),
          explain: item.explain,
          ok: function (pick, typed) { return BANK.checkAnswer(item, item.type === 'mc' ? pick : typed); }
        };
      }
      if (g.kind === 'math') {
        if (!window.IM1) return null;
        var ws = IM1.generate({ topics: g.topics, count: g.count, difficulty: g.difficulty, seed: g.seed });
        var p = ws && ws.problems && ws.problems[g.idx];
        if (!p) return null;
        return {
          from: p.topicName || 'Integrated Math 1', topic: p.topic || 'maths', qtext: p.question, svg: '', code: '',
          choices: null, answerText: String(p.answer), explain: p.work || '',
          ok: function (pick, typed) { return IM1.checkAnswer(p, typed); }
        };
      }
      if (g.kind === 'spanish') {
        if (!window.ES) return null;
        var sws = ES.generate({ topics: g.topics, count: g.count, difficulty: g.difficulty, seed: g.seed });
        var sp_ = sws && sws.problems && sws.problems[g.idx];
        if (!sp_) return null;
        return {
          from: sp_.topicName || 'Spanish', topic: sp_.topic || 'spanish', qtext: sp_.question, svg: '', code: '',
          choices: null, answerText: String(sp_.answer), explain: sp_.work || '',
          ok: function (pick, typed) { return ES.checkAnswer(sp_, typed); }
        };
      }
      if (g.kind === 'grade') {
        if (!window.GRADES) return null;
        var gws = GRADES.generate({ grade: g.grade || '7', topics: g.topics, count: g.count, difficulty: g.difficulty, seed: g.seed });
        var gp = gws && gws.problems && gws.problems[g.idx];
        if (!gp) return null;
        return {
          from: gp.topicName || 'Grade practice', topic: gp.topic || 'grade', qtext: gp.question, svg: '', code: '',
          choices: null, answerText: String(gp.answer), explain: gp.work || '',
          ok: function (pick, typed) { return GRADES.checkAnswer(gp, typed); }
        };
      }
      if (g.kind === 'science') {
        if (!window.SCI) return null;
        var sci = SCI.generate({ topics: g.topics, count: g.count, difficulty: g.difficulty, seed: g.seed });
        var sq = sci && sci.problems && sci.problems[g.idx];
        if (!sq) return null;
        return {
          from: sq.topicName || 'Science', topic: sq.topic || 'science', qtext: sq.question, svg: '', code: '',
          choices: (sq.choices && sq.choices.length) ? sq.choices.slice() : null,
          answerText: String(sq.answer), explain: sq.work || '',
          ok: function (pick, typed) {
            if (sq.choices && pick != null) return String(sq.choices[pick]) === String(sq.answer);
            return SCI.checkAnswer(sq, typed);
          }
        };
      }
      if (g.kind === 'python') {
        if (!window.PY) return null;
        var set = PY.generate({ topics: g.topics, count: g.count, difficulty: g.difficulty, seed: g.seed });
        var q = set && set.questions && set.questions[g.idx];
        if (!q) return null;
        return {
          from: q.topicName || 'Python', topic: q.topic || 'python', qtext: q.prompt || 'What does this print?',
          svg: '', code: q.code || '', choices: (q.choices && q.choices.length) ? q.choices.slice() : null,
          answerText: String(q.answer), explain: q.explain || '',
          ok: function (pick, typed) { return PY.checkAnswer(q, q.choices && q.choices.length ? q.choices[pick] : typed); }
        };
      }
      if (g.kind === 'ai') {
        var st = PH.load('ph.ai.v1', null);
        var one = isObj(st) ? arr(st.sets).filter(function (x) { return isObj(x) && x.id === g.setId; })[0] : null;
        var pr = one && arr(one.problems)[g.idx];
        if (!pr) return null;
        var choices = arr(pr.choices).length ? pr.choices.slice() : null;
        return {
          from: String(one.title || 'Practice set'), topic: String(pr.topic || one.title || 'practice'),
          qtext: String(pr.question), svg: '', code: '', choices: choices,
          answerText: String(pr.answer), explain: String(pr.work || ''),
          ok: function (pick, typed) {
            if (choices) return choices[pick] === pr.answer;
            if (window.GRADES && typeof GRADES.checkAnswer === 'function') return GRADES.checkAnswer({ answer: pr.answer, accept: [] }, typed);
            var n = function (v) { return String(v).toLowerCase().replace(/\s+/g, '').replace(/[−–]/g, '-').replace(/^[a-z]=/, ''); };
            return n(typed) === n(pr.answer);
          }
        };
      }
    } catch (e) { return null; }
    return null;
  }
  var builtCache = {};
  function buildCached(desc) {
    if (!(desc.key in builtCache)) builtCache[desc.key] = build(desc);
    return builtCache[desc.key];
  }
  /* a stable number from a key, so a question's choices are shuffled the same way each time */
  function hash(str) {
    var h = 2166136261;
    for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }

  /* ===================== Summary the hub reads ===================== */
  var open_ = [];
  function buildSummary() {
    if (!open_.length) return { headline: 'Nothing to review', sub: 'Everything you missed has been put right' };
    var byS = {};
    open_.forEach(function (d) { byS[d.src] = (byS[d.src] || 0) + 1; });
    var parts = ORDER.filter(function (k) { return byS[k]; }).map(function (k) { return byS[k] + ' ' + SOURCES[k].name.toLowerCase(); });
    return { headline: plural(open_.length, 'question') + ' to go over', sub: parts.join(' · ') };
  }

  /* ===================== The picker ===================== */
  function refresh() {
    open_ = collect();
    var byS = {};
    open_.forEach(function (d) { byS[d.src] = (byS[d.src] || 0) + 1; });

    var chosen = pickedSources(byS);
    var inScope = open_.filter(function (d) { return chosen[d.src]; });
    var oldest = open_.length ? open_[0].date : '';
    var cleared = Object.keys(state.cleared).length;

    /* what keeps coming back: the group with the most open questions */
    var byGroup = {};
    open_.forEach(function (d) { var g = d.group || SOURCES[d.src].name; byGroup[g] = (byGroup[g] || 0) + 1; });
    var worst = Object.keys(byGroup).sort(function (a, b) { return byGroup[b] - byGroup[a] || (a < b ? -1 : 1); })[0];

    $('#stats').innerHTML = [
      { n: open_.length, l: 'to go over' },
      { n: worst ? byGroup[worst] : 0, l: worst ? 'on ' + worst + ', the one that keeps coming back' : 'nothing sticking out' },
      { n: cleared, l: 'put right so far' },
      { n: oldest ? PH.fmtDate(oldest, { month: 'short', day: 'numeric' }) : '—', l: oldest ? 'oldest one still open' : 'nothing missed yet' }
    ].map(function (c) {
      return '<div class="stat"><div class="num">' + esc(String(c.n)) + '</div><div class="lbl">' + esc(c.l) + '</div></div>';
    }).join('');

    $('#srcs').innerHTML = ORDER.map(function (k) {
      var n = byS[k] || 0, src = SOURCES[k];
      return '<button type="button" class="src' + (n ? (chosen[k] ? ' on' : '') : ' empty') + '" data-src="' + k + '"' +
        (n ? '' : ' disabled') + ' aria-pressed="' + (n && chosen[k] ? 'true' : 'false') + '">' +
        '<span class="em" aria-hidden="true">' + src.emoji + '</span>' +
        '<span class="nm">' + esc(src.name) + '</span><span class="ct">' + n + '</span></button>';
    }).join('');

    $('#pickSub').textContent = open_.length ? 'Tap a source to leave it out' : '';
    $('#startBtn').disabled = !inScope.length;
    $('#startBtn').textContent = inScope.length ? 'Start review' : 'Nothing to review';
    $('#howMany').value = String(state.settings.howMany);

    renderList(inScope);
    save();
  }

  function pickedSources(byS) {
    var out = {}, any = false;
    ORDER.forEach(function (k) {
      var on = state.settings.sources[k];
      out[k] = (on === undefined ? true : on) && !!(byS[k]);
      if (out[k]) any = true;
    });
    if (!any) ORDER.forEach(function (k) { out[k] = !!(byS[k]); });   // never leave the child with nothing
    return out;
  }

  function clip(s, n) { s = String(s == null ? '' : s).replace(/\s+/g, ' ').trim(); return s.length > n ? s.slice(0, n - 1) + '…' : s; }
  function firstLine(code) {
    var lines = String(code).split('\n').filter(function (l) { return l.trim(); });
    return lines.length > 1 ? lines[0] + ' …' : (lines[0] || '');
  }
  function renderList(inScope) {
    var host = $('#listBody');
    if (!open_.length) {
      host.innerHTML = '<p class="empty">Nothing outstanding. Miss a question anywhere on the site and it turns up here. ' +
        '<a href="quizzes.html">Take a quiz →</a></p>';
      $('#listSub').textContent = '';
      return;
    }
    var groups = {}, order = [];
    inScope.forEach(function (d) {
      var g = SOURCES[d.src].name + ' · ' + d.group;
      if (!groups[g]) { groups[g] = []; order.push(g); }
      groups[g].push(d);
    });
    if (!order.length) { host.innerHTML = '<p class="empty">Every source is switched off above.</p>'; $('#listSub').textContent = ''; return; }
    host.innerHTML = order.map(function (g) {
      var list = groups[g].slice(0, 8);
      return '<div class="grp">' + esc(g) + ' · ' + plural(groups[g].length, 'question') + '</div><ul class="open">' +
        list.map(function (d) {
          var it = buildCached(d);
          var text = plainText(it ? (it.code ? firstLine(it.code) : it.qtext) : d.label);
          return '<li><span class="em" aria-hidden="true">' + SOURCES[d.src].emoji + '</span>' +
            '<span class="what"><b>' + esc(clip(text, 96)) + '</b></span>' +
            '<span class="when">missed ' + esc(PH.fmtDate(d.date, { month: 'short', day: 'numeric' })) + '</span></li>';
        }).join('') +
        (groups[g].length > list.length ? '<li><span class="what small" style="color:var(--muted)">and ' + (groups[g].length - list.length) + ' more</span></li>' : '') +
        '</ul>';
    }).join('');
    $('#listSub').textContent = plural(inScope.length, 'question') + ' picked, oldest first';
  }

  /* ===================== Asking ===================== */
  var run = null;

  function start() {
    var byS = {};
    open_.forEach(function (d) { byS[d.src] = (byS[d.src] || 0) + 1; });
    var chosen = pickedSources(byS);
    var pool = open_.filter(function (d) { return chosen[d.src]; });
    if (!pool.length) return;
    var want = state.settings.howMany || pool.length;
    var picked = pool.slice(0, want);

    $('#startBtn').disabled = true;
    $('#startBtn').textContent = 'Getting them ready…';
    needAll(picked.map(function (d) { return d.src; })).then(function () {
      var items = [];
      picked.forEach(function (d) {
        var it = buildCached(d);
        if (it) items.push({ desc: d, item: it });
      });
      $('#startBtn').disabled = false;
      $('#startBtn').textContent = 'Start review';
      if (!items.length) {
        PH.toast('Could not rebuild those questions on this device', 3200);
        return;
      }
      run = { items: items, i: 0, right: 0, checked: false, pick: -1, cleared: [] };
      $('#pickCard').hidden = true; $('#listCard').hidden = true; $('#doneCard').hidden = true;
      $('#askCard').hidden = false;
      renderQuestion();
      $('#askCard').scrollIntoView({ block: 'start' });
    });
  }

  function renderQuestion() {
    var cur = run.items[run.i], it = cur.item;
    run.checked = false; run.pick = -1;
    $('#h-ask').textContent = 'Question ' + (run.i + 1);
    $('#askSub').textContent = 'Missed ' + PH.fmtDate(cur.desc.date, { month: 'short', day: 'numeric', year: 'numeric' });
    $('#qpos').textContent = (run.i + 1) + ' of ' + run.items.length;
    $('#qfrom').textContent = SOURCES[cur.desc.src].emoji + ' ' + it.from;
    $('#pbar').style.width = Math.round(run.i / run.items.length * 100) + '%';

    $('#qbody').innerHTML =
      (it.svg ? '<div class="qsvg">' + it.svg + '</div>' : '') +
      '<div class="qtext">' + safeHTML(it.qtext) + '</div>' +
      (it.code ? '<div class="code">' + esc(it.code) + '</div>' : '');

    $('#qanswer').innerHTML = it.choices
      ? '<div class="choices" role="group" aria-label="Choose an answer">' + it.choices.map(function (c, i) {
          return '<button type="button" class="choice" data-pick="' + i + '">' +
            '<span class="ltr" aria-hidden="true">' + String.fromCharCode(65 + i) + '</span>' +
            '<span>' + safeHTML(c) + '</span></button>';
        }).join('') + '</div>'
      : '<div class="typed"><input class="input" id="typedIn" type="text" autocomplete="off" autocapitalize="off" ' +
        'spellcheck="false" aria-label="Your answer" placeholder="Your answer"></div>';

    $('#qverdict').innerHTML = '';
    $('#checkBtn').hidden = false; $('#checkBtn').disabled = false;
    $('#nextBtn').hidden = true;
    if (!it.choices) { var inp = $('#typedIn'); if (inp) inp.focus(); }
  }

  function check() {
    if (!run || run.checked) return;
    var cur = run.items[run.i], it = cur.item;
    var typed = it.choices ? '' : ($('#typedIn') ? $('#typedIn').value.trim() : '');
    if (it.choices && run.pick < 0) { PH.toast('Pick an answer first'); return; }
    if (!it.choices && !typed) { PH.toast('Type an answer first'); if ($('#typedIn')) $('#typedIn').focus(); return; }

    var ok = false;
    try { ok = !!it.ok(run.pick, typed); } catch (e) { ok = false; }
    run.checked = true;
    if (ok) {
      run.right++;
      run.cleared.push(cur.desc.key);
      state.cleared[cur.desc.key] = TODAY;
      save();
    }
    if (it.choices) {
      Array.prototype.forEach.call(document.querySelectorAll('#qanswer .choice'), function (b, i) {
        b.disabled = true;
        b.classList.remove('sel');
        if (it.choices[i] === it.answerText) b.classList.add('correct');
        else if (i === run.pick) b.classList.add('wrong');
      });
    } else if ($('#typedIn')) {
      $('#typedIn').disabled = true;
    }
    $('#qverdict').innerHTML =
      '<div class="verdict ' + (ok ? 'ok' : 'no') + '">' +
        '<div class="head ' + (ok ? 'ok' : 'no') + '">' + (ok ? '✓ Right — that one is done' : '✗ Not yet') + '</div>' +
        (ok ? '' : '<div class="why">The answer is <b>' + safeHTML(it.answerText) + '</b>.</div>') +
        (it.explain ? '<div class="why">' + safeHTML(it.explain) + '</div>' : '') +
      '</div>';
    $('#checkBtn').hidden = true;
    $('#nextBtn').hidden = false;
    $('#nextBtn').textContent = run.i + 1 >= run.items.length ? 'See how it went →' : 'Next →';
    $('#nextBtn').focus();
  }

  function next() {
    if (!run) return;
    if (!run.checked) return check();
    run.i++;
    if (run.i >= run.items.length) return finish();
    renderQuestion();
  }

  function finish() {
    var n = run.items.length, right = run.right;
    $('#pbar').style.width = '100%';
    $('#askCard').hidden = true;
    $('#doneCard').hidden = false;
    var left = collect().length;
    $('#doneBody').innerHTML =
      '<div class="done-big">' + right + ' / ' + n + '</div>' +
      '<p>' + (right === n ? 'Every one of them put right. ' : right ? plural(right, 'question') + ' cleared off the list. ' : 'None cleared this time. ') +
      (left ? plural(left, 'question') + ' still to go over.' : 'Nothing is outstanding now.') + '</p>' +
      (right < n ? '<p class="small" style="color:var(--muted)">The ones you missed again stay on the list, so they will come back.</p>' : '');
    run = null;
    refresh();
    $('#pickCard').hidden = false;
    $('#listCard').hidden = false;
  }

  function stop() {
    run = null;
    $('#askCard').hidden = true;
    $('#pickCard').hidden = false;
    $('#listCard').hidden = false;
    refresh();
  }

  /* ===================== Wiring ===================== */
  document.addEventListener('click', function (e) {
    var s = e.target.closest('.src[data-src]');
    if (s && !s.disabled) {
      var k = s.getAttribute('data-src');
      var byS = {}; open_.forEach(function (d) { byS[d.src] = (byS[d.src] || 0) + 1; });
      var chosen = pickedSources(byS);
      state.settings.sources[k] = !chosen[k];
      refresh();
      return;
    }
    var p = e.target.closest('.choice[data-pick]');
    if (p && !p.disabled && run) {
      run.pick = Number(p.getAttribute('data-pick'));
      Array.prototype.forEach.call(document.querySelectorAll('#qanswer .choice'), function (b) { b.classList.remove('sel'); });
      p.classList.add('sel');
      return;
    }
    if (e.target.closest('#startBtn')) { start(); return; }
    if (e.target.closest('#checkBtn')) { check(); return; }
    if (e.target.closest('#nextBtn')) { next(); return; }
    if (e.target.closest('#stopBtn')) { stop(); return; }
    if (e.target.closest('#againBtn')) { $('#doneCard').hidden = true; start(); return; }
  });
  document.getElementById('howMany').addEventListener('change', function (e) {
    state.settings.howMany = Number(e.target.value) || 0;
    save();
  });
  document.addEventListener('keydown', function (e) {
    if (!run || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'Enter') {
      if (/^(input)$/i.test((e.target && e.target.tagName) || '') || !run.checked) { e.preventDefault(); check(); }
      else { e.preventDefault(); next(); }
      return;
    }
    if (/^(input|textarea|select)$/i.test((e.target && e.target.tagName) || '')) return;
    var it = run.items[run.i].item;
    if (it.choices && !run.checked && /^[1-9a-dA-D]$/.test(e.key)) {
      var i = /[1-9]/.test(e.key) ? Number(e.key) - 1 : e.key.toLowerCase().charCodeAt(0) - 97;
      var b = document.querySelectorAll('#qanswer .choice')[i];
      if (b) { e.preventDefault(); b.click(); }
    }
  });

  refresh();
  /* The list is useful straight away, but it reads far better once each row can name its question,
     so pull in the generators for whatever is open and draw it again. */
  if (open_.length) {
    needAll(open_.map(function (d) { return d.src; })).then(function () {
      builtCache = {};
      try { refresh(); } catch (e) { /* the list already works without them */ }
    });
  }
  window.PH_REVIEW = { collect: collect, build: build, refresh: refresh, start: start, check: check, next: next,
    state: function () { return state; }, open: function () { return open_; }, run: function () { return run; },
    ready: function () { return !!(window.CPM_QUIZZES || window.IM1 || window.PY || window.ES || window.SCI); } };
})();
</script>
</body></html>
