<!doctype html><title>quiz print test</title><body style="margin:0"><script>
const f=document.createElement('iframe'); f.style.cssText='width:1280px;height:1200px;border:0'; f.src='../quizzes.html'; document.body.appendChild(f);
const R=[]; const ok=(n,c,detail)=>{const l=(c?'PASS ':'FAIL ')+n+(c||!detail?'':' :: '+detail); R.push(l); console.log(l);};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
f.addEventListener('load', async () => {
  const w=f.contentWindow, d=f.contentDocument, $=s=>d.querySelector(s), $$=s=>Array.from(d.querySelectorAll(s));
  const txt = sel => { const e = $(sel); return e ? (e.innerText || e.textContent || '').trim() : ''; };
  try {
    /* one per lesson, however many chapters the bank holds */
    ok('every lesson row has a print button', $$('[data-printq]').length === w.CPM_QUIZZES.lessons.length
       && $$('[data-printq]').length >= 21);
    const heads = $$('.sect-head').map(e => e.textContent).join(' | ');
    ok('both chapters are listed', /Section 1\.1/.test(heads) && /Section 2\.1/.test(heads), heads);
    ok('and each section says which chapter it belongs to', /Justification and Similarity/.test(heads), heads);
    const q = w.PHQuizDebug.buildQuiz({ lesson: '1.3.2', seed: 12345 });
    const html = w.PHQuizDebug.quizSheetHTML(q);
    ok('complete document', /^<!DOCTYPE html>/.test(html) && /<\/html>$/.test(html));
    ok('names the lesson and book', /1\.3\.2/.test(html) && /Integrated II/.test(html));
    ok('has a name/date/score rule', /Name/.test(html) && /Score/.test(html));
    ok('all 10 questions printed', (html.match(/class="prob"/g) || []).length === 10);
    ok('diagrams travel into the sheet', /<svg/.test(html));
    ok('multiple choice printed as a lettered list', /ol class="choices"/.test(html));
    ok('answer key on its own page', /page-break-before:always/.test(html) && /Answer key/.test(html));
    ok('key gives the letter and the text', /class="a">[A-D]\)/.test(html));
    ok('explanations in the key', /class="w"/.test(html));
    ok('self-contained: no scripts or links out', !/<script|<link|https?:\/\//.test(html));
    // a lesson whose questions are all generated still prints
    const q2 = w.PHQuizDebug.buildQuiz({ lesson: '1.3.4', seed: 777 });
    ok('generated questions print too', (w.PHQuizDebug.quizSheetHTML(q2).match(/class="prob"/g) || []).length === 10);
    // the print button builds a frame rather than navigating away
    let printed = false;
    const realPrint = w.print; 
    $$('[data-printq]')[0].click();
    await new Promise(r => setTimeout(r, 400));
    const fr = d.getElementById('printFrame');
    ok('print frame created with the sheet', !!fr && /class="prob"/.test(fr.srcdoc || ''));
    ok('page did not navigate away', !!d.querySelector('[data-printq]'));
    /* ---- the clock can be turned off, because it rushes some people ---- */
    w.localStorage.removeItem('ph.quiz.clock');
    $('[data-start]').click(); await sleep(200);
    ok('a quiz shows a clock to begin with', !$('#q-timer').hidden && $('#q-clock').getAttribute('aria-pressed') === 'true');
    $('#q-clock').click(); await sleep(150);
    ok('it can be turned off', $('#q-timer').hidden && $('#q-clock').getAttribute('aria-pressed') === 'false');
    ok('and that is remembered', w.localStorage.getItem('ph.quiz.clock') === 'off');
    ok('the button says what it will do now', /Show the clock/.test($('#q-clock').getAttribute('aria-label') || ''),
       $('#q-clock').getAttribute('aria-label'));
    await sleep(1100);
    ok('and it stays hidden while the quiz runs on', $('#q-timer').hidden);
    $('#q-clock').click(); await sleep(150);
    ok('it comes back when asked', !$('#q-timer').hidden);
    ok('and nothing is stored once it is back to normal', w.localStorage.getItem('ph.quiz.clock') === null);
    $('#q-quit').click(); await sleep(200);

    /* ---- the three Integrated courses ---- */
    ok('all three courses are offered', $$('#courseTabs .tab').length === 3,
       $$('#courseTabs .tab').map(t => t.textContent).join(' | '));
    ok('Integrated II is the one with a written bank', /Integrated II/.test($('#courseTabs .tab.on').textContent),
       $('#courseTabs .tab.on').textContent);
    ok('and it shows both its lessons and its generated topics',
       $$('[data-printq]').length >= 21 && $$('[data-startgen]').length >= 5,
       $$('[data-printq]').length + ' lessons, ' + $$('[data-startgen]').length + ' topics');

    $('[data-course="im1"]').click(); await sleep(120);
    ok('Integrated I has topics of its own', $$('[data-startgen]').length >= 10, String($$('[data-startgen]').length));
    ok('and no bank lessons, because there is no bank for it', $$('[data-printq]').length === 0);
    const headText = $$('#topic-list .sect-head').map(h => h.textContent).join(' | ');
    ok('its topics are grouped by the CPM chapter they come from',
       /Chapter 1/.test(headText) && /Chapter 2/.test(headText), headText.slice(0, 90));
    const chapterNos = $$('#topic-list .sect-head').map(h => Number((h.textContent.match(/Chapter (\d+)/) || [])[1] || 99));
    ok('and the chapters are in book order', chapterNos.every((n, i) => i === 0 || n >= chapterNos[i - 1]), chapterNos.join(','));

    /* a generated quiz really is a quiz: ten pick-one questions from a seed */
    $('[data-startgen]').click(); await sleep(300);
    const gq = w.PH_QUIZ ? w.PH_QUIZ.quiz() : null;
    ok('starting one builds ten questions', !!gq && gq.items.length === 10, gq ? String(gq.items.length) : 'no hook');
    ok('it remembers which topic it came from', !!gq.gen && gq.gen.course === 'im1', JSON.stringify(gq && gq.gen));
    ok('it has a seed', gq.seed > 0, String(gq.seed));
    ok('every question is pick-one', gq.items.every(i => i.type === 'mc' && i.choices.length >= 2),
       gq.items.filter(i => i.type !== 'mc').length + ' not multiple choice');
    ok('exactly one option is right each time', gq.items.every(i => i.answer >= 0 && i.answer < i.choices.length));
    ok('no question shows its markup', !/&lt;sup&gt;|<sup>/.test(txt('.q-text')) || /<sup>/.test($('.q-text').innerHTML),
       txt('.q-text').slice(0, 60));
    ok('the title names the course and the topic', /Integrated I · /.test(txt('#q-title')), txt('#q-title'));

    /* the same seed gives the same quiz back */
    const again = w.PH_QUIZ.build({ lesson: gq.lesson, seed: gq.seed });
    ok('the same seed rebuilds the same questions',
       again.items.map(i => i.q).join('|') === gq.items.map(i => i.q).join('|'));
    const different = w.PH_QUIZ.build({ lesson: gq.lesson, seed: gq.seed + 1 });
    ok('and another seed gives different ones', different.items.map(i => i.q).join('|') !== gq.items.map(i => i.q).join('|'));

    /* retrying the ones that were missed must ask those, not ten new ones */
    const asked = gq.items.map(i => i.q);
    for (let n = 0; n < 20; n++) {
      const cur = w.PH_QUIZ.quiz();
      if (!cur || cur.finished) break;
      const it = cur.items[cur.i];
      const buttons = $$('.choice');
      if (!buttons.length) break;
      buttons[n === 0 ? it.answer : (it.answer + 1) % it.choices.length].click(); await sleep(40);
      if ($('#q-check')) { $('#q-check').click(); await sleep(60); }
      if ($('#q-next')) { $('#q-next').click(); await sleep(60); }
    }
    await sleep(250);
    ok('a finished quiz offers the ones that were missed', !!$('#r-missed') && /\(9\)/.test($('#r-missed').textContent),
       $('#r-missed') ? $('#r-missed').textContent : 'no button');
    $('#r-missed').click(); await sleep(250);
    const retry = w.PH_QUIZ.quiz();
    ok('and retrying asks exactly those', retry.items.length === 9, String(retry.items.length));
    ok('the very same questions, not new ones', retry.items.every(it => asked.indexOf(it.q) >= 0));
    ok('from the same seed', retry.seed === gq.seed && retry.kind === 'missed', retry.seed + ' vs ' + gq.seed);
    /* what a retry records has to point at the original ten, or review rebuilds the wrong questions */
    /* work through whatever is on screen, stopping when the quiz is over rather than counting on it */
    for (let n = 0; n < 20; n++) {
      const cur = w.PH_QUIZ.quiz();
      if (!cur || cur.finished) break;
      const it = cur.items[cur.i];
      const buttons = $$('.choice');
      if (!buttons.length) break;
      buttons[(it.answer + 1) % it.choices.length].click(); await sleep(40);
      if ($('#q-check')) { $('#q-check').click(); await sleep(60); }
      if ($('#q-next')) { $('#q-next').click(); await sleep(60); }
    }
    await sleep(250);
    const att = w.PH_QUIZ.state().attempts[0];
    ok('a retry is recorded against the questions it came from',
       att.gen && att.gen.count === 10 && att.missed.every(i => Number.isInteger(i) && i >= 0 && i < 10),
       JSON.stringify(att && att.missed));
    ok('and is marked as a retry', att.kind === 'missed', att.kind);
    /* after a finished quiz the page is on its results, where there is no Quit button */
    if ($('#q-quit')) { $('#q-quit').click(); await sleep(200); }
    if ($('[data-startgen]')) { $('[data-startgen]').click(); await sleep(300); }
    else if ($('#r-new')) { $('#r-new').click(); await sleep(300); }
    const gq2 = w.PH_QUIZ.quiz();
    ok('a new quiz can be started straight from the results', !!gq2 && !gq2.finished);

    /* and it prints, with its options and its answer key */
    const gsheet = w.PH_QUIZ.sheet(gq2);
    ok('a generated quiz prints', /^<!DOCTYPE html>/.test(gsheet));
    ok('with its options', /ol class="choices"/.test(gsheet));
    ok('with an answer key', /Answer key/.test(gsheet));
    ok('and it is named on the paper, not called a mixed review',
       /Integrated I/.test(gsheet) && !/Mixed review/.test(gsheet), (gsheet.match(/<h1>[^<]*<\/h1>/) || [])[0]);

  } catch (e) { console.log('FAIL threw: ' + e.message); }
  console.log('RESULTS ' + R.filter(function (l) { return l.indexOf('FAIL') === 0; }).length + ' failed of ' + R.length);
});
</script></body>
