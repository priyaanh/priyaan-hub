<!doctype html><title>calendar test</title><body style="margin:0"><script>
const f = document.createElement('iframe'); f.style.cssText='width:1280px;height:1200px;border:0'; f.src='../calendar.html'; document.body.appendChild(f);
const R=[]; const ok=(n,c,detail)=>{const l=(c?'PASS ':'FAIL ')+n+(c||!detail?'':' :: '+detail); R.push(l); console.log(l);}; const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let phase = 0;
f.addEventListener('load', async () => {
  const w=f.contentWindow, d=f.contentDocument, $=s=>d.querySelector(s), $$=s=>Array.from(d.querySelectorAll(s));
  const txt = sel => { const e = $(sel); return e ? (e.innerText || e.textContent || '').trim() : ''; };
  if (phase === 0) {
    phase = 1;
    // seed a v1 (old format: plain strings) state, then reload to check migration
    w.localStorage.setItem('ph.calendar.v1', JSON.stringify({ version:1, settings:{ calendars:['student@example.com','parent@example.com'], mode:'MONTH', tz:'America/Los_Angeles', clientId:'' }, summary:{} }));
    w.location.reload(); return;
  }
  try {
    ok('v1 strings migrated to 2 rows', $$('.cal-row').length === 2);
    /* the label is made from the part before the @, capitalised */
    ok('migrated names are labels', $$('.cal-row .nm')[0].textContent.trim().startsWith('Student'),
       $$('.cal-row .nm')[0].textContent);
    ok('migrated calendars get different colours', $$('.cal-row .dot')[0].style.getPropertyValue('--c') !== $$('.cal-row .dot')[1].style.getPropertyValue('--c'));
    ok('mode MONTH kept', $('[data-mode="MONTH"]').getAttribute('aria-selected') === 'true');
    // add a third
    $('#newSrc').value = 'scouts.troop@example.com'; $('#newName').value = 'Scouts';
    $('#addForm').dispatchEvent(new w.Event('submit', {bubbles:true, cancelable:true})); await sleep(60);
    ok('added third calendar', $$('.cal-row').length === 3);
    ok('custom label used', $$('.cal-row .nm')[2].textContent.trim() === 'Scouts');
    ok('quick-add target lists 3', $$('#quickTarget option').length === 3);
    const src0 = $('#calFrame').getAttribute('src');
    ok('embed has 3 src params', (src0.match(/&src=/g)||[]).length === 3);
    ok('embed has colour params', (src0.match(/&color=/g)||[]).length === 3);
    ok('embed shows calendar switcher when >1', src0.includes('showCalendars=1'));
    // duplicate rejected
    $('#newSrc').value = 'Scouts.Troop@example.com'; $('#addForm').dispatchEvent(new w.Event('submit', {bubbles:true, cancelable:true})); await sleep(60);
    ok('duplicate (case-insensitive) rejected', $$('.cal-row').length === 3);
    // hide one
    $$('[data-toggle]')[1].click(); await sleep(60);
    ok('hidden row marked', $$('.cal-row')[1].classList.contains('off'));
    ok('embed drops hidden calendar', ($('#calFrame').getAttribute('src').match(/&src=/g)||[]).length === 2);
    ok('quick-add target drops hidden', $$('#quickTarget option').length === 2);
    ok('count line says 3 · 2 shown', $('#calCount').textContent.includes('3 calendars') && $('#calCount').textContent.includes('2 shown'));
    // colour change
    const sw = $$('.cal-row')[0].querySelectorAll('.swatch')[3]; const want = sw.dataset.color; sw.click(); await sleep(60);
    ok('colour swatch applied', $$('.cal-row .dot')[0].style.getPropertyValue('--c') === want && $('#calFrame').getAttribute('src').includes(encodeURIComponent(want)));
    // quick add url points at chosen calendar
    const qsel = $('#quickTarget'); qsel.value = 'scouts.troop@example.com'; qsel.dispatchEvent(new w.Event('change',{bubbles:true})); await sleep(60);
    ok('quick-add uses chosen calendar', $('#quick a').href.includes(encodeURIComponent('scouts.troop@example.com')));
    ok('quick-add is a Google template link', $('#quick a').href.startsWith('https://calendar.google.com/calendar/render?action=TEMPLATE'));
    // remove
    $$('[data-remove]')[2].click(); await sleep(60);
    ok('removed third', $$('.cal-row').length === 2);
    const saved = JSON.parse(w.localStorage.getItem('ph.calendar.v1'));
    ok('state persisted as v2 objects', saved.version === 2 && typeof saved.settings.calendars[0] === 'object' && saved.settings.calendars[0].src);
    ok('hub summary mentions calendars', /calendar/i.test(saved.summary.sub) || saved.summary.headline === 'Google Calendar');
    // share-help shows the first address
    ok('share help names first account', $('#shareTo').textContent.includes('@'));

    /* ---- which Google account the frame uses ---- */
    ok('the embed names an account', /\/calendar\/u\/0\/embed/.test($('#calFrame').getAttribute('src')),
       $('#calFrame').getAttribute('src').slice(0, 60));
    ok('the page says which account it is showing', txt('#authLbl') === '1', txt('#authLbl'));
    $('#tryNextAcct').click(); await sleep(60);
    ok('trying the next account moves to the next one', /\/calendar\/u\/1\/embed/.test($('#calFrame').getAttribute('src')),
       $('#calFrame').getAttribute('src').slice(0, 60));
    ok('and remembers it', (JSON.parse(w.localStorage.getItem('ph.calendar.v1')).settings.authuser) === 1);
    ok('and says so', txt('#authLbl') === '2', txt('#authLbl'));
    ok('the permission message is explained on the page', /do not have permission/i.test(txt('#permHelp')));
    ok('and it names the three reasons', $$('#permHelp .steps li').length === 3, String($$('#permHelp .steps li').length));

    /* ---- other Google things ---- */
    const E = w.PH_CAL.asEmbed;
    ok('a Doc link becomes a preview', E('https://docs.google.com/document/d/1AbC/edit').url === 'https://docs.google.com/document/d/1AbC/preview');
    ok('a Slides link becomes an embed', /\/presentation\/d\/1Pq\/embed/.test(E('https://docs.google.com/presentation/d/1Pq/edit').url || ''));
    ok('a Form link becomes the embedded form', /viewform\?embedded=true/.test(E('https://docs.google.com/forms/d/e/1F/viewform').url || ''));
    ok('a Drive folder becomes the folder view', /embeddedfolderview\?id=1Folder/.test(E('https://drive.google.com/drive/folders/1Folder').url || ''));
    ok('a My Maps link becomes the map embed', /maps\/d\/embed\?mid=1Map/.test(E('https://www.google.com/maps/d/viewer?mid=1Map').url || ''));
    ok('a YouTube link uses the no-cookie player', /youtube-nocookie\.com\/embed\/abc/.test(E('https://www.youtube.com/watch?v=abc').url || ''));
    ok('Tasks is refused, by name', /Tasks cannot be put in a frame/.test(E('https://tasks.google.com/').error || ''), E('https://tasks.google.com/').error);
    ok('Gmail is refused too', !!E('https://mail.google.com/').error);
    ok('a calendar link is sent to the box that handles calendars', /further up the page/.test(E('https://calendar.google.com/calendar/u/0/r').error || ''));
    ok('http is refused', /https/.test(E('http://docs.google.com/document/d/1/edit').error || ''));
    ok('somewhere else entirely is refused', !!E('https://example.com/x').error);
    ok('nonsense is refused', !!E('not a link').error);

    w.PH_CAL.addEmbed('https://docs.google.com/document/d/1AbC/edit', 'Study guide'); await sleep(60);
    ok('an added thing is shown in a frame', $$('.embed-row').length === 1 && /docs\.google\.com\/document\/d\/1AbC\/preview/.test($('.embed-row iframe').src));
    ok('and is labelled', /Study guide/.test(txt('#embedList')));
    ok('the same one is not added twice', w.PH_CAL.addEmbed('https://docs.google.com/document/d/1AbC/edit', '') === false);
    ok('it survives in storage', (JSON.parse(w.localStorage.getItem('ph.calendar.v1')).settings.embeds || []).length === 1);
    $('[data-unembed]').click(); await sleep(60);
    ok('and can be removed', $$('.embed-row').length === 0);
    ok('the page says what cannot be framed at all', /cannot be put in a frame at all/.test(txt('body')));

    /* forgetting the lot, for when a saved account should not be on the device any more */
    ok('there is a way to forget every account at once', !!$('#forgetAll') && !$('#forgetAll').hidden);
    w.confirm = () => true;
    $('#forgetAll').click(); await sleep(80);
    ok('forgetting them all clears the list', $$('.cal-row').length === 0, $$('.cal-row').length + ' left');
    ok('and nothing is left in storage', (JSON.parse(w.localStorage.getItem('ph.calendar.v1')).settings.calendars || []).length === 0);
    ok('and it asks whose calendar to show again', !$('#setupCard').hidden);
    ok('the button goes away once there is nothing to forget', $('#forgetAll').hidden);
  } catch (e) { R.push('FAIL threw: ' + e.message); }
  try { w.localStorage.removeItem('ph.calendar.v1'); } catch(e){}
  console.log('RESULTS ' + R.filter(function (l) { return l.indexOf('FAIL') === 0; }).length + ' failed of ' + R.length);
});
</script></body>
