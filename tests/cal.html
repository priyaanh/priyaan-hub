<!doctype html><title>calendar test</title><body style="margin:0"><script>
const f = document.createElement('iframe'); f.style.cssText='width:1280px;height:1200px;border:0'; f.src='../calendar.html'; document.body.appendChild(f);
const R=[]; const ok=(n,c)=>{const l=(c?'PASS ':'FAIL ')+n; R.push(l); console.log(l);}; const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let phase = 0;
f.addEventListener('load', async () => {
  const w=f.contentWindow, d=f.contentDocument, $=s=>d.querySelector(s), $$=s=>Array.from(d.querySelectorAll(s));
  if (phase === 0) {
    phase = 1;
    // seed a v1 (old format: plain strings) state, then reload to check migration
    w.localStorage.setItem('ph.calendar.v1', JSON.stringify({ version:1, settings:{ calendars:['priyaan.haldiya@gmail.com','mom@example.com'], mode:'MONTH', tz:'America/Los_Angeles', clientId:'' }, summary:{} }));
    w.location.reload(); return;
  }
  try {
    ok('v1 strings migrated to 2 rows', $$('.cal-row').length === 2);
    ok('migrated names are labels', $$('.cal-row .nm')[0].textContent.trim().startsWith('Priyaan'));
    ok('migrated calendars get different colours', $$('.cal-row .dot')[0].style.getPropertyValue('--c') !== $$('.cal-row .dot')[1].style.getPropertyValue('--c'));
    ok('mode MONTH kept', $('[data-mode="MONTH"]').getAttribute('aria-selected') === 'true');
    // add a third
    $('#newSrc').value = 'scouts.troop@example.com'; $('#newName').value = 'Scouts';
    $('#addForm').dispatchEvent(new w.Event('submit', {bubbles:true, cancelable:true})); await sleep(60);
    ok('added third calendar', $$('.cal-row').length === 3);
    ok('custom label used', $$('.cal-row .nm')[2].textContent.trim() === 'Scouts');
    ok('quick-add target lists 3', $$('#quickTarget option').length === 3);
    const src0 = $('#calFrame').getAttribute('src');
    ok('embed has 3 src params', (src0.match(/&src=/g)||[]).length === 3);
    ok('embed has colour params', (src0.match(/&color=/g)||[]).length === 3);
    ok('embed shows calendar switcher when >1', src0.includes('showCalendars=1'));
    // duplicate rejected
    $('#newSrc').value = 'Scouts.Troop@example.com'; $('#addForm').dispatchEvent(new w.Event('submit', {bubbles:true, cancelable:true})); await sleep(60);
    ok('duplicate (case-insensitive) rejected', $$('.cal-row').length === 3);
    // hide one
    $$('[data-toggle]')[1].click(); await sleep(60);
    ok('hidden row marked', $$('.cal-row')[1].classList.contains('off'));
    ok('embed drops hidden calendar', ($('#calFrame').getAttribute('src').match(/&src=/g)||[]).length === 2);
    ok('quick-add target drops hidden', $$('#quickTarget option').length === 2);
    ok('count line says 3 · 2 shown', $('#calCount').textContent.includes('3 calendars') && $('#calCount').textContent.includes('2 shown'));
    // colour change
    const sw = $$('.cal-row')[0].querySelectorAll('.swatch')[3]; const want = sw.dataset.color; sw.click(); await sleep(60);
    ok('colour swatch applied', $$('.cal-row .dot')[0].style.getPropertyValue('--c') === want && $('#calFrame').getAttribute('src').includes(encodeURIComponent(want)));
    // quick add url points at chosen calendar
    const qsel = $('#quickTarget'); qsel.value = 'scouts.troop@example.com'; qsel.dispatchEvent(new w.Event('change',{bubbles:true})); await sleep(60);
    ok('quick-add uses chosen calendar', $('#quick a').href.includes(encodeURIComponent('scouts.troop@example.com')));
    ok('quick-add is a Google template link', $('#quick a').href.startsWith('https://calendar.google.com/calendar/render?action=TEMPLATE'));
    // remove
    $$('[data-remove]')[2].click(); await sleep(60);
    ok('removed third', $$('.cal-row').length === 2);
    const saved = JSON.parse(w.localStorage.getItem('ph.calendar.v1'));
    ok('state persisted as v2 objects', saved.version === 2 && typeof saved.settings.calendars[0] === 'object' && saved.settings.calendars[0].src);
    ok('hub summary mentions calendars', /calendar/i.test(saved.summary.sub) || saved.summary.headline === 'Google Calendar');
    // share-help shows the first address
    ok('share help names first account', $('#shareTo').textContent.includes('@'));
  } catch (e) { R.push('FAIL threw: ' + e.message); }
  try { w.localStorage.removeItem('ph.calendar.v1'); } catch(e){}
  console.log('RESULTS ' + R.filter(function (l) { return l.indexOf('FAIL') === 0; }).length + ' failed of ' + R.length);
});
</script></body>
