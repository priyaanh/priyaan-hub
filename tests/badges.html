<!doctype html><title>badges functional test</title><body style="margin:0"><script>
const f = document.createElement('iframe'); f.style.cssText = 'width:1280px;height:1200px;border:0;display:block'; f.src = '../badges.html'; document.body.appendChild(f);
const results = []; const ok = (name, cond) => results.push((cond ? 'PASS ' : 'FAIL ') + name);
const sleep = ms => new Promise(r => setTimeout(r, ms));
f.addEventListener('load', async () => {
  const w = f.contentWindow, d = f.contentDocument, $ = s => d.querySelector(s), $$ = s => Array.from(d.querySelectorAll(s));
  let snapshot = null; try { snapshot = w.localStorage.getItem('ph.badges.v1'); w.localStorage.removeItem('ph.badges.v1'); } catch (e) {}
  const setStatus = async (id, v) => { const sel = $('[data-cat="' + id + '"]'); sel.value = v; sel.dispatchEvent(new w.Event('change', { bubbles: true })); await sleep(50); };
  ok('139 rows rendered (after Show all)', ($$('.cat-row').length === 40));
  $('[data-action="cat-all"]').click(); await sleep(50);
  ok('show all gives 139 rows', $$('.cat-row').length === 139);
  await setStatus('camping', 'earned');
  ok('Camping earned → Eagle 1 / 14', $('#eagle').textContent.includes('1 / 14'));
  ok('earned row has date input', !!$('[data-catdate="camping"]'));
  await setStatus('cycling', 'earned');
  ok('Cycling (pick one) → 2 / 14', $('#eagle').textContent.includes('2 / 14'));
  await setStatus('hiking', 'earned');
  ok('Hiking counts as elective → 1 / 7', $('#eagle').textContent.includes('1 / 7') && $('#eagle').textContent.includes('2 / 14'));
  await setStatus('archery', 'progress');
  ok('in-progress row has Started date', !!$('[data-catstart="archery"]') && $('[data-catstart="archery"]').value === w.PH.todayISO());
  ok('stats tile counts earned 3', $('#ovStats').textContent.includes('3'));
  $('[data-catfilter="earned"]').click(); await sleep(50);
  ok('Earned filter shows 3 rows', $$('.cat-row').length === 3);
  ok('chip count for earned = 3', $('[data-catfilter="earned"] .cnt').textContent === '3');
  $('[data-catfilter="all"]').click(); await sleep(50);
  const sort = $('#catSort'); sort.value = 'status'; sort.dispatchEvent(new w.Event('change', { bubbles: true })); await sleep(50);
  ok('sort by status puts earned first', $$('.cat-row')[0].classList.contains('earned'));
  sort.value = 'az'; sort.dispatchEvent(new w.Event('change', { bubbles: true })); await sleep(30);
  const search = $('#catSearch'); search.value = 'aquatics'; search.dispatchEvent(new w.Event('input', { bubbles: true })); await sleep(50);
  ok('search matches category (Aquatics = 10)', $$('.cat-row').length === 10);
  search.value = ''; search.dispatchEvent(new w.Event('input', { bubbles: true })); await sleep(50);
  const cat = $('#catCategory'); cat.value = 'Sports & Fitness'; cat.dispatchEvent(new w.Event('change', { bubbles: true })); await sleep(50);
  ok('category filter Sports & Fitness = 7', $$('.cat-row').length === 7);
  cat.value = ''; cat.dispatchEvent(new w.Event('change', { bubbles: true })); await sleep(50);
  const link = $('a[data-pdf]'); link.click(); await sleep(100);
  ok('workbook opens in dialog', $('#pdfDlg').open && $('#pdfFrame').getAttribute('src') === link.dataset.pdf);
  $('[data-action="pdf-close"]').click(); await sleep(50);
  ok('dialog closes and clears src', !$('#pdfDlg').open && !$('#pdfFrame').getAttribute('src'));
  const saved = JSON.parse(w.localStorage.getItem('ph.badges.v1'));
  ok('state saved with catalog statuses', saved && saved.catalog && saved.catalog.camping.status === 'earned' && saved.catalog.archery.started);
  ok('hub summary reflects 3 earned', saved.summary.headline.startsWith('3 badges earned'));
  try { if (snapshot == null) w.localStorage.removeItem('ph.badges.v1'); else w.localStorage.setItem('ph.badges.v1', snapshot); } catch (e) {}
  console.log('RESULTS\n' + results.join('\n'));
});
</script></body>
