<script>
/* Visits every page (home, courses, units, skills, CPM books and lessons) and reports script errors,
   leaked "undefined"/"NaN" text, and anything wider than the screen. run.sh opens it at phone width. */
(async function () {
  const A = ACADEMY, main = document.getElementById('main');
  const tick = ms => new Promise(r => setTimeout(r, ms || 0));
  let errors = [];
  window.addEventListener('error', e => errors.push(String(e.message)));
  const routes = ['#/', '#/courses', '#/courses/Elementary', '#/courses/Middle%20school', '#/courses/High%20school', '#/courses/cpm', '#/courses/saved', '#/progress', '#/settings', '#/search/fraction', '#/review', '#/cpm', '#/tutor', '#/tutor/new'];
  A.courses.forEach(c => { routes.push('#/course/' + c.id); c.units.forEach(u => routes.push('#/unit/' + c.id + '/' + u.id)); });
  Object.keys(A.skills).forEach(id => routes.push('#/skill/' + encodeURIComponent(id)));
  A.cpm.forEach(b => { routes.push('#/cpm/' + b.id); b.chapters.forEach(ch => ch.lessons.forEach(l => routes.push('#/cpm/' + b.id + '/' + l.id))); });
  // the newer pages: today's practice, the graphing calculator (with sliders), and a worksheet for every unit and some lessons
  routes.push('#/setup', '#/tiles', '#/tiles/compare', '#/tiles/eq/' + DRAW.encode('3x - 2 = x + 6'), '#/chance', '#/chance/dice', '#/chance/bag', '#/chance/coins2', '#/words', '#/words/cards', '#/words/absolute-value', '#/profile', '#/report', '#/vs/' + DRAW.encode(JSON.stringify({ k: 'p', id: 'math7.add-negatives', seed: 'abc12', score: 6, total: 7, name: 'Sam' })), '#/vs/' + DRAW.encode(JSON.stringify({ k: 's', id: 'times', secs: 60, seed: 'q9', score: 31 })), '#/vs/broken');
  routes.push('#/sprint', '#/steps', '#/steps/' + DRAW.encode('3(x - 4) = 2x + 5\n3x - 12 = 2x + 5\nx = 17\n-2x + 5 > 11\nx > -3'), '#/prep/cc2/3', '#/prep/int1/2');
  SPRINT.DECKS.forEach(d => routes.push('#/sprint/' + d.id));
  routes.push('#/daily', '#/graph', '#/graph/' + DRAW.encode('y = a(x - h)^2 + k\na = 1\nh = 2\nk = -3\nx^2 + y^2 < 16\ntriangle A(1,1) B(4,1) C(1,3)'));
  A.courses.forEach(c => c.units.forEach(u => routes.push('#/worksheet/unit/' + c.id + '/' + u.id)));
  A.cpm.forEach(b => b.chapters.slice(0, 2).forEach(ch => ch.lessons.slice(0, 2).forEach(l => { if (l.skills.some(id => A.skills[id])) routes.push('#/worksheet/lesson/' + b.id + '/' + encodeURIComponent(l.id)); })));
  const problems = { error: [], text: [], wide: [] };
  for (const r of routes) {
    errors = [];
    location.hash = r; await tick(5);
    const t = main.innerText || '';
    if (errors.length) problems.error.push(r + ' :: ' + errors[0]);
    const bad = t.match(/\bundefined\b|\bNaN\b|\[object Object\]|Something went wrong/);
    if (bad) problems.text.push(r + ' :: ' + bad[0] + ' :: ' + t.slice(Math.max(0, t.indexOf(bad[0]) - 60), t.indexOf(bad[0]) + 40).replace(/\s+/g, ' '));
    const vw = document.documentElement.clientWidth;
    if (document.documentElement.scrollWidth > vw + 1) {
      let worst = null;
      main.querySelectorAll('*').forEach(el => { const b = el.getBoundingClientRect(); if (b.right > vw + 1 && (!worst || b.right > worst.r)) worst = { r: b.right, el }; });
      problems.wide.push(r + ' :: ' + document.documentElement.scrollWidth + 'px :: ' + (worst ? worst.el.tagName + '.' + worst.el.className + ' "' + (worst.el.innerText || '').slice(0, 40).replace(/\s+/g, ' ') + '"' : '?'));
    }
  }
  console.log('ROUTES ' + routes.length + ' at ' + document.documentElement.clientWidth + 'px wide');
  for (const k of Object.keys(problems)) { console.log('PROBLEM ' + k + ' ' + problems[k].length); problems[k].slice(0, 12).forEach(p => console.log('  ' + k + ': ' + p)); }
  const failed = Object.values(problems).reduce((a, l) => a + l.length, 0);
  console.log(`RESULTS ${failed} failed of ${routes.length}`);
})();
