<!doctype html><title>review mistakes</title><body style="margin:0"><script>
/* Seeds a wrong answer in each of the four sources, then drives a real review: the questions must be
   rebuilt exactly, a right answer must clear one for good, and a wrong one must leave it on the list. */
const R=[]; const ok=(n,c,detail)=>{const l=(c?'PASS ':'FAIL ')+n+(c||!detail?'':' :: '+detail); R.push(l); console.log(l);};
const tick=()=>new Promise(r=>{const fr=new FileReader(); fr.onloadend=r; fr.readAsText(new Blob(['x']));});
const waitFor=async(cond,n)=>{for(let i=0;i<(n||400);i++){ if(cond()) return true; await tick(); } return cond();};

const KEYS=['ph.quiz.v1','ph.math.v1','ph.python.v1','ph.ai.v1','ph.review.v1'];
const snap={}; KEYS.forEach(k=>{ snap[k]=localStorage.getItem(k); });
const iso=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10);};
const T=iso(new Date());
const D=n=>{const d=new Date(T+'T00:00:00'); d.setDate(d.getDate()-n); return iso(d);};

function seed() {
  localStorage.setItem('ph.quiz.v1', JSON.stringify({ version:1, settings:{}, summary:{}, attempts:[
    {id:'q1',date:D(9),ts:Date.now(),lesson:'1.1.1',right:8,total:10,kind:'full',seconds:200,seed:1,missed:[0,2]}] }));
  localStorage.setItem('ph.math.v1', JSON.stringify({ version:1, settings:{}, summary:{}, history:[
    {id:'m1',date:D(7),topics:['linear'],count:8,difficulty:2,seed:31,name:'P',score:{right:6,total:8},missed:[1,4]}] }));
  localStorage.setItem('ph.python.v1', JSON.stringify({ version:1, settings:{}, summary:{}, rounds:[
    {id:'r1',date:D(5),right:3,total:6,seed:77,topics:['loops'],difficulty:2,kind:'full',missed:[0]},
    {id:'r2',date:D(4),right:0,total:2,seed:0,topics:['loops'],difficulty:2,kind:'retry',missed:[0,1]}] }));
  localStorage.setItem('ph.ai.v1', JSON.stringify({ version:1, settings:{}, summary:{}, sets:[
    {id:'s1',date:D(3),kind:'worksheet',title:'Grade 7 ratios',source:'',summary:'',by:'',score:{right:1,total:3},missed:[1],
     problems:[{question:'2+2',answer:'4',work:'',topic:'ratios',choices:[]},
               {question:'What is 20% of 60?',answer:'12',work:'20% is a fifth.',topic:'percents',choices:[]},
               {question:'Pick the even one',answer:'8',work:'',topic:'number',choices:['3','8','5','7']}]}] }));
  localStorage.removeItem('ph.review.v1');
}
seed();

const f=document.createElement('iframe'); f.style.cssText='width:1280px;height:1400px;border:0'; document.body.appendChild(f);
let phase=0;
f.src='../review.html';
f.addEventListener('load', async () => {
  if (phase === 1) return afterReload();
  const w=f.contentWindow, d=f.contentDocument, $=s=>d.querySelector(s), $$=s=>Array.from(d.querySelectorAll(s));
  const txt = s => ($(s) ? $(s).textContent : '');
  try {
    await waitFor(() => w.PH_REVIEW && $('#stats').children.length, 300);
    ok('the page exposes what it found', !!w.PH_REVIEW);

    /* ---- what it collected ---- */
    const open = w.PH_REVIEW.open();
    ok('it finds every source', open.length === 6, open.length + ' open: ' + open.map(o => o.src).join(','));
    const bySrc = {}; open.forEach(o => bySrc[o.src] = (bySrc[o.src] || 0) + 1);
    ok('two from the quiz', bySrc.quiz === 2, String(bySrc.quiz));
    ok('two from the worksheet', bySrc.math === 2, String(bySrc.math));
    ok('one from Python', bySrc.python === 1, String(bySrc.python));
    ok('a retry round is skipped, since it cannot be rebuilt', bySrc.python === 1);
    ok('one from a practice set', bySrc.ai === 1, String(bySrc.ai));
    ok('the oldest is first', open[0].date === D(9) && open[open.length-1].date === D(3), open.map(o => o.date).join(' '));
    ok('the counts show on the source buttons', $$('#srcs .src .ct').map(e => e.textContent).join(',') === '2,2,1,1',
      $$('#srcs .src .ct').map(e => e.textContent).join(','));
    ok('the headline counts them', /6/.test($$('#stats .num')[0].textContent), $$('#stats .num')[0].textContent);
    ok('it names what keeps coming back', /keeps coming back/.test(txt('#stats')), txt('#stats').slice(0, 80));
    ok('the open list names the sources', /Lesson quizzes/.test(txt('#listBody')) && /Make Practice/.test(txt('#listBody')));
    /* the generators arrive a moment after first paint, and then each row names its own question
       instead of repeating the source over and over */
    await waitFor(() => /20% of 60/.test(txt('#listBody')), 600);
    ok('each row names its own question', /20% of 60/.test(txt('#listBody')), txt('#listBody').slice(0, 120));
    const rows = $$('#listBody .open li .what').map(e => e.textContent.trim());
    ok('and the rows are not all the same', new Set(rows).size >= 5, rows.join(' | ').slice(0, 120));

    /* ---- starting a review loads each generator on demand ---- */
    $('#howMany').value = '20'; $('#howMany').dispatchEvent(new w.Event('change', { bubbles: true }));
    $('#startBtn').click();
    await waitFor(() => !$('#askCard').hidden && !!txt('#qpos'), 600);

    /* ---- rebuilding: now that the generators are loaded, every one must come back ---- */
    const built = [];
    open.forEach(o => { const it = w.PH_REVIEW.build(o); if (it) built.push({ o, it }); });
    ok('every missed question can be rebuilt', built.length === 6, built.length + ' of ' + open.length);
    ok('each one carries a question and an answer', built.every(b => b.it.qtext && b.it.answerText),
      built.filter(b => !(b.it.qtext && b.it.answerText)).map(b => b.o.key).join(' '));
    ok('rebuilding twice gives the same question', built.every(b => w.PH_REVIEW.build(b.o).qtext === b.it.qtext));
    const py = built.filter(b => b.o.src === 'python')[0];
    ok('a Python question brings its code', !!py && !!py.it.code, py ? py.it.code.slice(0, 20) : 'missing');
    const aiQ = built.filter(b => b.o.src === 'ai')[0];
    ok('the practice-set question is the one that was missed', !!aiQ && /20% of 60/.test(aiQ.it.qtext), aiQ ? aiQ.it.qtext : 'missing');

    ok('a review starts', !$('#askCard').hidden && /1 of 6/.test(txt('#qpos')), txt('#qpos'));
    ok('it says where the question came from', !!txt('#qfrom').trim(), txt('#qfrom'));

    const answerNow = (right) => {
      const r = w.PH_REVIEW.run(), it = r.items[r.i].item;
      if (it.choices) {
        const want = it.choices.indexOf(it.answerText);
        const pick = right ? want : (want + 1) % it.choices.length;
        $$('#qanswer .choice')[pick].click();
      } else {
        $('#typedIn').value = right ? it.answerText : 'definitely-not-it';
      }
      return r.items[r.i].desc.key;
    };
    const firstKey = answerNow(true);
    $('#checkBtn').click(); await tick();
    ok('a right answer is marked right', /Right/.test(txt('#qverdict')), txt('#qverdict').slice(0, 40));
    ok('and is recorded as put right', w.PH_REVIEW.state().cleared[firstKey] === T);
    $('#nextBtn').click(); await tick();
    ok('it moves on', /2 of 6/.test(txt('#qpos')), txt('#qpos'));

    const secondKey = answerNow(false);
    $('#checkBtn').click(); await tick();
    ok('a wrong answer is marked wrong', /Not yet/.test(txt('#qverdict')), txt('#qverdict').slice(0, 40));
    ok('and the real answer is shown', /The answer is/.test(txt('#qverdict')));
    ok('it is not recorded as put right', !w.PH_REVIEW.state().cleared[secondKey]);

    /* ---- stop, and see the list shrink by exactly one ---- */
    $('#stopBtn').click(); await tick();
    ok('stopping goes back to the picker', $('#askCard').hidden && !$('#pickCard').hidden);
    ok('the cleared one is gone from the list', w.PH_REVIEW.open().length === 5, String(w.PH_REVIEW.open().length));
    ok('the missed one is still there', w.PH_REVIEW.open().some(o => o.key === secondKey));
    ok('the hub summary says what is left', /5 questions to go over/.test((JSON.parse(localStorage.getItem('ph.review.v1')) || {}).summary.headline || ''),
      ((JSON.parse(localStorage.getItem('ph.review.v1')) || {}).summary || {}).headline);

    /* ---- leaving a source out ---- */
    const srcBtn = k => $$('#srcs .src').filter(b => b.getAttribute('data-src') === k)[0];
    srcBtn('math').click(); await tick();
    ok('a source can be switched off', !/Math worksheets/.test(txt('#listBody')), txt('#listBody').slice(0, 60));
    srcBtn('math').click(); await tick();          // the buttons are redrawn, so ask for it again
    ok('and back on', /Math worksheets/.test(txt('#listBody')));

    /* ---- clearing, then missing it again ---- */
    const qs = JSON.parse(localStorage.getItem('ph.quiz.v1'));
    qs.attempts.push({ id:'q2', date:T, ts:Date.now(), lesson:'1.1.1', right:9, total:10, kind:'full', seconds:100, seed:2, missed:[0,2] });
    localStorage.setItem('ph.quiz.v1', JSON.stringify(qs));
    w.PH_REVIEW.refresh(); await tick();
    ok('getting it right then missing it again the same day leaves it cleared',
      w.PH_REVIEW.open().length === 5, String(w.PH_REVIEW.open().length));
    /* the next time it is missed, it is open again: the miss is newer than the day it was cleared */
    w.PH_REVIEW.state().cleared[firstKey] = D(1);
    w.PH_REVIEW.refresh(); await tick();
    ok('missing it after the day it was cleared puts it back', w.PH_REVIEW.open().length === 6, String(w.PH_REVIEW.open().length));
    ok('and it is dated by the newer miss', w.PH_REVIEW.open().some(o => o.key === firstKey && o.date === T));
  } catch (e) { ok('suite ran without throwing', false, e.message); }

  /* ---- nothing missed at all ---- */
  phase = 1;
  KEYS.forEach(k => localStorage.removeItem(k));
  f.src = '../review.html?empty=1';
});

async function afterReload() {
  const w=f.contentWindow, d=f.contentDocument;
  try {
    await waitFor(() => w.PH_REVIEW && d.querySelector('#stats').children.length, 300);
    ok('an empty history does not throw', w.PH_REVIEW.open().length === 0);
    ok('it says there is nothing to do', /Nothing outstanding/.test(d.querySelector('#listBody').textContent));
    ok('and the start button says so', d.querySelector('#startBtn').disabled
      && /Nothing to review/.test(d.querySelector('#startBtn').textContent));
  } catch (e) { ok('the empty case ran without throwing', false, e.message); }
  KEYS.forEach(k => { if (snap[k] == null) localStorage.removeItem(k); else localStorage.setItem(k, snap[k]); });
  console.log('RESULTS ' + R.filter(l => l.indexOf('FAIL') === 0).length + ' failed of ' + R.length);
}
</script></body>
