<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Procademy test suite</title>
<link rel="stylesheet" href="../app.css">
</head>
<body>
<header class="top"><div class="bar">
  <a class="brand" href="#/"><span class="logo">✦</span><span class="word" data-brand>Procademy</span></a>
  <nav class="nav"><a href="#/courses" data-nav="courses">Courses</a><a href="#/cpm" data-nav="cpm">CPM</a><a href="#/progress" data-nav="progress">Progress</a></nav>
  <div class="search"><form id="search-form"><input id="search-input" type="search"></form></div>
  <div class="stats" id="stats"></div>
</div></header>
<main id="main"></main>
<div id="root" style="padding:16px"></div>
<script src="../lib/rng.js"></script>
<script src="../lib/math.js"></script>
<script src="../lib/content.js"></script>
<script src="../lib/store.js"></script>
<script src="../lib/engine.js"></script>
<script src="../content/k.js"></script>
<script src="../content/g1.js"></script>
<script src="../content/g2.js"></script>
<script src="../content/g3.js"></script>
<script src="../content/g4.js"></script>
<script src="../content/g5.js"></script>
<script src="../content/g6.js"></script>
<script src="../content/math7.js"></script>
<script src="../content/math8.js"></script>
<script src="../content/alg1.js"></script>
<script src="../content/geo.js"></script>
<script src="../content/alg2.js"></script>
<script src="../content/precalc.js"></script>
<script src="../content/int1.js"></script>
<script src="../content/int2.js"></script>
<script src="../content/int3.js"></script>
<script src="../cpm/cc1.js"></script>
<script src="../cpm/cc2.js"></script>
<script src="../cpm/cc3.js"></script>
<script src="../cpm/int1.js"></script>
<script src="../cpm/int2.js"></script>
<script src="../cpm/int3.js"></script>
<script src="../lib/tutor.js"></script>
<script src="../lib/tutor-ui.js"></script>
<script src="../lib/views.js"></script>
<script src="../lib/cpm-views.js"></script>
<script>STORE.useMemory(true); /* the suite never touches real data */</script>
<script src="../lib/app.js"></script>
<script>
(async function () {
  let pass = 0, fail = 0;
  const ok = (cond, msg) => { if (cond) { pass++; console.log('PASS ' + msg); } else { fail++; console.log('FAIL ' + msg); } };
  const tick = (ms) => new Promise(r => setTimeout(r, ms || 0));
  const A = ACADEMY, E = ENGINE, S = STORE, V = VIEWS;
  const root = document.getElementById('root');
  const text = el => (el ? el.innerText || el.textContent : '').replace(/\s+/g, ' ').trim();
  const skillIds = Object.keys(A.skills).filter(id => A.whereIs(id));
  ok(A.courses.length >= 1 && skillIds.length >= 10, `content loaded: ${A.courses.length} courses, ${skillIds.length} skills`);

  /* ---- parsing and checking ---- */
  const P = A.parseNumber;
  ok(P('12') === 12 && P('-3') === -3 && P('−3') === -3 && P(' 4.50 ') === 4.5, 'parseNumber: integers, minus signs, decimals');
  ok(P('3/4') === 0.75 && P('-1/2') === -0.5 && P('1 1/2') === 1.5 && P('-2 1/4') === -2.25, 'parseNumber: fractions and mixed numbers');
  ok(P('75%') === 75 && P('$1,250.50') === 1250.5 && P('45°') === 45, 'parseNumber: %, $, commas and degrees are stripped');
  ok(isNaN(P('abc')) && isNaN(P('')) && isNaN(P('1/0')) && isNaN(P('3 4')), 'parseNumber: nonsense is NaN');
  ok(A.normText('¿Cómo estás?') === 'como estas' && A.normText('  Él   HABLA. ') === 'el habla', 'normText: case, accents, punctuation, spacing');
  const qn = { type: 'number', answer: 0.75 };
  ok(A.check(qn, '3/4').correct && A.check(qn, '0.75').correct && !A.check(qn, '0.7').correct && A.check(qn, 'x').unreadable, 'check: number answers accept equivalent forms');
  ok(A.check({ type: 'number', answer: 31.4, tolerance: 0.05 }, '31.42').correct && !A.check({ type: 'number', answer: 31.4, tolerance: 0.05 }, '31.5').correct, 'check: tolerance');
  const qt = { type: 'text', answer: 'hablamos', accept: ['nosotros hablamos'] };
  ok(A.check(qt, 'Hablamos').correct && A.check(qt, 'nosotros hablamos').correct && !A.check(qt, 'hablan').correct && !A.check(qt, '').correct, 'check: text answers, alternates, empty');
  const qc = A.question('math7.proportional-table', 'x');
  ok(A.check(qc, qc.answerIndex).correct && A.check(qc, qc.answer).correct && !A.check(qc, (qc.answerIndex + 1) % qc.choices.length).correct, 'check: choice by index or by text');
  ok(A.fixAngles('<i>x</i> < 4 and y > 2') === '<i>x</i> &lt; 4 and y &gt; 2', 'fixAngles: loose inequality signs become entities, tags survive');

  /* ---- determinism and seeds ---- */
  const q1 = A.question('math7.add-negatives', 'seed-1'), q2 = A.question('math7.add-negatives', 'seed-1'), q3 = A.question('math7.add-negatives', 'seed-2');
  ok(JSON.stringify(q1) === JSON.stringify(q2) && q1.prompt !== q3.prompt, 'questions are deterministic from (skill, seed)');

  /* ---- mastery rules ---- */
  S.reset();
  const sid = 'math7.add-negatives';
  const wrongFor = q => q.type === 'number' ? q.answer + 1 : q.type === 'choice' ? (q.answerIndex + 1) % q.choices.length : 'zzz';
  const drive = (s, plan) => { s.items.forEach((it, k) => { const r = plan(it, k); if (r === 'hint') { E.useHint(s); E.answer(s, it.q.answer); } else if (r === 'wrong') { const w = E.answer(s, wrongFor(it.q)); if (w.correct || w.unreadable) console.log('FAIL drive: wrong answer was ' + JSON.stringify(w)); E.answer(s, it.q.type === 'choice' ? it.q.answerIndex : it.q.answer); } else if (r === 'skip') { E.reveal(s); } else E.answer(s, it.q.type === 'choice' ? it.q.answerIndex : it.q.answer); E.next(s); }); return E.finish(s); };
  let s = E.start('practice', { skillId: sid, seed: 't1' });
  ok(s.items.length === E.PRACTICE_N && new Set(s.items.map(i => i.q.prompt)).size === s.items.length, 'practice set has 7 distinct questions');
  let f = drive(s, () => 'right');
  ok(f.right === 7 && S.skill(sid).level === 3 && f.changes.length === 1 && f.changes[0].to === 3, 'practice: 7/7 first try → Proficient');
  ok(S.get().points === f.pts && f.pts === 7 * E.POINTS.correct + E.POINTS.set + E.POINTS.levelUp[3], 'practice: points = answers + set bonus + level-up bonus');
  S.reset();
  f = drive(E.start('practice', { skillId: sid, seed: 't2' }), (it, k) => k < 5 ? 'right' : 'wrong');
  ok(f.right === 5 && S.skill(sid).level === 2, 'practice: 5/7 (retries do not count) → Familiar');
  S.reset();
  f = drive(E.start('practice', { skillId: sid, seed: 't3' }), (it, k) => k < 2 ? 'right' : 'hint');
  ok(f.right === 2 && S.skill(sid).level === 1 && S.get().missed.length === 5, 'practice: hinted answers do not count; misses are saved for review');
  f = drive(E.start('practice', { skillId: sid, seed: 't4' }), () => 'right');
  ok(S.skill(sid).level === 3, 'practice: a perfect set later lifts Attempted to Proficient');
  f = drive(E.start('practice', { skillId: sid, seed: 't5' }), () => 'skip');
  ok(S.skill(sid).level === 3, 'practice never lowers a level');
  // unit test
  S.reset();
  S.setSkill('math7.abs-distance', { level: 4 });
  S.setSkill('math7.sub-negatives', { level: 3 });
  s = E.start('unit-test', { courseId: 'math-7', unitId: 'negatives-add', seed: 'u1' });
  ok(s.items.length === 3 && !s.hints && new Set(s.items.map(i => i.skillId)).size === 3, 'unit test: one question per skill, no hints');
  f = drive(s, it => it.skillId === 'math7.abs-distance' ? 'wrong' : 'right');
  ok(S.skill('math7.abs-distance').level === 3 && S.skill('math7.sub-negatives').level === 4 && S.skill('math7.add-negatives').level === 2, 'unit test: wrong → down one, right → up one, first right → Familiar');
  f = drive(E.start('unit-test', { courseId: 'math-7', unitId: 'negatives-add', seed: 'u2' }), () => 'wrong');
  ok(S.skill('math7.add-negatives').level === 1 && S.skill('math7.abs-distance').level === 2, 'unit test: misses step down, never below Attempted');
  f = drive(E.start('unit-test', { courseId: 'math-7', unitId: 'negatives-add', seed: 'u3' }), () => 'wrong');
  ok(S.skill('math7.add-negatives').level === 1, 'unit test: Attempted stays Attempted');
  // course and mastery challenge
  S.reset();
  s = E.start('course-challenge', { courseId: 'math-7', seed: 'c1' });
  const c7 = A.courseById('math-7'), n7 = A.courseSkills(c7).length;
  ok(s.items.length === Math.min(E.CHALLENGE_N, n7) && new Set(s.items.map(i => i.skillId)).size === s.items.length, 'course challenge: distinct skills from across the course');
  const unitsHit = new Set(s.items.map(i => A.whereIs(i.skillId).unit.id));
  ok(unitsHit.size === c7.units.length, 'course challenge: every unit is represented');
  let threw = false; try { E.start('mastery-challenge', { courseId: 'math-7', seed: 'm0' }); } catch (e) { threw = true; }
  ok(threw && E.masteryPool(c7).length === 0, 'mastery challenge: unavailable until something is Familiar or Proficient');
  ['math7.add-negatives', 'math7.sub-negatives'].forEach(id => S.setSkill(id, { level: 3 }));
  S.setSkill('math7.abs-distance', { level: 2 });
  S.setSkill('math7.circles', { level: 4 });
  s = E.start('mastery-challenge', { courseId: 'math-7', seed: 'm1' });
  ok(s.items.length === 3 && s.items.every(i => [2, 3].includes(S.skill(i.skillId).level)), 'mastery challenge: draws only Familiar and Proficient skills');
  f = drive(s, () => 'right');
  ok(S.skill('math7.add-negatives').level === 4 && S.skill('math7.abs-distance').level === 3, 'mastery challenge: right answers level up, Proficient → Mastered');
  // review
  S.reset();
  drive(E.start('practice', { skillId: sid, seed: 'r1' }), (it, k) => k < 4 ? 'right' : 'skip');
  ok(S.get().missed.length === 3, 'missed questions are collected');
  const missedBefore = S.get().missed.slice();
  s = E.start('review', { seed: 'r2' });
  ok(s.items.length === 3 && s.items.every((it, k) => it.seed === missedBefore[k].seed) && s.hints, 'review rebuilds the exact missed questions, with hints');
  f = drive(s, (it, k) => k === 0 ? 'right' : 'skip');
  ok(S.get().missed.length === 2 && S.skill(sid).level === 1, 'review: a right answer clears the question; levels do not change');
  // streak
  S.reset();
  const t = S.today();
  S.get().days[S.dayShift(t, -2)] = { q: 3, right: 2, pts: 10 }; S.get().days[S.dayShift(t, -1)] = { q: 1, right: 1, pts: 5 };
  ok(S.streak().days === 2 && !S.streak().today, 'streak: yesterday and the day before count, today still open');
  S.countAnswer(true);
  ok(S.streak().days === 3 && S.streak().today, 'streak: practising today extends it');
  S.get().days[S.dayShift(t, -1)] = { q: 0, right: 0, pts: 0 };
  ok(S.streak().days === 1, 'streak: a gap resets it');
  // export / import
  S.reset(); S.addPoints(123); S.setSkill(sid, { level: 2 }); S.setProfile({ name: 'Test' });
  const json = S.exportJSON();
  S.reset();
  ok(S.get().points === 0, 'reset clears points');
  S.importJSON(json);
  ok(S.get().points === 123 && S.skill(sid).level === 2 && S.get().profile.name === 'Test', 'export → import round-trips points, levels and profile');
  threw = false; try { S.importJSON('{"nope":1}'); } catch (e) { threw = true; }
  ok(threw && S.get().points === 123, 'import rejects a foreign file and keeps the data');

  /* ---- views render for every route ---- */
  S.reset();
  const go = async (hash) => { location.hash = hash; await tick(40); return document.getElementById('main'); };
  for (const h of ['#/', '#/courses', '#/progress', '#/settings', '#/search/fraction', '#/review', '#/nowhere']) {
    const m = await go(h);
    ok(text(m).length > 20, `route ${h} renders (${document.title})`);
  }
  for (const c of A.courses) {
    const m = await go('#/course/' + c.id);
    ok(m.querySelectorAll('.unit-card').length === c.units.length && text(m).includes(c.title), `course page ${c.id}: ${c.units.length} units`);
    const u = c.units[0];
    const mu = await go(`#/unit/${c.id}/${u.id}`);
    ok(mu.querySelectorAll('.skills li').length === u.skills.length + 1, `unit page ${c.id}/${u.id}: ${u.skills.length} skills + test`);
  }
  ok(document.title.includes('Procademy'), 'document title carries the brand');
  // every skill: learn article and a practice question render
  let bad = 0;
  for (const id of skillIds) {
    V.skill(root, id);
    const learn = text(root.querySelector('.learn'));
    V.practice(root, id);
    const qtext = text(root.querySelector('.question'));
    const hasAnswer = root.querySelector('#ans') || root.querySelector('#choices button');
    if (learn.length < 100 || qtext.length < 3 || !hasAnswer) { bad++; console.log('FAIL skill renders: ' + id + ` learn=${learn.length} q=${qtext.length} answer=${!!hasAnswer}`); }
  }
  ok(bad === 0, `all ${skillIds.length} skills render a learn article and a practice question`);
  // no stray entity text or raw tags visible anywhere in a batch of questions
  let stray = 0;
  for (const id of skillIds) for (const sd of ['v1', 'v2']) { const q = A.question(id, sd); const el = document.createElement('div'); el.innerHTML = q.prompt + q.hints.join('') + (q.choices || []).join(''); const tx = el.textContent; if (/&lt;|&gt;|&amp;|<\/?\w+>|undefined|NaN/.test(tx)) { stray++; if (stray < 6) console.log('FAIL stray markup in ' + id + ' ' + sd + ': ' + tx.slice(0, 120)); } }
  ok(stray === 0, 'no raw tags or entities leak into visible text');

  /* ---- the exercise player, driven like a learner ---- */
  S.reset();
  const answerCurrent = (rootEl, correct) => {
    const sess = rootEl.__session; const q = sess.items[sess.i].q;
    if (q.type === 'choice') { const k = correct ? q.answerIndex : (q.answerIndex + 1) % q.choices.length; rootEl.querySelector(`#choices button[data-k="${k}"]`).click(); }
    else { const inp = rootEl.querySelector('#ans'); inp.value = correct ? String(q.answer) : String(wrongFor(q)); inp.dispatchEvent(new Event('input', { bubbles: true })); }
    rootEl.querySelector('#check').click();
  };
  V.practice(root, 'math7.percent-of');
  ok(root.__session && root.__session.kind === 'practice' && root.querySelectorAll('.dots span').length === 7, 'player: practice shows 7 progress dots');
  for (let i = 0; i < 7; i++) {
    answerCurrent(root, true); await tick();
    if (i === 0) ok(root.querySelector('.feedback.good') && root.querySelector('#next') && !root.querySelector('#check'), 'player: a right answer shows green feedback and Next');
    root.querySelector('#next').click(); await tick();
  }
  ok(text(root.querySelector('.summary .score')) === '7 / 7' && S.skill('math7.percent-of').level === 3 && text(root).includes('Proficient'), 'player: summary shows 7 / 7 and the level-up');
  ok(text(document.getElementById('stats')).includes('⚡'), 'player: the header stats refresh after a set');
  // wrong, retry, hints, give up
  V.practice(root, 'math7.unit-rate');
  answerCurrent(root, false); await tick();
  ok(root.querySelector('.feedback.bad') && root.querySelector('#check') && root.querySelector('#ans') && !root.querySelector('#next'), 'player: a wrong answer in practice allows a retry');
  answerCurrent(root, true); await tick();
  ok(root.querySelector('.feedback.good') && root.querySelector('#next') && !E.counts(root.__session.results[0]), 'player: right on the second try, but it does not count');
  root.querySelector('#next').click(); await tick();
  const hq = root.__session.items[1].q;
  for (let k = 0; k < hq.hints.length; k++) { root.querySelector('#hint').click(); await tick(); }
  ok(root.querySelectorAll('.hints .hint').length >= hq.hints.length && root.querySelector('#next') && root.querySelector('#hint').disabled, 'player: the last hint reveals the question and offers Next');
  root.querySelector('#next').click(); await tick();
  root.querySelector('#giveup').click(); await tick();
  ok(root.querySelector('.feedback.note') && text(root.querySelector('.feedback.note')).includes(String(A.answerText(root.__session.items[2].q)).trim().split(' ')[0]) && root.querySelector('#next'), 'player: "I don’t know" shows the answer and moves on');
  // unreadable input
  root.querySelector('#next').click(); await tick();
  const inp = root.querySelector('#ans'); inp.value = 'seven'; inp.dispatchEvent(new Event('input', { bubbles: true })); root.querySelector('#check').click(); await tick();
  ok(root.querySelector('.feedback.note') && root.__session.results[3].tries === 0, 'player: an unreadable number is not counted as an attempt');
  // a test: no hints, one attempt
  V.unitTest(root, 'math-7', 'negatives-add');
  ok(!root.querySelector('#hint') && root.querySelectorAll('.dots span').length === 3, 'player: unit test has no hint button');
  answerCurrent(root, false); await tick();
  ok(root.querySelector('.feedback.bad') && root.querySelector('#next') && !root.querySelector('#check') && root.querySelector('details'), 'player: in a test a wrong answer reveals the answer and the steps');
  for (let i = 0; i < 3; i++) { root.querySelector('#next').click(); await tick(); if (i < 2) { answerCurrent(root, true); await tick(); } }
  ok(root.querySelector('.summary') && text(root.querySelector('.summary .score')) === '2 / 3', 'player: unit test summary 2 / 3');
  // keyboard: Enter checks and advances
  V.practice(root, 'math7.add-negatives');
  { const sess = root.__session, q = sess.items[0].q; const el = root.querySelector('#ans'); el.value = String(q.answer); el.dispatchEvent(new Event('input', { bubbles: true })); el.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true })); await tick(); }
  ok(root.querySelector('.feedback.good'), 'player: Enter checks the answer');
  root.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true })); await tick();
  ok(root.__session.i === 1, 'player: Enter again moves to the next question');

  /* ---- settings ---- */
  await go('#/settings');
  const main = document.getElementById('main');
  const nameEl = main.querySelector('#name'); nameEl.value = 'Sam'; nameEl.dispatchEvent(new Event('input', { bubbles: true }));
  ok(S.get().profile.name === 'Sam' && document.querySelector('[data-brand]').textContent === 'Procademy', 'settings: the name is saved; the brand stays Procademy');
  const themeEl = main.querySelector('#theme'); themeEl.value = 'dark'; themeEl.dispatchEvent(new Event('change', { bubbles: true }));
  ok(document.documentElement.getAttribute('data-theme') === 'dark', 'settings: theme applies to <html>');
  themeEl.value = 'system'; themeEl.dispatchEvent(new Event('change', { bubbles: true }));
  ok(!document.documentElement.hasAttribute('data-theme'), 'settings: system theme removes the attribute');
  await go('#/');
  ok(text(main).includes('Sam'), 'home greets by name');
  await go('#/search/negative');
  ok(text(main).includes('Adding negative numbers'), 'search finds skills by title');
  // course enrol button
  await go('#/course/math-7');
  main.querySelector('#enroll').click(); await tick();
  ok(S.get().profile.enrolled.includes('math-7') && text(main.querySelector('#enroll')).includes('On my home page'), 'course: add to home page toggles enrolment');

  /* ---- CPM pages (a small fixture book, so the suite does not depend on the real data) ---- */
  S.reset();
  A.cpmBook({ id: 'zz', title: 'Test Book', short: 'Test', band: 'Middle school', grade: 7, icon: '📗', hue: 100, homework: 'https://homework.cpm.org/category/CC/textbook/zz',
    chapters: [{ n: 1, title: 'Integers', lessons: [
      { id: '1.1.1', title: 'Adding Integers', topic: 'Adding positive and negative numbers on a number line.', skills: ['math7.add-negatives', 'math7.sub-negatives'] },
      { id: '1.1.2', title: null, topic: 'Distance between numbers using absolute value.', skills: ['math7.abs-distance', 'no.such-skill'] },
      { id: '1.2.1', title: 'Investigating Shapes', topic: 'An investigation with no Procademy practice yet.', skills: [] }] },
      { n: 2, title: 'Circles', lessons: [{ id: '2.1.1', title: 'Circle Measures', topic: 'Area and circumference of circles using 3.14.', skills: ['math7.circles'] }] }] });
  let m = await go('#/cpm');
  ok(text(m).includes('Test Book') && m.querySelector('.course-card'), 'cpm: the books page lists a book');
  const find = m.querySelector('#cpm-find'); find.value = 'circumference'; find.dispatchEvent(new Event('input'));
  ok([...m.querySelectorAll('#cpm-results li[data-lesson]')].some(li => text(li).includes('Circle Measures')) && m.querySelector('#cpm-books').hidden, 'cpm: searching across books finds the lesson by topic');
  m = await go('#/cpm/zz');
  ok(m.querySelectorAll('details.chapter').length === 2 && m.querySelectorAll('li[data-lesson]').length === 4, 'cpm: a book shows its chapters and lessons');
  ok(text(m.querySelector('li[data-lesson="1.1.2"]')).includes('Lesson 1.1.2') && m.querySelector('li[data-lesson="1.1.2"] .cpm-levels').children.length === 1, 'cpm: an untitled lesson shows its number; unknown skills are ignored');
  ok(!m.querySelector('li[data-lesson="1.2.1"] a.btn.primary') && m.querySelector('li[data-lesson="1.2.1"] .tutor-ask'), 'cpm: a lesson without practice still offers the tutor');
  ok(m.querySelector('li[data-lesson="1.1.1"] a[href="https://homework.cpm.org/category/CC/textbook/zz/chapter/1/lesson/1.1.1"]'), 'cpm: each lesson links to its CPM homework help');
  m.querySelector('#only-practice').checked = true; m.querySelector('#only-practice').dispatchEvent(new Event('change'));
  ok(m.querySelector('li[data-lesson="1.2.1"]').hidden && !m.querySelector('li[data-lesson="1.1.1"]').hidden, 'cpm: "only lessons with practice" filters live');
  const lf = m.querySelector('#lesson-find'); lf.value = 'absolute'; lf.dispatchEvent(new Event('input'));
  ok(!m.querySelector('li[data-lesson="1.1.2"]').hidden && m.querySelector('li[data-lesson="1.1.1"]').hidden, 'cpm: the lesson filter matches topics');
  m = await go('#/cpm/zz/1.1.1');
  ok(text(m).includes('Adding Integers') && m.querySelectorAll('.skills li').length === 2, 'cpm: a lesson page lists its skills');
  m.querySelector('#in-class').click(); await tick();
  ok(S.get().profile.cpm && S.get().profile.cpm.lesson === '1.1.1' && text(m.querySelector('#in-class')).includes('In class now'), 'cpm: "I’m on this lesson" is saved');
  m = await go('#/');
  ok(text(m).includes('In class now') && text(m).includes('Adding Integers'), 'cpm: the home page shows the class lesson');
  m = await go('#/cpm/zz');
  ok(m.querySelector('li.here[data-lesson="1.1.1"]') && m.querySelector('#jump'), 'cpm: the book marks the class lesson and offers a jump to it');
  m = await go('#/cpm-practice/zz/1.1.1');
  ok(m.__session && m.__session.kind === 'mix' && m.__session.items.every(i => ['math7.add-negatives', 'math7.sub-negatives'].includes(i.skillId)) && m.__session.items.length === 7, 'cpm: lesson practice mixes only that lesson’s skills');
  for (let i = 0; i < 7; i++) { answerCurrent(m, true); await tick(); m.querySelector('#next').click(); await tick(); }
  ok(text(m.querySelector('.summary .score')) === '7 / 7' && S.skill('math7.add-negatives').level === 2 && S.skill('math7.sub-negatives').level === 2, 'cpm: a perfect lesson set lifts its skills to Familiar');
  ok(text(m).includes('Next: Lesson 1.1.2'), 'cpm: the summary offers the next lesson (got: ' + text(m.querySelector('.summary .btn-row')) + ')');
  m = await go('#/cpm-practice/zz/ch/2');
  ok(m.__session && m.__session.items.every(i => i.skillId === 'math7.circles'), 'cpm: chapter practice uses the chapter’s skills');
  location.hash = '#/cpm-practice/zz/1.2.1'; await tick(60);
  ok(location.hash === '#/cpm/zz/1.2.1', 'cpm: practising a lesson with no skills goes to the lesson page');
  m = await go('#/search/circumference');
  ok(text(m).includes('CPM lessons') && text(m).includes('Circle Measures'), 'search: finds CPM lessons too');
  m = await go('#/cpm/nope');
  ok(text(m).includes('Not here'), 'cpm: an unknown book is a friendly not-found');

  /* ---- the tutor: the free cloud tutor with a stand-in network, then the on-device path ---- */
  const TU = TUTOR, UI = TUTORUI;
  const sse = words => { const enc = new TextEncoder(); return new ReadableStream({ async start(ctrl) {
    for (const w of words) { await tick(2); ctrl.enqueue(enc.encode('data: ' + JSON.stringify({ choices: [{ delta: { content: w } }] }) + '\n\n')); }
    ctrl.enqueue(enc.encode('data: [DONE]\n\n')); ctrl.close(); } }); };
  const cloudCalls = [];
  // per-service behaviour for the next calls: a queue of { status, retry } (empty = answer normally)
  const plan = { llm7: [], pollinations: [] };
  const who = url => url.includes('llm7') ? 'llm7' : 'pollinations';
  TU.fetch = async (url, init) => {
    const svc = who(url);
    cloudCalls.push({ url, svc, body: JSON.parse(init.body), auth: (init.headers || {}).Authorization || '', t: performance.now() });
    const next = plan[svc].shift();
    if (next) return new Response(JSON.stringify({ error: { code: 'busy', retry_after: next.retry } }), { status: next.status, headers: Object.assign({ 'Content-Type': 'application/json' }, next.header === false ? {} : { 'Retry-After': String(next.retry || 1) }) });
    return new Response(sse(['**Step 1:** ', 'add <script>x<\/script> ', 'the \\frac{1}{2} ', 'numbers.\n- one\n- two']), { status: 200, headers: { 'Content-Type': 'text/event-stream' } });
  };
  const askAndWait = async (q, limit) => {
    const n = cloudCalls.length;
    panel.querySelector('#tutor-text').value = q; panel.querySelector('#tutor-form').dispatchEvent(new Event('submit', { cancelable: true }));
    await tick(30);
    for (let k = 0; k < (limit || 200) && TU.busy(); k++) await tick(25);
    return cloudCalls.slice(n);
  };
  S.setProfile({ tutor: null });
  await TU.unload();
  m = await go('#/skill/math7.circles');
  const ctx1 = UI.getContext();
  ok(ctx1 && ctx1.skill === 'Area and circumference of circles' && ctx1.notes.length > 50, 'tutor: a skill page tells the tutor what is on screen');
  m.querySelector('.tutor-ask').click();
  const panel = document.getElementById('tutor');
  for (let k = 0; k < 60 && !(UI.history().length === 2 && !TU.busy() && UI.history()[1].content); k++) await tick(20);
  ok(panel && !panel.hidden && TU.state === 'ready' && TU.isCloud(), 'tutor: it opens ready, on the free cloud tutor, with nothing to download');
  ok(!panel.querySelector('#tutor-start') && !/GB|MB/.test(text(panel.querySelector('#tutor-body'))), 'tutor: no setup step and no download size in the chat');
  const h = UI.history();
  ok(h.length === 2 && h[0].role === 'user' && /Area and circumference/.test(h[0].content), 'tutor: the "Explain it" question is sent straight away');
  const shown = panel.querySelector('.tmsg.assistant:last-child');
  ok(shown && shown.querySelector('b') && !shown.querySelector('script') && text(shown).includes('<script>') && text(shown).includes('(1)/(2)') && shown.querySelectorAll('li').length === 2, 'tutor: replies render a little markdown, escape HTML and tidy LaTeX');
  const req = cloudCalls[0];
  ok(req && req.url === TU.PROVIDERS[0].url && req.body.model === 'gpt-oss:20b' && req.body.stream === true && req.body.messages[0].role === 'system' && req.body.messages[0].content.includes('Lesson notes'), 'tutor: the first cloud request goes to LLM7, streams, and carries the lesson as context');
  ok(!JSON.stringify(req.body).includes('Sam') && !JSON.stringify(req.body).includes('points'), 'tutor: the request carries no name and no progress');
  ok(/LLM7/.test(text(panel.querySelector('#tutor-note'))) && /Pollinations/.test(text(panel.querySelector('#tutor-note'))), 'tutor: the panel says where cloud answers come from');
  const free = () => { Object.keys(TU._nextFree).forEach(k => delete TU._nextFree[k]); };
  // LLM7 busy for a moment while Pollinations is free: Pollinations answers at once
  free(); plan.llm7.push({ status: 429, retry: 1, header: false });
  let calls = await askAndWait('Show me another example');
  ok(calls.length === 2 && calls[0].svc === 'llm7' && calls[1].svc === 'pollinations' && calls[1].t - calls[0].t < 500 && TU.lastProvider === 'pollinations', 'tutor: when LLM7 is busy, Pollinations answers straight away');
  ok(!('reasoning_effort' in calls[0].body) && calls[1].body.reasoning_effort === 'low', 'tutor: each service gets only the settings it accepts (LLM7 rejects reasoning_effort)');
  // straight after, Pollinations is on its 30-second rest, so LLM7 is asked, not a 30-second wait
  calls = await askAndWait('And another');
  ok(calls.length === 1 && calls[0].svc === 'llm7', 'tutor: the next question goes to LLM7 while Pollinations rests');
  // LLM7 busy for two seconds while Pollinations rests: wait the two seconds for LLM7
  plan.llm7.push({ status: 429, retry: 2 });
  calls = await askAndWait('Two-second wait');
  ok(calls.length === 2 && calls.every(c => c.svc === 'llm7') && calls[1].t - calls[0].t >= 1800 && calls[1].t - calls[0].t < 4000, 'tutor: it waits for whichever service is free sooner (2 s, not 30 s)');
  // LLM7 wants a key: Pollinations answers (once free), and no error is shown
  free(); plan.llm7.push({ status: 401 });
  calls = await askAndWait('Once more');
  ok(calls.length === 2 && calls[1].svc === 'pollinations' && UI.history().slice(-1)[0].content.includes('Step 1'), 'tutor: if LLM7 starts asking for a key, Pollinations answers');
  // both busy: the panel counts down, shows Procademy's own step if there is one, then the reply comes
  free(); TU._nextFree.pollinations = Date.now() + 4000; plan.llm7.push({ status: 429, retry: 3 });
  const pending4 = askAndWait('Both busy');
  await tick(700);
  ok(/next reply in/.test(text(panel.querySelector('#tutor-status'))) || /coming in/.test(text(panel)), 'tutor: when every service is busy, the panel counts down');
  calls = await pending4;
  ok(calls.length === 2 && UI.history().slice(-1)[0].content.includes('Step 1'), 'tutor: after the countdown it sends again and the answer arrives');
  free();
  // a service that never answers: after the first-reply limit the other service answers
  TU.limits = { firstByte: 0.4, idle: 0.4 };
  const realFetch = TU.fetch;
  TU.fetch = (url, init) => who(url) === 'llm7'
    ? new Promise((res, rej) => { cloudCalls.push({ url, svc: 'llm7', body: JSON.parse(init.body), t: performance.now() }); init.signal.addEventListener('abort', () => rej(new DOMException('aborted', 'AbortError'))); })
    : realFetch(url, init);
  calls = await askAndWait('Hanging service');
  ok(calls.length === 2 && calls[0].svc === 'llm7' && calls[1].svc === 'pollinations' && calls[1].t - calls[0].t < 1500 && UI.history().slice(-1)[0].content.includes('Step 1'), 'tutor: a service that never answers is given up on, and the other answers');
  // a stream that starts and then goes quiet: what arrived is kept, and the tutor is not stuck
  free();
  TU.fetch = async (url, init) => { cloudCalls.push({ url, svc: who(url), body: JSON.parse(init.body), t: performance.now() });
    const enc = new TextEncoder();
    return new Response(new ReadableStream({ start(c) { c.enqueue(enc.encode('data: ' + JSON.stringify({ choices: [{ delta: { content: 'Partial answer.' } }] }) + '\n\n')); init.signal.addEventListener('abort', () => c.error(new DOMException('aborted', 'AbortError'))); } }), { status: 200, headers: { 'Content-Type': 'text/event-stream' } }); };
  calls = await askAndWait('Quiet stream');
  ok(!TU.busy() && UI.history().slice(-1)[0].content === 'Partial answer.', 'tutor: a stream that goes quiet ends with what arrived');
  TU.fetch = realFetch; TU.limits = { firstByte: 25, idle: 30 }; free();
  UI.close();
  ok(panel.hidden, 'tutor: the panel closes');
  // grounding in a practice question: the answer stays hidden until the learner has answered
  m = await go('#/practice/math7.percent-of');
  const sess = m.__session, q0 = sess.items[0].q;
  let c = UI.getContext();
  ok(c.question && c.answerShown === false && c.steps.length === Math.min(1, q0.hints.length - 1), 'tutor: before answering, only the first step is shared');
  const leak = TU.guard('First subtract 5 from both sides. Then divide by 3 to get x = ' + c.answer + '. The answer is hidden: do not reveal it.', c);
  ok(!leak.includes('x = ' + c.answer) && !/hidden/i.test(leak) && leak.includes('subtract 5') && leak.includes('try the last step'), 'tutor: a reply that gives the hidden answer away is cut back to the hint');
  ok(TU.guard('The answer is x = 7.', Object.assign({}, c, { answerShown: true, answer: '7' })).includes('x = 7'), 'tutor: once answered, the reply may state the answer');
  const sys1 = TU.messages([{ role: 'user', content: 'hint?' }], c)[0].content;
  ok(sys1.includes('Do not reveal') && !sys1.includes('Correct answer'), 'tutor: the prompt tells the model the answer is hidden');
  // a wrong answer offers "Why is that wrong?", which sends the learner's answer
  answerCurrent(m, false); await tick();
  const why = m.querySelector('#feedback .tutor-ask');
  ok(why && /Why is that wrong/.test(text(why)) && UI.getContext().studentAnswer, 'tutor: a wrong answer offers "Why is that wrong?" with the learner’s answer in context');
  const n0 = cloudCalls.length; why.click();
  for (let k = 0; k < 60 && (TU.busy() || cloudCalls.length === n0); k++) await tick(20);
  const wrongReq = cloudCalls[cloudCalls.length - 1].body.messages;
  ok(cloudCalls.length === n0 + 1 && /The student answered/.test(wrongReq[0].content) && /Why is that wrong/.test(wrongReq[wrongReq.length - 1].content) && !wrongReq[0].content.includes('Correct answer'), 'tutor: it explains the mistake without being handed the answer');
  UI.close();
  answerCurrent(m, true); await tick();
  c = UI.getContext();
  ok(c.answerShown === true && c.steps.length === q0.hints.length && TU.messages([], c)[0].content.includes('Correct answer (checked): ' + c.answer), 'tutor: after answering, the checked answer and all steps are shared');
  ok(m.querySelector('#ask-tutor'), 'tutor: the exercise has an "Ask the tutor" button');
  m.querySelector('#next').click(); await tick();
  ok(UI.history().length === 0, 'tutor: moving to the next question clears the chat');
  // the on-device tutor is a choice in settings, with its download size, and is remembered
  const devCalls = [];
  TU.engineFactory = async (id, onProgress) => {
    onProgress({ text: 'Fetching', progress: 0.5 }); await tick(5);
    return { chat: { completions: { create: async (r) => { devCalls.push(r); return (async function* () { yield { choices: [{ delta: { content: 'On-device answer.' } }] }; })(); } } } };
  };
  UI.showSettings(); await tick();
  ok(panel.querySelectorAll('input[name="tutor-engine"]').length >= 4 && /about 350 MB/.test(text(panel)) && panel.querySelector('input[value="cloud"]').checked, 'tutor: settings offer the cloud tutor (chosen) and on-device models with sizes');
  ok(/under 13/.test(text(panel)), 'tutor: settings say what LLM7’s policy says about children');
  try { localStorage.removeItem('procademy.secret.v1'); } catch (e) {}
  panel.querySelector('#tutor-llm7-key').value = 'test-key-123'; panel.querySelector('#tutor-key-save').click(); await tick();
  ok(TU.cloud.tokens.llm7 === 'test-key-123' && !S.exportJSON().includes('test-key-123'), 'tutor: a pasted key is used, and never put in a backup');
  const llm7Box = panel.querySelector('.tutor-provider[value="llm7"]'); llm7Box.checked = false; llm7Box.dispatchEvent(new Event('change'));
  ok(TU.cloud.use.join() === 'pollinations', 'tutor: unticking LLM7 leaves only Pollinations');
  llm7Box.checked = true; llm7Box.dispatchEvent(new Event('change'));
  panel.querySelector('input[value="cloud"]').checked = true; panel.querySelector('#tutor-use').click(); await tick(30);
  free(); calls = await askAndWait('With a key');
  ok(calls.length === 1 && calls[0].svc === 'llm7' && calls[0].auth === 'Bearer test-key-123', 'tutor: the key is sent to LLM7 only');
  free(); plan.llm7.push({ status: 429, retry: 30 });
  calls = await askAndWait('Key not for Pollinations');
  ok(calls.length === 2 && calls[1].svc === 'pollinations' && calls[1].auth === '', 'tutor: the key is never sent to Pollinations');
  try { localStorage.removeItem('procademy.secret.v1'); } catch (e) {}
  UI.showSettings(); await tick();
  panel.querySelector('input[value="Qwen3-0.6B-q4f16_1-MLC"]').checked = true;
  panel.querySelector('#tutor-use').click();
  for (let k = 0; k < 50 && !(TU.state === 'ready' && !TU.isCloud()); k++) await tick(20);
  ok(TU.state === 'ready' && !TU.isCloud() && S.get().profile.tutor.engine === 'Qwen3-0.6B-q4f16_1-MLC', 'tutor: choosing a device model loads it and remembers the choice');
  panel.querySelector('#tutor-text').value = 'Explain'; panel.querySelector('#tutor-form').dispatchEvent(new Event('submit', { cancelable: true }));
  for (let k = 0; k < 50 && TU.busy(); k++) await tick(20); await tick(20);
  ok(devCalls.length === 1 && devCalls[0].extra_body.enable_thinking === false && UI.history().some(x => x.content === 'On-device answer.'), 'tutor: the device model answers, with thinking off');
  UI.close();
  await go('#/settings');
  ok(UI.getContext() === null || !UI.getContext().question, 'tutor: leaving the exercise clears the question context');
  TU.engineFactory = null; TU.fetch = (...a) => fetch(...a);
  await TU.unload(); S.setProfile({ tutor: null });

  console.log(`RESULTS ${fail} failed of ${pass + fail}`);
})().catch(e => { console.log('FAIL harness threw: ' + (e.stack || e.message)); console.log('RESULTS 1 failed of 1'); });
</script>
