<script>
(async function () {
  let pass = 0, fail = 0;
  const ok = (cond, msg) => { if (cond) { pass++; console.log('PASS ' + msg); } else { fail++; console.log('FAIL ' + msg); } };
  const tick = (ms) => new Promise(r => setTimeout(r, ms || 0));
  const A = ACADEMY, E = ENGINE, S = STORE, V = VIEWS;
  const root = document.getElementById('root');
  const text = el => (el ? el.innerText || el.textContent : '').replace(/\s+/g, ' ').trim();
  const skillIds = Object.keys(A.skills).filter(id => A.whereIs(id));
  ok(A.courses.length >= 1 && skillIds.length >= 10, `content loaded: ${A.courses.length} courses, ${skillIds.length} skills`);

  /* ---- parsing and checking ---- */
  const P = A.parseNumber;
  ok(P('12') === 12 && P('-3') === -3 && P('−3') === -3 && P(' 4.50 ') === 4.5, 'parseNumber: integers, minus signs, decimals');
  ok(P('3/4') === 0.75 && P('-1/2') === -0.5 && P('1 1/2') === 1.5 && P('-2 1/4') === -2.25, 'parseNumber: fractions and mixed numbers');
  ok(P('75%') === 75 && P('$1,250.50') === 1250.5 && P('45°') === 45, 'parseNumber: %, $, commas and degrees are stripped');
  ok(isNaN(P('abc')) && isNaN(P('')) && isNaN(P('1/0')) && isNaN(P('3 4')), 'parseNumber: nonsense is NaN');
  ok(A.normText('¿Cómo estás?') === 'como estas' && A.normText('  Él   HABLA. ') === 'el habla', 'normText: case, accents, punctuation, spacing');
  const qn = { type: 'number', answer: 0.75 };
  ok(A.check(qn, '3/4').correct && A.check(qn, '0.75').correct && !A.check(qn, '0.7').correct && A.check(qn, 'x').unreadable, 'check: number answers accept equivalent forms');
  ok(A.check({ type: 'number', answer: 31.4, tolerance: 0.05 }, '31.42').correct && !A.check({ type: 'number', answer: 31.4, tolerance: 0.05 }, '31.5').correct, 'check: tolerance');
  const qt = { type: 'text', answer: 'hablamos', accept: ['nosotros hablamos'] };
  ok(A.check(qt, 'Hablamos').correct && A.check(qt, 'nosotros hablamos').correct && !A.check(qt, 'hablan').correct && !A.check(qt, '').correct, 'check: text answers, alternates, empty');
  const qc = A.question('math7.proportional-table', 'x');
  ok(A.check(qc, qc.answerIndex).correct && A.check(qc, qc.answer).correct && !A.check(qc, (qc.answerIndex + 1) % qc.choices.length).correct, 'check: choice by index or by text');
  ok(A.fixAngles('<i>x</i> < 4 and y > 2') === '<i>x</i> &lt; 4 and y &gt; 2', 'fixAngles: loose inequality signs become entities, tags survive');

  /* ---- determinism and seeds ---- */
  const q1 = A.question('math7.add-negatives', 'seed-1'), q2 = A.question('math7.add-negatives', 'seed-1'), q3 = A.question('math7.add-negatives', 'seed-2');
  ok(JSON.stringify(q1) === JSON.stringify(q2) && q1.prompt !== q3.prompt, 'questions are deterministic from (skill, seed)');

  /* ---- mastery rules ---- */
  S.reset();
  const sid = 'math7.add-negatives';
  const wrongFor = q => q.type === 'number' ? q.answer + 1 : q.type === 'choice' ? (q.answerIndex + 1) % q.choices.length : 'zzz';
  const drive = (s, plan) => { s.items.forEach((it, k) => { const r = plan(it, k); if (r === 'hint') { E.useHint(s); E.answer(s, it.q.answer); } else if (r === 'wrong') { const w = E.answer(s, wrongFor(it.q)); if (w.correct || w.unreadable) console.log('FAIL drive: wrong answer was ' + JSON.stringify(w)); E.answer(s, it.q.type === 'choice' ? it.q.answerIndex : it.q.answer); } else if (r === 'skip') { E.reveal(s); } else E.answer(s, it.q.type === 'choice' ? it.q.answerIndex : it.q.answer); E.next(s); }); return E.finish(s); };
  let s = E.start('practice', { skillId: sid, seed: 't1' });
  ok(s.items.length === E.PRACTICE_N && new Set(s.items.map(i => i.q.prompt)).size === s.items.length, 'practice set has 7 distinct questions');
  let f = drive(s, () => 'right');
  ok(f.right === 7 && S.skill(sid).level === 3 && f.changes.length === 1 && f.changes[0].to === 3, 'practice: 7/7 first try → Proficient');
  ok(S.get().points === f.pts && f.pts === 7 * E.POINTS.correct + E.POINTS.set + E.POINTS.levelUp[3], 'practice: points = answers + set bonus + level-up bonus');
  S.reset();
  f = drive(E.start('practice', { skillId: sid, seed: 't2' }), (it, k) => k < 5 ? 'right' : 'wrong');
  ok(f.right === 5 && S.skill(sid).level === 2, 'practice: 5/7 (retries do not count) → Familiar');
  S.reset();
  f = drive(E.start('practice', { skillId: sid, seed: 't3' }), (it, k) => k < 2 ? 'right' : 'hint');
  ok(f.right === 2 && S.skill(sid).level === 1 && S.get().missed.length === 5, 'practice: hinted answers do not count; misses are saved for review');
  f = drive(E.start('practice', { skillId: sid, seed: 't4' }), () => 'right');
  ok(S.skill(sid).level === 3, 'practice: a perfect set later lifts Attempted to Proficient');
  f = drive(E.start('practice', { skillId: sid, seed: 't5' }), () => 'skip');
  ok(S.skill(sid).level === 3, 'practice never lowers a level');
  // unit test
  S.reset();
  S.setSkill('math7.abs-distance', { level: 4 });
  S.setSkill('math7.sub-negatives', { level: 3 });
  s = E.start('unit-test', { courseId: 'math-7', unitId: 'negatives-add', seed: 'u1' });
  ok(s.items.length === 3 && !s.hints && new Set(s.items.map(i => i.skillId)).size === 3, 'unit test: one question per skill, no hints');
  f = drive(s, it => it.skillId === 'math7.abs-distance' ? 'wrong' : 'right');
  ok(S.skill('math7.abs-distance').level === 3 && S.skill('math7.sub-negatives').level === 4 && S.skill('math7.add-negatives').level === 2, 'unit test: wrong → down one, right → up one, first right → Familiar');
  f = drive(E.start('unit-test', { courseId: 'math-7', unitId: 'negatives-add', seed: 'u2' }), () => 'wrong');
  ok(S.skill('math7.add-negatives').level === 1 && S.skill('math7.abs-distance').level === 2, 'unit test: misses step down, never below Attempted');
  f = drive(E.start('unit-test', { courseId: 'math-7', unitId: 'negatives-add', seed: 'u3' }), () => 'wrong');
  ok(S.skill('math7.add-negatives').level === 1, 'unit test: Attempted stays Attempted');
  // course and mastery challenge
  S.reset();
  s = E.start('course-challenge', { courseId: 'math-7', seed: 'c1' });
  const c7 = A.courseById('math-7'), n7 = A.courseSkills(c7).length;
  ok(s.items.length === Math.min(E.CHALLENGE_N, n7) && new Set(s.items.map(i => i.skillId)).size === s.items.length, 'course challenge: distinct skills from across the course');
  const unitsHit = new Set(s.items.map(i => A.whereIs(i.skillId).unit.id));
  ok(unitsHit.size === c7.units.length, 'course challenge: every unit is represented');
  let threw = false; try { E.start('mastery-challenge', { courseId: 'math-7', seed: 'm0' }); } catch (e) { threw = true; }
  ok(threw && E.masteryPool(c7).length === 0, 'mastery challenge: unavailable until something is Familiar or Proficient');
  ['math7.add-negatives', 'math7.sub-negatives'].forEach(id => S.setSkill(id, { level: 3 }));
  S.setSkill('math7.abs-distance', { level: 2 });
  S.setSkill('math7.circles', { level: 4 });
  s = E.start('mastery-challenge', { courseId: 'math-7', seed: 'm1' });
  ok(s.items.length === 3 && s.items.every(i => [2, 3].includes(S.skill(i.skillId).level)), 'mastery challenge: draws only Familiar and Proficient skills');
  f = drive(s, () => 'right');
  ok(S.skill('math7.add-negatives').level === 4 && S.skill('math7.abs-distance').level === 3, 'mastery challenge: right answers level up, Proficient → Mastered');
  // review
  S.reset();
  drive(E.start('practice', { skillId: sid, seed: 'r1' }), (it, k) => k < 4 ? 'right' : 'skip');
  ok(S.get().missed.length === 3, 'missed questions are collected');
  const missedBefore = S.get().missed.slice();
  s = E.start('review', { seed: 'r2' });
  ok(s.items.length === 3 && s.items.every((it, k) => it.seed === missedBefore[k].seed) && s.hints, 'review rebuilds the exact missed questions, with hints');
  f = drive(s, (it, k) => k === 0 ? 'right' : 'skip');
  ok(S.get().missed.length === 2 && S.skill(sid).level === 1, 'review: a right answer clears the question; levels do not change');
  // streak
  S.reset();
  const t = S.today();
  S.get().days[S.dayShift(t, -2)] = { q: 3, right: 2, pts: 10 }; S.get().days[S.dayShift(t, -1)] = { q: 1, right: 1, pts: 5 };
  ok(S.streak().days === 2 && !S.streak().today, 'streak: yesterday and the day before count, today still open');
  S.countAnswer(true);
  ok(S.streak().days === 3 && S.streak().today, 'streak: practising today extends it');
  S.get().days[S.dayShift(t, -1)] = { q: 0, right: 0, pts: 0 };
  ok(S.streak().days === 1, 'streak: a gap resets it');
  // export / import
  S.reset(); S.addPoints(123); S.setSkill(sid, { level: 2 }); S.setProfile({ name: 'Test' });
  const json = S.exportJSON();
  S.reset();
  ok(S.get().points === 0, 'reset clears points');
  S.importJSON(json);
  ok(S.get().points === 123 && S.skill(sid).level === 2 && S.get().profile.name === 'Test', 'export → import round-trips points, levels and profile');
  threw = false; try { S.importJSON('{"nope":1}'); } catch (e) { threw = true; }
  ok(threw && S.get().points === 123, 'import rejects a foreign file and keeps the data');

  /* ---- views render for every route ---- */
  S.reset();
  const go = async (hash) => { location.hash = hash; await tick(40); return document.getElementById('main'); };
  for (const h of ['#/', '#/courses', '#/progress', '#/settings', '#/search/fraction', '#/review', '#/nowhere']) {
    const m = await go(h);
    ok(text(m).length > 20, `route ${h} renders (${document.title})`);
  }
  for (const c of A.courses) {
    const m = await go('#/course/' + c.id);
    ok(m.querySelectorAll('.unit-card').length === c.units.length && text(m).includes(c.title), `course page ${c.id}: ${c.units.length} units`);
    const u = c.units[0];
    const mu = await go(`#/unit/${c.id}/${u.id}`);
    ok(mu.querySelectorAll('.skills li').length === u.skills.length + 2 && mu.querySelector(`a[href="#/worksheet/unit/${c.id}/${u.id}"]`), `unit page ${c.id}/${u.id}: ${u.skills.length} skills + test + worksheet`);
  }
  ok(document.title.includes('Procademy'), 'document title carries the brand');
  // every skill: learn article and a practice question render
  let bad = 0;
  for (const id of skillIds) {
    V.skill(root, id);
    const learn = text(root.querySelector('.learn'));
    V.practice(root, id);
    const qtext = text(root.querySelector('.question'));
    const hasAnswer = root.querySelector('#ans') || root.querySelector('#choices button');
    if (learn.length < 100 || qtext.length < 3 || !hasAnswer) { bad++; console.log('FAIL skill renders: ' + id + ` learn=${learn.length} q=${qtext.length} answer=${!!hasAnswer}`); }
  }
  ok(bad === 0, `all ${skillIds.length} skills render a learn article and a practice question`);
  // no stray entity text or raw tags visible anywhere in a batch of questions
  let stray = 0;
  for (const id of skillIds) for (const sd of ['v1', 'v2']) { const q = A.question(id, sd); const el = document.createElement('div'); el.innerHTML = q.prompt + q.hints.join('') + (q.choices || []).join(''); const tx = el.textContent; if (/&lt;|&gt;|&amp;|<\/?\w+>|undefined|NaN/.test(tx)) { stray++; if (stray < 6) console.log('FAIL stray markup in ' + id + ' ' + sd + ': ' + tx.slice(0, 120)); } }
  ok(stray === 0, 'no raw tags or entities leak into visible text');

  /* ---- the exercise player, driven like a learner ---- */
  S.reset();
  const answerCurrent = (rootEl, correct) => {
    const sess = rootEl.__session; const q = sess.items[sess.i].q;
    if (q.type === 'choice') { const k = correct ? q.answerIndex : (q.answerIndex + 1) % q.choices.length; rootEl.querySelector(`#choices button[data-k="${k}"]`).click(); }
    else { const inp = rootEl.querySelector('#ans'); inp.value = correct ? String(q.answer) : String(wrongFor(q)); inp.dispatchEvent(new Event('input', { bubbles: true })); }
    rootEl.querySelector('#check').click();
  };
  V.practice(root, 'math7.percent-of');
  ok(root.__session && root.__session.kind === 'practice' && root.querySelectorAll('.dots span').length === 7, 'player: practice shows 7 progress dots');
  for (let i = 0; i < 7; i++) {
    answerCurrent(root, true); await tick();
    if (i === 0) ok(root.querySelector('.feedback.good') && root.querySelector('#next') && !root.querySelector('#check'), 'player: a right answer shows green feedback and Next');
    root.querySelector('#next').click(); await tick();
  }
  ok(text(root.querySelector('.summary .score')) === '7 / 7' && S.skill('math7.percent-of').level === 3 && text(root).includes('Proficient'), 'player: summary shows 7 / 7 and the level-up');
  ok(text(document.getElementById('stats')).includes('⚡'), 'player: the header stats refresh after a set');
  // wrong, retry, hints, give up
  V.practice(root, 'math7.unit-rate');
  answerCurrent(root, false); await tick();
  ok(root.querySelector('.feedback.bad') && root.querySelector('#check') && root.querySelector('#ans') && !root.querySelector('#next'), 'player: a wrong answer in practice allows a retry');
  answerCurrent(root, true); await tick();
  ok(root.querySelector('.feedback.good') && root.querySelector('#next') && !E.counts(root.__session.results[0]), 'player: right on the second try, but it does not count');
  root.querySelector('#next').click(); await tick();
  const hq = root.__session.items[1].q;
  for (let k = 0; k < hq.hints.length; k++) { root.querySelector('#hint').click(); await tick(); }
  ok(root.querySelectorAll('.hints .hint').length >= hq.hints.length && root.querySelector('#next') && root.querySelector('#hint').disabled, 'player: the last hint reveals the question and offers Next');
  root.querySelector('#next').click(); await tick();
  root.querySelector('#giveup').click(); await tick();
  ok(root.querySelector('.feedback.note') && text(root.querySelector('.feedback.note')).includes(String(A.answerText(root.__session.items[2].q)).trim().split(' ')[0]) && root.querySelector('#next'), 'player: "I don’t know" shows the answer and moves on');
  // unreadable input
  root.querySelector('#next').click(); await tick();
  const inp = root.querySelector('#ans'); inp.value = 'seven'; inp.dispatchEvent(new Event('input', { bubbles: true })); root.querySelector('#check').click(); await tick();
  ok(root.querySelector('.feedback.note') && root.__session.results[3].tries === 0, 'player: an unreadable number is not counted as an attempt');
  // a test: no hints, one attempt
  V.unitTest(root, 'math-7', 'negatives-add');
  ok(!root.querySelector('#hint') && root.querySelectorAll('.dots span').length === 3, 'player: unit test has no hint button');
  answerCurrent(root, false); await tick();
  ok(root.querySelector('.feedback.bad') && root.querySelector('#next') && !root.querySelector('#check') && root.querySelector('details'), 'player: in a test a wrong answer reveals the answer and the steps');
  for (let i = 0; i < 3; i++) { root.querySelector('#next').click(); await tick(); if (i < 2) { answerCurrent(root, true); await tick(); } }
  ok(root.querySelector('.summary') && text(root.querySelector('.summary .score')) === '2 / 3', 'player: unit test summary 2 / 3');
  // keyboard: Enter checks and advances
  V.practice(root, 'math7.add-negatives');
  { const sess = root.__session, q = sess.items[0].q; const el = root.querySelector('#ans'); el.value = String(q.answer); el.dispatchEvent(new Event('input', { bubbles: true })); el.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true })); await tick(); }
  ok(root.querySelector('.feedback.good'), 'player: Enter checks the answer');
  root.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true })); await tick();
  ok(root.__session.i === 1, 'player: Enter again moves to the next question');

  /* ---- settings ---- */
  await go('#/settings');
  const main = document.getElementById('main');
  const nameEl = main.querySelector('#name'); nameEl.value = 'Sam'; nameEl.dispatchEvent(new Event('input', { bubbles: true }));
  ok(S.get().profile.name === 'Sam' && document.querySelector('[data-brand]').textContent === 'Procademy', 'settings: the name is saved; the brand stays Procademy');
  const themeEl = main.querySelector('#theme'); themeEl.value = 'dark'; themeEl.dispatchEvent(new Event('change', { bubbles: true }));
  ok(document.documentElement.getAttribute('data-theme') === 'dark', 'settings: theme applies to <html>');
  themeEl.value = 'system'; themeEl.dispatchEvent(new Event('change', { bubbles: true }));
  ok(!document.documentElement.hasAttribute('data-theme'), 'settings: system theme removes the attribute');
  await go('#/');
  ok(text(main).includes('Sam'), 'home greets by name');
  await go('#/search/negative');
  ok(text(main).includes('Adding negative numbers'), 'search finds skills by title');
  // course enrol button
  await go('#/course/math-7');
  main.querySelector('#enroll').click(); await tick();
  ok(S.get().profile.enrolled.includes('math-7') && text(main.querySelector('#enroll')).includes('Saved'), 'course: ☆ Save puts the course on the home page');
  main.querySelector('#enroll').click(); await tick();
  ok(!S.get().profile.enrolled.includes('math-7') && text(main.querySelector('#enroll')).includes('Save'), 'course: pressing it again takes it off');

  /* ---- home and courses are separate pages; saved courses go home ---- */
  S.get().profile.enrolled = []; S.save();
  await go('#/');
  ok(main.querySelector('.empty-saved') && /No saved courses yet/.test(text(main)) && !main.querySelector('.course-card'), 'home: with nothing saved, it says how to save courses');
  ok(document.querySelector('[data-nav="home"]').classList.contains('active') && !document.querySelector('[data-nav="courses"]').classList.contains('active'), 'nav: Home is its own page');
  await go('#/courses');
  ok(document.querySelector('[data-nav="courses"]').classList.contains('active') && main.querySelectorAll('.course-card').length === A.courses.length + A.cpm.length, 'courses: the Courses page lists every course and CPM book');
  const card7 = [...main.querySelectorAll('.course-card')].find(cd => text(cd).includes('7th grade math'));
  card7.querySelector('.save-btn').click(); await tick();
  ok(S.get().profile.enrolled.includes('math-7') && card7.querySelector('.save-btn').classList.contains('on') && location.hash === '#/courses', 'courses: ☆ Save on a card saves it without opening the course');
  const bookCard = [...main.querySelectorAll('.course-card')].find(cd => cd.querySelector('[data-save="cpm:cc2"]'));
  bookCard.querySelector('.save-btn').click(); await tick();
  ok(S.get().profile.enrolled.includes('cpm:cc2'), 'courses: a CPM book can be saved too');
  const find2 = main.querySelector('#course-find'); find2.value = 'algebra'; find2.dispatchEvent(new Event('input'));
  const vis = [...main.querySelectorAll('.course-card')].filter(cd => !cd.hidden).map(cd => text(cd.querySelector('h3')));
  ok(vis.length >= 2 && vis.every(t => /algebra/i.test(t)), 'courses: the search box filters as you type (' + vis.join(', ') + ')');
  await go('#/courses/Elementary');
  ok([...main.querySelectorAll('.course-card')].filter(cd => !cd.hidden).every(cd => cd.dataset.band === 'Elementary') && main.querySelector('.tab.on').textContent === 'Elementary', 'courses: the Elementary tab shows only elementary courses');
  await go('#/courses/saved');
  const savedVis = [...main.querySelectorAll('.course-card')].filter(cd => !cd.hidden);
  ok(savedVis.length === 2, 'courses: the Saved tab shows the saved course and book');
  await go('#/');
  const homeCards = [...main.querySelectorAll('.course-card')];
  ok(homeCards.length === 2 && homeCards.some(cd => text(cd).includes('7th grade math')) && homeCards.some(cd => text(cd).includes('Core Connections, Course 2')) && homeCards.every(cd => cd.querySelector('.continue')), 'home: saved courses and books show under My courses, each with Continue');
  homeCards.find(cd => text(cd).includes('Core Connections, Course 2')).querySelector('.save-btn').click(); await tick(40);
  ok(main.querySelectorAll('.course-card').length === 1 && !S.get().profile.enrolled.includes('cpm:cc2'), 'home: un-saving takes it off the home page');
  S.get().profile.enrolled = []; S.save();

  /* ---- CPM pages (a small fixture book, so the suite does not depend on the real data) ---- */
  S.reset();
  A.cpmBook({ id: 'zz', title: 'Test Book', short: 'Test', band: 'Middle school', grade: 7, icon: '📗', hue: 100, homework: 'https://homework.cpm.org/category/CC/textbook/zz',
    chapters: [{ n: 1, title: 'Integers', lessons: [

  const mb = { saved: 2, profile: { name: 'New' }, skills: { a: { level: 2, tries: 9, right: 6, sets: 2, last: 9 }, b: { level: 1, tries: 2, right: 1, sets: 1, last: 8 } }, days: { '2026-10-01': { q: 3, right: 3, pts: 30 }, '2026-10-02': { q: 7, right: 6, pts: 70 } }, log: [{ t: 2, kind: 'review' }, { t: 1, kind: 'practice' }], badges: { first: 50, perfect: 60 }, points: 250 };

  const mBlank = ACCOUNT.merge({ saved: Date.now() }, mb);

  ok(mm.skills.a.level === 3 && mm.skills.a.tries === 9 && mm.skills.b && mm.days['2026-10-01'].q === 5 && mm.days['2026-10-02'].q === 7 && mm.log.length === 2 && mm.badges.first === 50 && mm.badges.perfect === 60 && mm.points === 300 && mm.profile.name === 'New', 'accounts: merging keeps the higher level, both histories, the earliest badges; settings from the newer copy');
  // without accounts switched on, the profile still works on this device
  ACCOUNT.useBackend(null); S.reset();
  m = await go3('#/profile');
  ok(/aren’t switched on/.test(text(m.querySelector('#account'))) && m.querySelectorAll('.av-opt').length >= 20, 'profile: with accounts off it explains, and the profile still works on this device');
  m.querySelector('#pf-name').value = 'Priyaan'; m.querySelector('#pf-name').dispatchEvent(new Event('input'));
  m.querySelector('[data-emoji="🦉"]').click(); await tick(10);
  m = document.getElementById('main');
  m.querySelector('#pf-grade').value = '7'; m.querySelector('#pf-grade').dispatchEvent(new Event('change'));
  ok(S.get().profile.name === 'Priyaan' && S.get().profile.avatar.emoji === '🦉' && S.get().profile.grade === 7 && /🦉/.test(document.getElementById('avatar-btn').textContent), 'profile: name, grade and avatar are saved, and the avatar shows in the header');
  ok(TUTORPAGE.contextFor({ about: 'general', level: 'auto', style: 'steps', messages: [] }).level === '7th grade', 'profile: the tutor explains at the grade set here');
  // computer 1: some progress, then an account
  S.setSkill('math7.add-negatives', { level: 3, tries: 7, right: 7, sets: 1, last: Date.now() });
  ACCOUNT.useBackend(device());
  m = await go3('#/profile');
  const fill = (sel, v) => { const el = m.querySelector(sel); el.value = v; };
  fill('#ac-user', 'Bad Name'); fill('#ac-pass', 'mathrocks1'); fill('#ac-pass2', 'mathrocks1');
  m.querySelector('#ac-new').dispatchEvent(new Event('submit', { cancelable: true })); await tick(20);
  ok(/3 to 20 letters/.test(text(m.querySelector('#ac-new .ac-msg'))), 'accounts: a username with spaces is refused before anything is sent');
  fill('#ac-user', 'priyaan'); fill('#ac-pass', 'short'); fill('#ac-pass2', 'short');
  m.querySelector('#ac-new').dispatchEvent(new Event('submit', { cancelable: true })); await tick(20);
  ok(/at least 8/.test(text(m.querySelector('#ac-new .ac-msg'))), 'accounts: a short password is refused');
  fill('#ac-pass', 'mathrocks1'); fill('#ac-pass2', 'mathrocks1');
  m.querySelector('#ac-new').dispatchEvent(new Event('submit', { cancelable: true })); await tick(80);
  m = document.getElementById('main');
  const uid1 = server.users['priyaan@learners.procademy.invalid'] && server.users['priyaan@learners.procademy.invalid'].uid;
  ok(uid1 && server.docs[uid1] && JSON.parse(server.docs[uid1].state).skills['math7.add-negatives'].level === 3 && /Signed in as @priyaan/.test(text(m)) && document.querySelector('#avatar-btn .av-dot'), 'accounts: making an account saves this device’s progress online, and the header shows you are signed in');
  // a change is saved online by itself, a few seconds later
  S.setSkill('math7.circles', { level: 2, tries: 7, right: 5, sets: 1, last: Date.now() });
  await tick(3400);
  ok(JSON.parse(server.docs[uid1].state).skills['math7.circles'] && /Saved online/.test(text(m.querySelector('#sync-line'))), 'accounts: practice is saved online automatically');
  // log out, clearing this computer
  m.querySelector('#ac-out').click(); m.querySelector('#ac-out-yes').click(); await tick(60);
  ok(!ACCOUNT.user() && !Object.keys(S.get().skills).length && /Create an account/.test(text(m)), 'accounts: logging out clears this computer (unless a copy is kept)');
  // computer 2: a different device logs in and gets everything
  ACCOUNT.useBackend(device()); S.reset();
  m = await go3('#/profile');
  m.querySelector('[data-tab="in"]').click();
  fill('#ac-id', 'priyaan'); fill('#ac-pw-in', 'wrongpass1');
  m.querySelector('#ac-in').dispatchEvent(new Event('submit', { cancelable: true })); await tick(40);
  ok(/don’t match/.test(text(m.querySelector('#ac-in .ac-msg'))) && !ACCOUNT.user(), 'accounts: a wrong password is refused');
  fill('#ac-pw-in', 'mathrocks1');
  m.querySelector('#ac-in').dispatchEvent(new Event('submit', { cancelable: true })); await tick(80);
  ok(ACCOUNT.user() && S.skill('math7.add-negatives').level === 3 && S.skill('math7.circles').level === 2 && S.get().profile.name === 'Priyaan', 'accounts: logging in on another computer brings all the progress and the profile');
  await ACCOUNT.logOut(true);
  // a shared computer with someone else's progress: ask first
  S.reset(); S.setSkill('math8.slope', { level: 1, tries: 3, right: 1, sets: 1, last: Date.now() });
  ACCOUNT.useBackend(device());
  m = await go3('#/profile');
  m.querySelector('[data-tab="in"]').click(); fill('#ac-id', 'priyaan'); fill('#ac-pw-in', 'mathrocks1');
  m.querySelector('#ac-in').dispatchEvent(new Event('submit', { cancelable: true })); await tick(80);
  m = document.getElementById('main');
  ok(/Two sets of progress/.test(text(m)) && m.querySelector('#mg-add') && m.querySelector('#mg-replace'), 'accounts: when this computer already has other progress, it asks before mixing them');
  m.querySelector('#mg-replace').click(); await tick(80);
  ok(!S.get().skills['math8.slope'] && S.skill('math7.add-negatives').level === 3 && !JSON.parse(server.docs[uid1].state).skills['math8.slope'], 'accounts: "use only my account’s progress" leaves the other progress out of the account');
  // username taken; delete the account
  await ACCOUNT.logOut(true);
  ACCOUNT.useBackend(device());
  m = await go3('#/profile');
  fill('#ac-user', 'priyaan'); fill('#ac-pass', 'another123'); fill('#ac-pass2', 'another123');
  m.querySelector('#ac-new').dispatchEvent(new Event('submit', { cancelable: true })); await tick(40);
  ok(/already taken/.test(text(m.querySelector('#ac-new .ac-msg'))), 'accounts: a taken username says so');
  m.querySelector('[data-tab="in"]').click(); fill('#ac-id', 'priyaan'); fill('#ac-pw-in', 'mathrocks1');
  m.querySelector('#ac-in').dispatchEvent(new Event('submit', { cancelable: true })); await tick(80);
  m = document.getElementById('main');
  const realConfirm2 = window.confirm; window.confirm = () => true;
  m.querySelector('#ac-del-pw').value = 'mathrocks1'; m.querySelector('#ac-del').click(); await tick(60);
  window.confirm = realConfirm2;
  ok(!server.docs[uid1] && !server.users['priyaan@learners.procademy.invalid'] && !ACCOUNT.user(), 'accounts: deleting the account removes everything saved online');
  window.PROCADEMY_OFFLINE = { build: 'test' };
  m = await go3('#/profile');
  ok(/not in the offline file/.test(text(m.querySelector('#account'))), 'accounts: the offline file explains that accounts are on the website');
  delete window.PROCADEMY_OFFLINE;
  ACCOUNT.useBackend(null); S.reset();
  }

  { // moving progress to another computer with a link: no account, no file
  const go4 = async h => { location.hash = '#/settings'; await tick(15); return go(h); };
  const until = async (f, ms) => { for (let k = 0; k < (ms || 3000) / 25 && !f(); k++) await tick(25); return f(); };
  ACCOUNT.useBackend(null);
  S.reset(); S.setProfile({ name: 'Mover', avatar: { emoji: '🦉', hue: 265 } });
  S.setSkill('math7.add-negatives', { level: 3, tries: 7, right: 7, sets: 1, last: Date.now() });
  for (let k = 0; k < 5; k++) S.countAnswer(true);
  S.earnBadges(['first']);
  localStorage.setItem('procademy.sprints.v1', JSON.stringify({ times: { best: 22, plays: 2, weak: [{ key: '-3x4', q: '−3 × 4', a: -12 }] } }));
  m = await go4('#/profile');
  MOVE._last = null; m.querySelector('#mv-make').click();
  await until(() => MOVE._last);
  ok(MOVE._last && /#\/move\/z/.test(MOVE._last) && MOVE._last.length < 20000 && m.querySelector('.mv-url'), 'move: Profile makes a link that carries the progress, compressed (' + (MOVE._last || '').length + ' characters)');
  const code = MOVE._last.split('#/move/')[1];
  S.reset(); localStorage.removeItem('procademy.sprints.v1');
  m = await go4('#/move/' + code);
  await until(() => m.querySelector('#mv-replace'));
  ok(/Mover/.test(text(m)) && /5 questions/.test(text(m)) && m.querySelector('#mv-replace') && !m.querySelector('#mv-add'), 'move: on the other computer it shows whose progress, and how much');
  m.querySelector('#mv-replace').click(); await tick(60);
  ok(S.skill('math7.add-negatives').level === 3 && S.get().profile.name === 'Mover' && S.get().badges.first && JSON.parse(localStorage.getItem('procademy.sprints.v1')).times.weak[0].a === -12 && location.hash === '#/', 'move: the progress, profile, badges and sprint bests arrive, and the address no longer holds them');
  S.reset(); S.setSkill('math8.slope', { level: 2, tries: 7, right: 5, sets: 1, last: Date.now() }); S.countAnswer(true);
  m = await go4('#/move/' + code);
  await until(() => m.querySelector('#mv-add'));
  m.querySelector('#mv-add').click(); await tick(60);
  ok(S.skill('math8.slope').level === 2 && S.skill('math7.add-negatives').level === 3, 'move: on a computer with its own progress, adding keeps both');
  // links are untrusted
  const evil = await MOVE.pack({ app: 'procademy-move', state: { profile: { name: '<img src=x onerror="window.__moved=1">', enrolled: ['math-7', '<b>x</b>'] }, skills: { 'math7.circles': { level: '9', tries: 'lots' }, '<script>': { level: 4 } }, days: { 'not-a-day': { q: 5 }, '2026-10-01': { q: '7' } } } });
  const cl = MOVE.clean(await MOVE.unpack(evil));
  ok(cl.state.skills['math7.circles'].level === 4 && cl.state.skills['math7.circles'].tries === 0 && !cl.state.skills['<script>'] && !cl.state.days['not-a-day'] && cl.state.days['2026-10-01'].q === 7 && cl.state.profile.enrolled.join() === 'math-7', 'move: a link is rebuilt field by field: wrong types fixed, anything unknown dropped');
  m = await go4('#/move/' + evil);
  await until(() => m.querySelector('#mv-replace, #mv-add'));
  ok(!m.querySelector('.move-card img') && !window.__moved && /<img/.test(text(m.querySelector('.move-card'))), 'move: a name in a link is shown as plain text, never run');
  const bomb = await MOVE.pack({ app: 'procademy-move', pad: 'a'.repeat(4 * 1024 * 1024), state: {} });
  let refused = false; try { await MOVE.unpack(bomb); } catch (e) { refused = /too big/.test(e.message); }
  ok(refused && bomb.length < 30000, 'move: a short link built to unpack into something huge is refused');
  m = await go4('#/move/zAAAA');
  await until(() => /doesn’t work/.test(text(m)));
  ok(/doesn’t work/.test(text(m)), 'move: a broken or cut-short link says so');
  m = await go4('#/settings');
  ok(m.querySelector('#mv-make'), 'move: Settings offers it too');
  S.reset(); localStorage.removeItem('procademy.sprints.v1');
  }

  console.log(`RESULTS ${fail} failed of ${pass + fail}`);
})().catch(e => { console.log('FAIL harness threw: ' + (e.stack || e.message)); console.log('RESULTS 1 failed of 1'); });
